artifact: design-plan-spine
version: 2
granularity_profile: algorithm-bound

scope_expansion_signals:
  - id: scope-signal-arbitration-module
    kind: shared_boundary
    target_ref: component-address-arbiter
    witness: A new backend-agnostic module under src/fs/caching/ becomes the single decision point every derived-address writer reaches, so its rule binds Google Drive and OneDrive at once.
    requirement_refs: [FR-ADDR-001, FR-ADDR-003, NFR-ADDR-002]
    authority_refs:
      - 'GitHub issue #90 ("The design must decide who owns address assignment, rather than adding a fourth local rule")'
      - docs/design/design-remote-backend-implementation-contract.md
  - id: scope-signal-delta-result-shape
    kind: shared_boundary
    target_ref: contract-absence-authority
    witness: RemoteDelta, IncrementalChangesResult, IdDeltaResult and IncrementalCheckpoint.getChangedPaths all widen for all three families; 83fd2aa's enteredFolderIds is the precedent for per-call bookkeeping that is never persisted.
    requirement_refs: [FR-ADDR-005, FR-ADDR-010, NFR-ADDR-001]
    authority_refs:
      - commit 83fd2aa
      - AGENTS.md (cycle evidence never becomes another state owner)
  - id: scope-signal-identity-rename-capability
    kind: shared_boundary
    target_ref: contract-identity-addressed-rename
    witness: IFileSystem gains an optional identity-addressed rename capability and RenameAction gains an optional provider-identity input, because IFileSystem.rename (interface.ts:94) is path-addressed and the object to rename is by definition the one with no cache path.
    requirement_refs: [FR-ADDR-008, FR-ADDR-007, NFR-ADDR-002]
    authority_refs:
      - /home/take/.dev-skills/design/issue90-cache-path-id-bijection/artifacts/owner-decision.md
      - AGENTS.md ("Exact source/destination CAS is storage mechanism, not identity policy"; "Only provider-resolved metadata, or the successful endpoint of an explicit provider rename, may change cached topology")
  - id: scope-signal-contention-admission-stage
    kind: shared_boundary
    target_ref: component-contention-admission
    witness: A new Admission stage under src/sync/ originates a rename_remote from current-cycle contention facts and sets the cycle's checkpoint block; plan-admission-case-alias.ts:105 and :157 are the existing precedent for Admission originating a rename_remote from current facts.
    requirement_refs: [FR-ADDR-008, FR-ADDR-009]
    authority_refs:
      - /home/take/.dev-skills/design/issue90-cache-path-id-bijection/artifacts/owner-decision.md
      - AGENTS.md (two durable publication points; no new action kind, DAG or recovery queue)
  - id: scope-signal-sync-boundary-contested-field
    kind: shared_boundary
    target_ref: component-contention-signal
    witness: A per-cycle contended count is threaded from the caching filesystem through remote-change-source.ts, change-detector.ts, orchestrator.ts and sync-notification.ts to main.ts's status bar, because enableLogging (settings.ts:74) and showSyncNotifications (settings.ts:73) are both false by default and the status bar is the only unconditional per-cycle surface.
    requirement_refs: [FR-ADDR-011]
    authority_refs:
      - /home/take/.dev-skills/design/issue90-cache-path-id-bijection/artifacts/integrator-addendum.md (unknown-user-visible-signal promoted from unknown to requirement)
      - src/sync/remote-change-source.ts (the existing onIdentityEvidence callback this reuses)
  - id: scope-signal-harness-collision-script
    kind: critic_induced_contract
    target_ref: contract-enumeration-uniqueness-conformance
    witness: CachingRemoteFsHarness gains a collision-staging seam and the central matrix obliges every family to supply either a script or a cited non-producibility, while two families' cells rest on unsettled unknowns.
    requirement_refs: [FR-ADDR-012]
    authority_refs:
      - docs/issue/issue-20260916-no-shared-contract-pins-enumeration.md
      - AGENTS.md ("Extend a registry fixture only when the backend needs backend-specific construction data")

requirements:
  - id: FR-ADDR-001
    type: functional
    priority: must
    statement: >-
      THE shared metadata cache SHALL decide which cache path an object receives, whenever that
      path is one the cache composed itself from a provider name and a parent chain, through a
      single arbitration owner; no other writer SHALL decide a contended derived address on its
      own authority.
  - id: FR-ADDR-002
    type: invariant
    priority: must
    statement: >-
      THE shared metadata cache SHALL, after every mutation on both the full-scan and the
      incremental-delta route, hold at most one stable backend id at each cache path and at most
      one cache path for each stable backend id, with no stable id left mapped to a path that no
      longer holds it.
  - id: FR-ADDR-003
    type: invariant
    priority: must
    statement: >-
      WHEN two or more distinct stable ids claim one derived cache path within one evidence unit,
      THE cache contents and the announced facts at the close of that unit SHALL be identical for
      every permutation of the unit's claims, including the permutations in which a claimant's
      children are applied before that claimant has lost and in which the losing claimant is
      applied first.
  - id: FR-ADDR-004
    type: invariant
    priority: must
    statement: >-
      AT the close of an evidence unit, no entry whose resolved parent chain passes through a
      displaced claimant SHALL be cached, listed, stat-able or announced under the winning
      claimant's path; such entries SHALL be reported as displaced alongside their claimant.
  - id: FR-ADDR-005
    type: functional
    priority: must
    statement: >-
      WHEN any cache writer removes or withholds a live occupant, a live claimant, or any of their
      descendants because another stable id holds that cache path, THE cache SHALL name the
      contended path, the admitted id, the withheld id, every displaced descendant path and the
      reason in the value returned by the call that caused it, and SHALL emit one warn-level log
      for that contended address.
  - id: FR-ADDR-006
    type: invariant
    priority: must
    statement: >-
      A contention observed part-way through an evidence unit SHALL NOT be final: it SHALL be
      settled against the facts held at the close of the complete unit, so that a tombstone for the
      admitted id arriving later in the same unit readmits the withheld claimant; and nothing about
      that settlement SHALL survive the unit.
  - id: FR-ADDR-007
    type: invariant
    priority: must
    statement: >-
      EVERY object that existed on the provider before a contention was observed SHALL still exist
      on the provider afterwards and SHALL be reachable in the vault once synced, unless the user
      deleted it; NO object SHALL be deleted, emptied, truncated or made permanently unreachable in
      order to free a cache address, on any route, including every failure path of the remediation.
  - id: FR-ADDR-008
    type: functional
    priority: must
    statement: >-
      WHEN two claims that are both provider-resolved contend for one cache address, THE plugin
      SHALL rename on the provider the claimant that is not to keep that address, to the address
      produced by the existing conflict-suffix convention with a discriminator derived from that
      claimant's own stable id, as an action of the existing rename_remote kind authorized by
      Admission from current-cycle facts; WHERE a contending claim is not provider-resolved, NO
      rename SHALL be performed for it.
  - id: FR-ADDR-009
    type: invariant
    priority: must
    statement: >-
      WHEN a cycle observes a contention for which a remediation is owed, THAT cycle SHALL be
      checkpoint-blocked: the remote cursor SHALL NOT advance, the derived cache SHALL NOT be
      committed, and the working view SHALL be aborted, so the next cycle re-derives the same
      evidence unit from the last committed checkpoint.
  - id: FR-ADDR-010
    type: invariant
    priority: must
    statement: >-
      THE remote delta SHALL NOT report as deleted any path whose absence is attributable to a
      displacement decided within the same evidence unit; a path whose object the provider really
      removed, and a path whose parent left the tracked root, SHALL continue to be reported as
      deleted.
  - id: FR-ADDR-011
    type: functional
    priority: must
    statement: >-
      WHEN a sync cycle observes at least one contended cache address, THE plugin SHALL surface, as
      a non-error fact distinct from the error count, how many addresses were contended, through a
      surface visible to a user who has changed no settings; and the contended paths with both
      stable ids SHALL be recoverable from the log without reproducing the failure.
  - id: FR-ADDR-012
    type: functional
    priority: must
    statement: >-
      A shared contract case SHALL pin "two distinct stable ids resolving to one cache path" at the
      public filesystem boundary for every registered caching family, in both provider orderings,
      asserting the survival of both objects rather than merely a stable winner; and the central
      required-contract matrix SHALL oblige each family to supply either a collision-producing
      harness script or a cited non-producibility.
  - id: FR-ADDR-013
    type: functional
    priority: must
    statement: >-
      THE address arbitration SHALL NOT throw for a contended cache path, and every uncontested
      path SHALL continue to sync in the cycle that observes a contention, including the cycles in
      which the checkpoint is blocked.
  - id: NFR-ADDR-001
    type: non_functional
    priority: must
    statement: >-
      THIS change SHALL NOT persist a collision record, chosen-address table, disposition, failure
      reason, repair queue or recovery marker; SHALL NOT add a persistent store or a retained
      in-memory correctness owner; SHALL NOT add an instance field to AbstractMetadataCache; SHALL
      NOT bump METADATA_CACHE_VERSION or change the FileRecord shape; SHALL NOT add a
      SyncActionType, a DAG or a recovery queue; and SHALL leave sync-state-ownership-guard.test.mjs
      and sync-admission-authority-guard.test.mjs green with no fixture edits.
  - id: NFR-ADDR-002
    type: non_functional
    priority: must
    statement: >-
      THE backend-agnostic base SHALL contain no provider-specific branch, predicate or capability
      hook, and AbstractMetadataCache SHALL issue no provider request and hold no client; the
      identity-addressed rename SHALL be an optional filesystem capability in the shape the
      codebase already uses for checkpoint, never a predicate on backend identity.
  - id: NFR-ADDR-003
    type: non_functional
    priority: must
    statement: >-
      NO address the cache computed itself SHALL be stored as actual_resolved or reach
      exportRecords or the durable checkpoint as provider-resolved topology; in particular the
      disambiguated address SHALL NOT be written to the cache in advance of the rename, and becomes
      a cache address only when the provider reports the renamed object.
  - id: NFR-ADDR-004
    type: non_functional
    priority: must
    statement: >-
      RESOLVING a contention SHALL cost zero additional provider read requests on either route; the
      only provider mutation introduced SHALL be one rename per contended address per cycle, issued
      from the execution phase as an admitted action and never from the cache or from a drain.
  - id: NFR-ADDR-005
    type: non_functional
    priority: must
    statement: >-
      NO part of this change SHALL reference Logger.enabled or src/sync/sync-cycle-diagnostics.ts,
      neither of which is on main (commit 50c02c2 is not an ancestor of HEAD 60e85b0).

