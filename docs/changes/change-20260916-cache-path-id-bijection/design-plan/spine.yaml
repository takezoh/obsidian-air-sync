contracts:
  - id: contract-derived-address-arbitration
    dimension: data_model
    owner: component-address-arbiter
    requirement_refs: [FR-ADDR-001, FR-ADDR-003, FR-ADDR-013, NFR-ADDR-002]
    unit_refs: [unit-1-address-arbiter, unit-2-claim-set-assignment]
    adr_refs: [adr-cache-address-assignment-owner, adr-derived-vs-provider-keyed-address-domain]
    verification:
      - id: verify-arbitration-permutation-invariance
        tier: T0
        command: npm test -- src/fs/caching/address-arbitration.test.ts
      - id: verify-authority-tier-precedes-lowest-id
        tier: T0
        command: npm test -- src/fs/caching/address-arbitration.test.ts
      - id: verify-arbiter-pure-and-total
        tier: T1
        command: npm test -- src/fs/caching/address-arbitration.test.ts
      - id: verify-no-backend-import-in-arbiter
        tier: T1
        command: npm run lint
    partition:
      outcomes: [determinate, conflicting, inconclusive]
      default_policy: >-
        Equal ids yield no_contest. Otherwise tier 1 (actual_resolved over requested_echo) then
        tier 2 (lexicographically lowest stable id) admit exactly one claim and name the other;
        inconclusive is unreachable because both claims are in hand at the decision point. The
        function never throws and never leaves the address unoccupied. A requested_echo claim that
        loses is additionally marked as owing no provider remediation, because it addresses an
        object outside the bound sync root.
    discretion:
      - id: discretion-arbiter-outcome-spelling
        unit_ref: unit-1-address-arbiter
        question: >-
          How the arbitration outcome is spelled as a TypeScript type — a discriminated union, a
          pair of flags plus a reason, or an enum with a side record.
        scope:
          files:
            - src/fs/caching/address-arbitration.ts
          component: component-address-arbiter
          visibility: private
        escalate_when:
          - The spelling would require AbstractMetadataCache to learn a backend-specific fact or the TFile type parameter.
          - The spelling cannot express no_contest, admit_incumbent and admit_claimant plus the owes-remediation fact without a default branch.
          - The spelling forces a caller outside src/fs/caching/ to change.
        constraints:
          - The module stays pure, stateless, TFile-agnostic and free of any provider client or logger.
        preserves:
          invariant_refs: [FR-ADDR-003]
        verification_refs: [verify-arbitration-permutation-invariance]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: private
          context_scope: files
          reversibility: trivial
          verification_strength: discriminating
          runtime_risk: normal
          coupling: independent
          grounding: evidenced
  - id: contract-claim-set-assignment
    dimension: state_lifecycle
    owner: component-metadata-cache
    requirement_refs: [FR-ADDR-001, FR-ADDR-002, FR-ADDR-003, FR-ADDR-004, FR-ADDR-005, FR-ADDR-013, NFR-ADDR-001, NFR-ADDR-003]
    unit_refs: [unit-2-claim-set-assignment]
    adr_refs: [adr-cache-address-assignment-owner, adr-derived-vs-provider-keyed-address-domain]
    verification:
      - id: verify-both-permutations-equal-contents
        tier: T0
        command: npm test -- src/fs/caching/metadata-cache.test.ts
      - id: verify-setfile-returns-displacement
        tier: T0
        command: npm test -- src/fs/caching/metadata-cache.test.ts
      - id: verify-bijection-after-every-mutation
        tier: T0
        command: npm test -- src/fs/caching/metadata-cache.test.ts
      - id: verify-dropbox-pinned-tests-unmodified
        tier: T1
        command: npm test -- src/fs/dropbox/metadata-cache.test.ts
    partition:
      outcomes: [determinate, conflicting, unknown]
      default_policy: >-
        Claims are grouped by resolved path; a single claimant is written as today, a contended
        path is arbitrated, and a claim whose resolved parent chain passes through a withheld
        claimant is displaced transitively over the unit's complete claim set. Every claim is
        either placed or named as displaced; none is dropped. unknown (a claim with no resolvable
        path) is unreachable in buildFromFiles because the bare-name fallback is retained. No
        disambiguated address is written here.
    discretion:
      - id: discretion-displacement-accumulator-threading
        unit_ref: unit-2-claim-set-assignment
        question: >-
          How the displacement accumulator is threaded through setFile's private index helpers — an
          out-parameter, a returned value folded by the caller, or a stack-local collector.
        scope:
          files:
            - src/fs/caching/metadata-cache.ts
          component: component-metadata-cache
          visibility: private
        escalate_when:
          - The threading would require a new instance field on AbstractMetadataCache.
          - Any displacement survives the call that produced it.
          - The public signature of a method other than setFile, bulkLoad or buildFromFiles has to change.
        constraints:
          - No displacement may be readable by the cache itself as a later decision input.
        preserves:
          invariant_refs: [NFR-ADDR-001]
          contract_refs: [contract-absence-authority]
        verification_refs: [verify-setfile-returns-displacement]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: private
          context_scope: files
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: normal
          coupling: coupled_within_unit
          grounding: evidenced
  - id: contract-drain-settlement
    dimension: control_flow
    owner: component-delta-apply
    requirement_refs: [FR-ADDR-003, FR-ADDR-005, FR-ADDR-006, FR-ADDR-010, NFR-ADDR-001]
    unit_refs: [unit-3-drain-settlement]
    adr_refs: [adr-cache-address-assignment-owner]
    verification:
      - id: verify-folder-collision-names-children
        tier: T0
        command: npm test -- src/fs/caching/id-delta.test.ts
      - id: verify-later-tombstone-readmits-claimant
        tier: T0
        command: npm test -- src/fs/caching/id-delta.test.ts
      - id: verify-page-permutation-equal-result
        tier: T0
        command: npm test -- src/fs/caching/id-delta.test.ts
      - id: verify-two-causes-of-null-separated
        tier: T0
        command: npm test -- src/fs/caching/id-delta.test.ts
    partition:
      outcomes: [determinate, conflicting, inconclusive]
      default_policy: >-
        Every entry is applied, withheld-then-settled, displaced or tombstoned and the result names
        which. A later tombstone for the admitted id within the unit withdraws the contention
        before publication. When applyFileChange returns null, the old path is reported deleted
        unless the entry's resolved parent id is in this unit's displacement set, in which case it
        is reported displaced; the out-of-root move is the inconclusive branch and stays a
        deletion. Nothing accumulated survives the drain.
    discretion:
      - id: discretion-withheld-carrier-shape
        unit_ref: unit-3-drain-settlement
        question: >-
          How withheld claimants and displacements are held inside IdDeltaResult for the duration
          of one drain — maps keyed by contended path, flat lists re-filtered at settlement, or
          ordered queues.
        scope:
          files:
            - src/fs/caching/id-delta.ts
          component: component-delta-apply
          visibility: private
        escalate_when:
          - The chosen shape has to outlive the drain or be reachable from another cycle.
          - Settlement order at drain end changes which claimant is admitted at a still-contended address.
          - The shape needs a field on the cache or the filesystem rather than on the per-call result.
        constraints:
          - Must stay per-call bookkeeping in the same sense as enteredFolderIds (83fd2aa) — never persisted, never read by the cache.
        preserves:
          invariant_refs: [FR-ADDR-006, NFR-ADDR-001]
        verification_refs: [verify-page-permutation-equal-result]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: private
          context_scope: files
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: normal
          coupling: coupled_within_unit
          grounding: evidenced
  - id: contract-absence-authority
    dimension: integration_contract
    owner: component-caching-remote-fs
    requirement_refs: [FR-ADDR-002, FR-ADDR-005, FR-ADDR-010, FR-ADDR-013, NFR-ADDR-001]
    unit_refs: [unit-4-absence-authority]
    adr_refs: [adr-cache-address-assignment-owner]
    verification:
      - id: verify-snapshot-fixture-empty-deleted
        tier: T0
        command: npm test -- src/fs/caching/remote-fs.contract.test.ts
      - id: verify-genuine-deletion-still-reported
        tier: T0
        command: npm test -- src/fs/caching/remote-fs.contract.test.ts
      - id: verify-cursor-expiry-excludes-displaced
        tier: T0
        command: npm test -- src/fs/caching/remote-fs.contract.test.ts
      - id: verify-no-absence-decided-under-src-sync
        tier: T1
        command: npm run lint && npm run build
    partition:
      outcomes: [determinate, unknown, inconclusive]
      default_policy: >-
        Every changed path is classified modified, deleted, renamed or displaced at exactly one of
        the three producers (remote-fs.ts:374-387, remote-fs.ts:429-431, id-delta.ts's
        oldPath-and-no-newPath branch). A path whose absence is attributable to a displacement
        decided in this unit is excluded from deleted at all three; an absence whose cause cannot
        be attributed is classified exactly as main does today, which never upgrades and never
        suppresses it.
  - id: contract-no-loss-remediation
    dimension: failure_recovery
    owner: component-contention-admission
    requirement_refs: [FR-ADDR-007, FR-ADDR-008, FR-ADDR-009, FR-ADDR-011, FR-ADDR-013, NFR-ADDR-001, NFR-ADDR-003, NFR-ADDR-004]
    unit_refs: [unit-6-contention-remediation]
    adr_refs: [adr-upstream-rename-remedy, adr-rename-target-and-discriminator]
    verification:
      - id: verify-keeper-and-target-order-independent
        tier: T0
        command: npm test -- src/sync/plan-admission-address-contention.test.ts
      - id: verify-remediation-plan-partition
        tier: T0
        command: npm test -- src/sync/plan-admission-address-contention.test.ts
      - id: verify-failed-rename-leaves-cursor-uncommitted
        tier: T0
        command: npm test -- src/sync/orchestrator.test.ts
      - id: verify-two-cycle-both-objects-present
        tier: T1
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
    partition:
      outcomes: [determinate, conflicting, unknown]
      default_policy: >-
        A contention is remediable only when both claims are provider-resolved and the filesystem
        offers the identity-addressed rename capability. The keeper is the claimant holding a
        committed SyncRecord at the contended path, else the claimant the arbiter admitted; the
        other is renamed to insertConflictSuffix(path, "id-" + its stable id). When a remediation
        is owed the cycle is checkpoint-blocked, so no cursor advances past a withheld claimant.
        unknown (capability absent) is treated as not remediable: nothing is done to the provider,
        the contention is announced, and the checkpoint is not blocked because no cycle could do
        anything differently.
  - id: contract-identity-addressed-rename
    dimension: integration_contract
    owner: component-provider-rename
    requirement_refs: [FR-ADDR-007, FR-ADDR-008, NFR-ADDR-002, NFR-ADDR-004]
    unit_refs: [unit-5-identity-addressed-rename]
    adr_refs: [adr-upstream-rename-remedy, adr-rename-target-and-discriminator]
    verification:
      - id: verify-executor-renames-by-provider-identity
        tier: T0
        command: npm test -- src/sync/plan-executor.test.ts
      - id: verify-remote-only-rename-no-longer-throws
        tier: T0
        command: npm test -- src/sync/plan-executor.test.ts
      - id: verify-backend-without-capability-gets-no-action
        tier: T1
        command: npm test -- src/sync/plan-admission-address-contention.test.ts
      - id: verify-live-drive-identity-rename
        tier: T2
        command: npm run test:e2e:google
    partition:
      outcomes: [determinate, unknown, inconclusive]
      default_policy: >-
        With a provider identity supplied the executor renames by identity and never by path, and
        publishes no SyncRecord (RecordPublication already excludes rename_remote). Without the
        capability no such action is produced at all; there is no silent path-addressed fallback,
        because that would rename the keeper. The cache is updated only from the rename's
        successful endpoint, with provider authority.
  - id: contract-contention-user-signal
    dimension: user_observability
    owner: component-contention-signal
    requirement_refs: [FR-ADDR-011, NFR-ADDR-005]
    unit_refs: [unit-7-contention-signal]
    adr_refs: [adr-upstream-rename-remedy]
    verification:
      - id: verify-one-warn-per-contended-address
        tier: T0
        command: npm test -- src/fs/caching/metadata-cache.test.ts
      - id: verify-count-distinct-from-error-count
        tier: T0
        command: npm test -- src/sync/sync-notification.test.ts
      - id: verify-default-settings-status-bar-states-count
        tier: T0
        command: npm test -- src/sync/orchestrator.test.ts
      - id: verify-no-unmerged-symbol-referenced
        tier: T1
        command: npm run build
    partition:
      outcomes: [determinate, unknown]
      default_policy: >-
        A cycle that observes n contended addresses states n, as a non-error fact, in the warn log
        (path and both ids), in the cycle summary and in the status bar; emission is a function of
        contended addresses, never of descendant count. unknown is the cycle that produced no delta
        at all, where nothing is stated. Silence occurs only when the cycle observed nothing.
    discretion:
      - id: discretion-contended-summary-wording
        unit_ref: unit-7-contention-signal
        question: >-
          What exact noun and phrasing the cycle summary and status bar use for contended
          addresses, and where the clause sits relative to errors and blocked.
        scope:
          files:
            - src/sync/sync-notification.ts
          component: component-contention-signal
          visibility: private
        escalate_when:
          - The wording implies the objects were deleted or that the user lost data.
          - Conveying it needs a Notice, a modal or a new setting rather than the existing summary line and status bar.
          - The count has to be derived from anything other than the cycle's own contention report.
        constraints:
          - Follow the existing counts-only idiom of buildNotificationMessage; path and id detail belongs in the log.
        preserves:
          contract_refs: [contract-contention-user-signal]
        verification_refs: [verify-count-distinct-from-error-count]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: private
          context_scope: files
          reversibility: trivial
          verification_strength: mechanical_partial
          runtime_risk: normal
          coupling: independent
          grounding: evidenced
  - id: contract-enumeration-uniqueness-conformance
    dimension: integration_contract
    owner: component-shared-contract-conformance
    requirement_refs: [FR-ADDR-012, FR-ADDR-002, FR-ADDR-003, FR-ADDR-004, FR-ADDR-007]
    unit_refs: [unit-8-shared-contract-conformance]
    adr_refs: [adr-cache-address-assignment-owner, adr-upstream-rename-remedy]
    verification:
      - id: verify-two-ids-one-path-both-orderings
        tier: T0
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
      - id: verify-both-objects-survive-the-repair
        tier: T0
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
      - id: verify-matrix-requires-script-or-citation
        tier: T1
        command: npm run build
      - id: verify-live-onedrive-shape
        tier: T2
        command: npm run test:e2e:onedrive
    partition:
      outcomes: [determinate, unknown, inconclusive]
      default_policy: >-
        Every family supplies either a collision-producing harness script or a cited
        non-producibility naming the reason or the unsettled unknown; a missing cell stays a
        compile error through the existing satisfies at remote-backend-contracts.test.ts:23-42, and
        a declared gap carries its citation rather than silence.

