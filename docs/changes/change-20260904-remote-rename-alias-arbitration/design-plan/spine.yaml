artifact: design-plan-spine
version: 2
granularity_profile: algorithm-bound

scope_expansion_signals: []

requirements:
  - id: FR-RAA-001
    type: invariant
    priority: must
    statement: While Admission decides one connected identity component, it shall preserve the immutable raw component, invoke one private component-decision producer exactly once, evaluate exactly once, and emit exactly one existing final disposition through admitDestructivePlan.
  - id: FR-RAA-002
    type: event_driven
    priority: must
    statement: When effective authoritative reported claims form one coherent family, Admission shall select their root, direction, identity, and postcondition before any alias-only candidate and shall derive direction only from the reported side and old-to-new edge.
  - id: FR-RAA-003
    type: unwanted
    priority: must
    statement: If effective reported claims require incompatible roots, directions, identities, or postconditions, Admission shall fail the entire component with existing rename_mismatch semantics and no alias, ordinary-action, or reported-subset fallback.
  - id: FR-RAA-004
    type: conditional
    priority: must
    statement: When a selected reported folder root is materialized, its authority shall govern each and only each descendant in the same correctly directed native action after the complete mapping is proven suffix-aligned, included, endpoint-unique, exhaustive, and unambiguous.
  - id: FR-RAA-005
    type: ubiquitous
    priority: must
    statement: The system shall treat aliases only as endpoint-equivalence facts and shall never let alias spelling, presence, or a plausible action synthesize a report, select direction while an effective report exists, or authorize a descendant outside the selected proof.
  - id: FR-RAA-006
    type: compatibility
    priority: must
    statement: When the effective reported set is empty and complete current facts prove the existing local case-only parent policy, Admission shall retain child content work at provider-current paths and authorize exactly one existing parent rename_remote under the unchanged content-before-structural barrier.
  - id: FR-RAA-007
    type: invariant
    priority: must
    statement: Equal complete immutable component facts shall produce identical actions, disposition, and ordered reasons after COLD, WARM, or HOT acquisition and for Google Drive, OneDrive, or Dropbox, without temperature or provider identity as a decision input.
  - id: FR-RAA-008
    type: observable_failure
    priority: must
    statement: Admission shall apply the fixed failure-predicate precedence, deduplicate and canonically sort multi-reason results, emit only existing failure strings, and preserve the result across input permutations.
  - id: NFR-RAA-001
    type: state_boundary
    priority: must
    statement: The change shall add no persisted or public schema, migration, recovery branch, pending instruction, intermediate checkpoint, orchestrator field, correctness-critical cross-call owner, provider call, action, status, disposition, or failure reason.
  - id: NFR-RAA-002
    type: performance
    priority: must
    statement: Classification, selected-family materialization, topology indexing, and final evaluation shall perform no I/O in linear time and call-local space, with instrumented reads no greater than 32 times the total actions, descendants, evidence, observations, and scope endpoints plus 128.
  - id: NFR-RAA-003
    type: governance
    priority: must
    statement: A static guard shall reject production value imports of candidate or topology helpers outside identity-component-decision.ts and module-scope mutable correctness data in the decision/proof modules, while the existing state-owner guard remains unchanged and green.
  - id: NFR-RAA-004
    type: documentation
    priority: must
    statement: A new ADR shall explicitly supersede only stale present-tense RenameDebt and pending-retirement claims in earlier accepted ADRs; current guides and the active design shall state the stateless boundary without modifying historical ADR text or completed changes.

components:
  - id: component-identity-component-authority
    kind: existing
    contract_refs:
      - contract-single-component-admission
      - contract-authority-arbitration
      - contract-root-proof-failure-semantics
      - contract-provider-temperature-equivalence
      - contract-admission-architecture-conformance
    paths:
