      - src/sync/plan-admission-case-alias.ts
      - src/sync/local-rename-admission.ts
      - src/sync/optimize-local-renames.ts
      - src/sync/optimize-remote-renames.ts
      - src/sync/plan-admission.test.ts
  - id: component-execution-commit-boundary
    kind: existing
    contract_refs:
      - contract-execution-state-preservation
    paths:
      - src/sync/plan-executor.ts
      - src/sync/state-committer.ts
      - src/sync/sync-cycle-finalization.ts
      - sync-state-ownership-guard.test.mjs

contracts:
  - id: contract-single-component-admission
    dimension: responsibility_boundary
    owner: component-identity-component-authority
    requirement_refs:
      - FR-RAA-001
      - NFR-RAA-001
    unit_refs:
      - unit-1-pin-red-and-negative-contracts
      - unit-2-centralize-component-decision
      - unit-4-enforce-and-publish-boundary
    adr_refs:
      - adr-20260904-remote-rename-alias-arbitration
      - adr-20260831-admission-owns-identity-component-decisi
      - adr-20260903-four-stage-sync-pipeline
    verification:
      - id: verify-one-component-result
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
      - id: verify-private-component-importer
        tier: T1
        command: node --test sync-admission-authority-guard.test.mjs
    partition:
      outcomes: [determinate, unknown, inconclusive, conflicting]
      default_policy: Only the once-called private component result can be mapped by admitDestructivePlan to one existing disposition; every non-determinate result is non-executable and no caller may override it.

  - id: contract-authority-arbitration
    dimension: authority_precedence
    owner: component-identity-component-authority
    requirement_refs:
      - FR-RAA-002
      - FR-RAA-003
      - FR-RAA-005
      - FR-RAA-006
      - NFR-RAA-002
    unit_refs:
      - unit-1-pin-red-and-negative-contracts
      - unit-2-centralize-component-decision
    adr_refs:
      - adr-20260904-remote-rename-alias-arbitration
      - adr-0008-logical-identity-admission-fails-closed
    verification:
      - id: verify-reported-over-alias
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
      - id: verify-conflict-no-fallback
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
      - id: verify-linear-authority-selection
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
    partition:
      outcomes: [determinate, unknown, inconclusive, conflicting]
      default_policy: A coherent non-empty effective reported family wins, a conflicting or unprovable reported family fails without fallback, and an alias-only family is eligible only when the effective reported set is empty.

  - id: contract-root-proof-failure-semantics
    dimension: topology_and_failure_semantics
    owner: component-identity-component-authority
    requirement_refs:
      - FR-RAA-003
      - FR-RAA-004
      - FR-RAA-005
      - FR-RAA-008
      - NFR-RAA-002
    unit_refs:
      - unit-1-pin-red-and-negative-contracts
      - unit-2-centralize-component-decision
    adr_refs:
      - adr-20260904-remote-rename-alias-arbitration
      - adr-0008-logical-identity-admission-fails-closed
    verification:
      - id: verify-exact-root-descendant-proof
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
      - id: verify-stable-reason-precedence
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
      - id: verify-no-synthetic-action-authority
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
      - id: verify-affine-read-bound
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
    partition:
      outcomes: [determinate, unknown, inconclusive, conflicting]
      default_policy: Report conflict or root/action binding mismatch yields rename_mismatch; a bound but incomplete folder mapping yields incomplete_folder_mapping; non-folder deferred scope yields unknown_scope; only a complete proof can expose alias_target_mutation for an alias outside its exact pairs.
    discretion:
      - id: discretion-private-proof-index
        unit_ref: unit-2-centralize-component-decision
        question: Which collision-safe private map representation should index exact descendant pairs to their one immutable selected-root proof within a component call?
        scope:
          files:
            - src/sync/identity-component-topology.ts
          component: component-identity-component-authority
          visibility: private
        escalate_when:
          - The representation changes any exported/public type, action, disposition, reason, selected authority, exact pair, or failure precedence.
          - The representation adds another proof, module-scope or cross-call retention, non-linear rescanning, persistence, or another production owner/caller.
        constraints:
          - The returned proof is read-only after construction, references one selected immutable authority, and is discarded before Admission returns.
          - The representation preserves exact roots, direction, suffix mapping, included scope, endpoint uniqueness, exhaustive coverage, and the fixed affine read bound.
        authority:
          may_choose:
            - One ReadonlyMap keyed by a collision-safe composite endpoint pair.
            - Nested ReadonlyMaps keyed first by old endpoint and then by new endpoint.
        preserves:
          contract_refs:
            - contract-authority-arbitration
            - contract-root-proof-failure-semantics
          invariant_refs:
            - FR-RAA-001
            - FR-RAA-004
            - NFR-RAA-001
          observable_refs:
            - observable-reported-remote-wins
            - observable-exact-root-coverage
            - observable-stable-reason-array
        verification_refs:
          - verify-exact-root-descendant-proof
          - verify-stable-reason-precedence
          - verify-affine-read-bound
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: private
          context_scope: files
          reversibility: trivial
          verification_strength: discriminating
          runtime_risk: data_loss
          coupling: coupled_within_unit
          grounding: evidenced

  - id: contract-provider-temperature-equivalence
    dimension: compatibility
    owner: component-identity-component-authority
    requirement_refs:
      - FR-RAA-007
      - NFR-RAA-001
    unit_refs:
      - unit-3-prove-common-lifecycle-contracts
    adr_refs:
      - adr-0006-remote-rename-detection-is-order-independent
      - adr-20260903-stateless-current-state-recovery
      - adr-20260904-remote-rename-alias-arbitration
    verification:
      - id: verify-temperature-fact-equivalence
        tier: T1
        command: npm test -- --run src/sync/change-detector.test.ts src/sync/orchestrator.test.ts
      - id: verify-three-backend-folder-rename-contract
        tier: T1
        command: npm test -- --run tests/fs/remote-backend-contracts.test.ts
      - id: verify-provider-delta-contracts
        tier: T1
        command: npm test -- --run src/fs/googledrive/incremental-sync.test.ts src/fs/onedrive/incremental-sync.test.ts src/fs/dropbox/incremental-sync.test.ts
    partition:
      outcomes: [determinate, unknown, conflicting]
      default_policy: Equal complete provider-neutral facts have one Admission meaning; missing or ambiguous facts fail at the existing boundary, and unavailable live evidence cannot select a provider- or temperature-specific rule.

  - id: contract-execution-state-preservation
    dimension: state_lifecycle
    owner: component-execution-commit-boundary
    requirement_refs:
      - FR-RAA-006
      - FR-RAA-007
      - NFR-RAA-001
    unit_refs:
      - unit-3-prove-common-lifecycle-contracts
    adr_refs:
      - adr-0001-metadata-cache-is-subordinate-to-commit-last
      - adr-20260903-four-stage-sync-pipeline
      - adr-20260903-stateless-current-state-recovery
    verification:
      - id: verify-post-success-opposite-rename
        tier: T1
        command: npm test -- --run src/sync/orchestrator.test.ts
      - id: verify-execution-and-commit
        tier: T1
        command: npm test -- --run src/sync/plan-executor.test.ts src/sync/state-committer.test.ts src/sync/sync-cycle-finalization.test.ts
      - id: verify-state-ownership-closed
        tier: T1
        command: node --test sync-state-ownership-guard.test.mjs
    partition:
      outcomes: [determinate, inconclusive, conflicting]
      default_policy: Preserve child-content-before-parent execution, post-I/O file records, abort for every incomplete attempt, and clean-cycle-only checkpoint publication; any extra state, recovery, or ordering need is a design conflict.

  - id: contract-admission-architecture-conformance
    dimension: architecture_enforcement
    owner: component-identity-component-authority
    requirement_refs:
      - FR-RAA-001
      - FR-RAA-002
      - FR-RAA-004
      - FR-RAA-008
      - NFR-RAA-001
      - NFR-RAA-003
      - NFR-RAA-004
    unit_refs:
      - unit-4-enforce-and-publish-boundary
    adr_refs:
      - adr-20260904-remote-rename-alias-arbitration
      - adr-20260903-four-stage-sync-pipeline
      - adr-20260903-stateless-current-state-recovery
    verification:
      - id: verify-admission-authority-guard
        tier: T1
        command: node --test sync-admission-authority-guard.test.mjs
      - id: verify-existing-state-owner-guard
        tier: T1
        command: node --test sync-state-ownership-guard.test.mjs
      - id: verify-bot-and-doc-enforcement
        tier: T1
        command: npm run lint:bot-repro
      - id: verify-complete-repository-gate
        tier: T2
        command: "npm run lint && npm run lint:bot-repro && npm run build && npm run test:coverage"
    partition:
      outcomes: [determinate, unknown, conflicting]
      default_policy: A foreign helper importer, module-scope mutable proof, changed state-owner inventory, stale current authority guide, missing ADR/design promotion, or red project gate blocks completion.

