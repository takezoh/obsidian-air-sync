units:
  - title: unit-1-pin-red-and-negative-contracts
    chunk: discriminating-test-first-contract
    contract_refs:
      - contract-single-component-admission
      - contract-authority-arbitration
      - contract-root-proof-failure-semantics
    files:
      - src/sync/plan-admission.test.ts
    depends_on: []
    acceptance:
      - The production-shaped three-alias, one-remote-root, two-stable-identity recurrence is RED before production repair and expects only rename_local in the reported direction.
      - Action, evidence, and observation permutations preserve exact actions, one disposition, and exact existing reasons.
      - Conflicting reports, wrong binding/direction, partial and unknown folder mappings, non-folder unknown scope, post-proof alias mismatch, and synthetic action authority have the exact reason arrays defined by the contract and zero executable actions.
      - No-effective-report local parent behavior remains a positive compatibility control.
      - Instrumented connected fixtures of sizes 64 and 512 satisfy the fixed affine element-read cap and reject an all-pairs implementation.
    objective: Lock authority, proof, reason, and complexity observations before changing production responsibility.
    output_format: Focused Vitest RED, exact negative matrix, permutation table, and instrumented collection-read assertions.
    tool_guidance: Enter through admitBatchObservation or captureCycleAdmissionSnapshot and assert exact component count, disposition kind, actions, and ordered reasons rather than private carrier shape.
    task_boundaries: Tests only; do not edit production, weaken an existing negative, invent a reason/status/action, or encode acquisition/recovery history.
    decision_closure_reason: Approved precedence, exact coverage, fixed existing reasons, and the affine bound fully determine the observable contract.

  - title: unit-2-centralize-component-decision
    chunk: admission-authority-and-proof
    contract_refs:
      - contract-single-component-admission
      - contract-authority-arbitration
      - contract-root-proof-failure-semantics
    files:
      - src/sync/plan-admission.ts
      - src/sync/plan-admission-graph.ts
      - src/sync/identity-component-decision.ts
      - src/sync/identity-component-report-family.ts
      - src/sync/identity-component-topology.ts
      - src/sync/plan-admission-case-alias.ts
      - src/sync/local-rename-admission.ts
      - src/sync/optimize-local-renames.ts
      - src/sync/optimize-remote-renames.ts
      - src/sync/plan-admission.test.ts
    depends_on:
      - unit-1-pin-red-and-negative-contracts
    acceptance:
      - admitDestructivePlan invokes one private component-decision producer and no longer runtime-imports or sequences candidate builders.
      - The producer classifies all effective reports from raw facts, selects one coherent family or fails conflict, materializes the selected family once from raw actions, obtains one subordinate proof, evaluates once, and returns one closed result.
      - Candidate builders accept the raw component and already selected family variant and cannot reselect authority or consume another family's rewritten actions.
      - The proof begins with selected authority, covers only exact complete descendants, and never reconstructs RenameEvidence from an action.
      - The fixed reason precedence and public action/evidence/result/failure schemas remain unchanged.
      - All proof/index data is call-local, read-only after construction, and within the fixed affine read bound.
    objective: Replace ordered competing normalizers and action-derived coverage with one cohesive component decision and subordinate proof.
    output_format: Pure TypeScript responsibility refactor and focused green contract matrix.
    tool_guidance: Keep plan-admission as the public facade, identity-component-decision as its sole private producer, and topology as a data-only helper in the same component.
    task_boundaries: No provider I/O, backend branch, public provenance, second component owner, cross-family rewrite chain, post-decision override, state, recovery, action/status/disposition/reason addition, or executor change.
    decision_closure_reason: Owner, precedence, shaping boundary, proof predicates, failure partition, and lifetime are fixed; only the private exact-pair map representation is delegated.

  - title: unit-3-prove-common-lifecycle-contracts
    chunk: integration-and-compatibility
    contract_refs:
      - contract-provider-temperature-equivalence
      - contract-execution-state-preservation
    files:
      - src/sync/plan-admission.test.ts
      - src/sync/change-detector.test.ts
      - src/sync/orchestrator.test.ts
      - src/sync/plan-executor.test.ts
      - src/sync/state-committer.test.ts
      - src/sync/sync-cycle-finalization.test.ts
      - tests/fs/remote-backend-contracts.test.ts
      - tests/fs/contracts/caching-remote-fs.contract.ts
      - src/fs/googledrive/incremental-sync.test.ts
      - src/fs/onedrive/incremental-sync.test.ts
      - src/fs/dropbox/incremental-sync.test.ts
      - sync-state-ownership-guard.test.mjs
    depends_on:
      - unit-2-centralize-component-decision
    acceptance:
      - A clean local parent transition followed by an opposite provider-current folder report and unchanged local aliases authorizes one rename_local and reaches ordinary clean finalization.
      - Equal complete facts have equal Admission meaning with no acquisition-temperature or provider discriminator.
      - Child content remains before parent structure, each file record follows successful I/O, and incomplete attempts abort and withhold the checkpoint.
      - Google Drive, OneDrive, and Dropbox retain one shared folder RenamePair/current-snapshot contract and require no production backend change.
      - The existing state-owner guard passes unchanged and without fixture expansion.
    objective: Prove the Admission-only repair preserves shared acquisition, execution, and durable-state contracts end to end.
    output_format: T1 integration evidence and green existing shared/focused contracts.
    tool_guidance: Reuse central registered-family contracts and exact lifecycle cuts; optional live E2E is supplementary only.
    task_boundaries: Test changes only; do not modify provider, executor, committer, finalizer, checkpoint, state production code, ordering, retry, or recovery behavior.
    decision_closure_reason: Accepted ADRs fix all downstream behavior, so this unit verifies compatibility rather than choosing a mechanism.

  - title: unit-4-enforce-and-publish-boundary
    chunk: static-and-durable-governance
    contract_refs:
      - contract-single-component-admission
      - contract-admission-architecture-conformance
    files:
      - eslint.config.mts
      - sync-admission-authority-guard.test.mjs
      - package.json
      - docs/adr/adr-20260904-remote-rename-alias-arbitration.md
      - docs/design/design-four-stage-sync-pipeline.md
      - AGENTS.md
      - ARCHITECTURE.md
      - docs/sync-pipeline.md
      - docs/code-enforcement.md
      - docs/changes/change-20260904-remote-rename-alias-arbitration/change.md
      - docs/changes/change-20260904-remote-rename-alias-arbitration/requirements.md
      - docs/changes/change-20260904-remote-rename-alias-arbitration/implementation.md
      - docs/changes/change-20260904-remote-rename-alias-arbitration/verification.md
    depends_on:
      - unit-2-centralize-component-decision
      - unit-3-prove-common-lifecycle-contracts
    acceptance:
      - The new AST guard rejects a module-scope proof Map, mutable top-level declarations, and every unapproved production helper importer while admitting the declared pure module shape.
      - ESLint permits candidate/topology runtime imports only in identity-component-decision and keeps all involved modules pure.
      - The existing state-owner guard remains unchanged and green, and lint:bot-repro runs both guards.
      - The proposed ADR records the approved design and clause-level supersession without editing accepted ADR history; active design and current guides state the same boundary.
      - The docs conformance checks and complete repository gate pass without exceptions or weakened fixtures.
    objective: Make the repaired ownership and no-state boundary mechanically durable and publish its current normative documentation.
    output_format: Independent TypeScript-AST guard, tightened lint graph, proposed ADR, persistent-design promotion, current-guide alignment, and recorded full-gate evidence.
    tool_guidance: Use closed import/declaration inventories and synthetic negatives; supersede stale historical clauses in the new ADR rather than rewriting accepted files.
    task_boundaries: Do not modify accepted ADR files or completed changes, broaden lint exceptions, widen the state-owner fixture, add runtime counters, or claim optional live evidence.
    decision_closure_reason: The user-approved structural boundary and critique-fixed guard/doc requirements determine all governance surfaces.

acceptance:
  - id: AC-RAA-001
    criteria: The exact three-alias, one-reported-remote-folder, two-stable-identity recurrence produces one authorized disposition containing only rename_local TemplateS to Templates and no failure, with or without the former parent-alias normalization opportunity.
    requirement_refs:
      - FR-RAA-001
      - FR-RAA-002
      - FR-RAA-005
  - id: AC-RAA-002
    criteria: Incompatible normative reports or an unbound/wrong-direction selected report produce exactly rename_mismatch and zero executable actions regardless of alias completeness or input order.
    requirement_refs:
      - FR-RAA-003
      - FR-RAA-008
  - id: AC-RAA-003
    criteria: A selected reported folder root governs every and only exact complete included unique descendant pairs; partial or unknown-scope mappings produce incomplete_folder_mapping, while an alias outside an otherwise complete proof produces alias_target_mutation, all with zero actions.
    requirement_refs:
      - FR-RAA-004
      - FR-RAA-005
      - FR-RAA-008
  - id: AC-RAA-004
    criteria: Without an effective report, the existing complete local case-only parent component retains provider-current child content work and exactly one parent rename_remote executed after content.
    requirement_refs:
      - FR-RAA-006
  - id: AC-RAA-005
    criteria: Equal complete facts yield identical actions, disposition, and ordered reasons across COLD, WARM, HOT and provider namespaces, while all registered backends retain the shared folder RenamePair/current-snapshot contract.
    requirement_refs:
      - FR-RAA-007
  - id: AC-RAA-006
    criteria: Classification, one-family materialization, one proof index, and one final fold satisfy the fixed affine element-read cap with no provider I/O or production counter.
    requirement_refs:
      - NFR-RAA-002
  - id: AC-RAA-007
    criteria: The new static guard rejects a module-scope proof cache and foreign helper importer, lint runs it, and the existing state-owner/checkpoint guard remains unchanged and green with no public or persisted state change.
    requirement_refs:
      - NFR-RAA-001
      - NFR-RAA-003
  - id: AC-RAA-008
    criteria: The proposed ADR explicitly supersedes stale present-tense debt clauses without modifying accepted history; current guides and active design state the stateless single-owner boundary and the complete project gate passes.
    requirement_refs:
      - NFR-RAA-004

