artifact: design-plan-spine
version: 2
granularity_profile: boundary-complete

scope_expansion_signals:
  - id: scope-signal-shared-cache-owner
    kind: shared_boundary
    target_ref: contract-complete-cache-checkpoint
    witness: Executor and delta paths mutate one inherited live cache, so the fix belongs at its shared clean-checkpoint owner rather than in one provider rename path.
    requirement_refs: [FR-CCR-02, FR-CCR-03]
    authority_refs: [adr-0001-commit-last-cache, adr-0002-shared-backends]
  - id: scope-signal-state-rule-enforcement
    kind: post_consultation_decision
    target_ref: contract-state-boundary-enforcement
    witness: The defect followed silent growth of state ownership, so the repair must make the original closed authority and Orchestrator field boundaries mechanically visible.
    requirement_refs: [FR-CCR-01, NFR-CCR-01]
    authority_refs: [adr-0001-commit-last-cache]

requirements:
  - id: FR-CCR-01
    type: invariant
    priority: must
    statement: "Keep exactly two authoritative durable sync states: the remote cursor committed after a wholly clean cycle and each terminal SyncRecord committed after successful admitted file I/O."
  - id: FR-CCR-02
    type: event_driven
    priority: must
    statement: When a cycle is wholly clean, snapshot the complete final live remote metadata cache under its mutex and atomically replace it with the committed remote cursor.
  - id: FR-CCR-03
    type: unwanted
    priority: must
    statement: Remove touchedPaths and pendingFullPersist without adding affected-path, pending-full, receipt, relation, or recovery correctness state.
  - id: FR-CCR-04
    type: event_driven
    priority: must
    statement: On first open by the repaired release, cold-start metadata cache version 3 as version 4 and SyncState version 7 as version 8 so current facts rebuild both stores.
  - id: FR-CCR-05
    type: compatibility
    priority: must
    statement: Recover only a baseline-free file-level local case rename proven by exact current endpoints, unique remote identity, stat-absent remote target, and equal content, with final authorization in Admission and no persisted state.
  - id: NFR-CCR-01
    type: maintainability
    priority: must
    statement: Pin the exact two-authority catalog and reviewed SyncOrchestrator instance-field inventory through coordinated documentation and a normal-gate source contract.

components:
  - id: component-cache-checkpoint
    kind: existing
    contract_refs: [contract-complete-cache-checkpoint, contract-metadata-cache-cold-start]
    paths:
      - src/fs/caching/remote-fs.ts
      - src/store/metadata-store.ts
      - src/fs/caching/remote-fs.contract.test.ts
      - tests/fs/contracts/caching-remote-fs.contract.ts
      - src/fs/googledrive/index.test.ts
      - src/store/metadata-store.test.ts
  - id: component-file-commit
    kind: existing
    contract_refs: [contract-syncstate-cold-start, contract-state-boundary-enforcement]
    paths:
      - src/sync/state-committer.ts
      - src/sync/state.ts
      - src/sync/sync-cycle-finalization.ts
  - id: component-state-boundary-guard
    kind: planned
    contract_refs: [contract-state-boundary-enforcement]
    paths:
      - AGENTS.md
      - docs/adr/0001-metadata-cache-is-subordinate-to-commit-last.md
      - docs/code-enforcement.md
      - src/sync/orchestrator.ts
      - src/sync/state-boundary.test.ts
  - id: component-current-case-recovery
    kind: existing
    contract_refs: [contract-current-case-recovery]
    paths:
      - src/fs/local/index.ts
      - src/fs/local/dot-path-adapter.ts
      - src/sync/change-detector.ts
      - src/sync/current-state-case-rename.ts
      - src/sync/local-rename-admission.ts
      - src/sync/plan-admission.ts
      - src/sync/plan-executor.ts

contracts:
  - id: contract-complete-cache-checkpoint
    dimension: complete subordinate projection at the clean cursor boundary
    owner: component-cache-checkpoint
    requirement_refs: [FR-CCR-01, FR-CCR-02, FR-CCR-03]
    unit_refs: ["Unit 1 — Complete final cache snapshot", "Unit 4 — State ownership enforcement and integration"]
    adr_refs: [adr-0001-commit-last-cache, adr-0002-shared-backends]
    verification:
      - id: verify-cache-projection-shared
        tier: T1
        command: npm test -- --run tests/fs/remote-backend-contracts.test.ts
      - id: verify-google-restart-projection
        tier: T1
        command: npm test -- --run src/fs/googledrive/index.test.ts
      - id: verify-cache-persist-failure
        tier: T1
        command: npm test -- --run src/fs/caching/remote-fs.contract.test.ts
    partition:
      outcomes: [determinate, inconclusive]
      default_policy: Persist one complete live snapshot only on clean finalization; propagate failure and leave the prior durable cursor/cache transaction unchanged.
    discretion:
      - id: discretion-private-snapshot-helper
        unit_ref: "Unit 1 — Complete final cache snapshot"
        question: Choose the private helper shape for obtaining the complete live cache snapshot under the existing mutex.
        scope:
          files: [src/fs/caching/remote-fs.ts]
          component: component-cache-checkpoint
          visibility: private
        escalate_when:
          - The implementation needs a new field, public API, incremental write-set, or second persistence boundary.
        constraints:
          - Use the existing atomic metadata store transaction.
          - Snapshot every live cache entry regardless of mutation origin.
        preserves:
          contract_refs: [contract-complete-cache-checkpoint]
          invariant_refs: [invariant-two-authorities, invariant-no-pending-cache-state]
          observable_refs: [observable-restart-restores-final-cache, observable-failed-checkpoint-restores-prior-cache]
        verification_refs: [verify-cache-projection-shared, verify-google-restart-projection, verify-cache-persist-failure]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: component
          context_scope: files
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: data_loss
          coupling: independent
          grounding: evidenced
  - id: contract-metadata-cache-cold-start
    dimension: one-time derived metadata reset
    owner: component-cache-checkpoint
    requirement_refs: [FR-CCR-04]
    unit_refs: ["Unit 2 — Versioned persistence cold-start", "Unit 4 — State ownership enforcement and integration"]
    adr_refs: [adr-0001-commit-last-cache, adr-0008-fail-closed-identity]
    verification:
      - id: verify-metadata-version-drop
        tier: T1
        command: npm test -- --run src/store/metadata-store.test.ts
    partition:
      outcomes: [determinate, inconclusive]
      default_policy: Drop and recreate prior-version derived metadata so the ordinary no-checkpoint COLD path rebuilds it.
    discretion: []
  - id: contract-syncstate-cold-start
    dimension: one-time incompatible path-identity reset
    owner: component-file-commit
    requirement_refs: [FR-CCR-04, FR-CCR-05]
    unit_refs: ["Unit 2 — Versioned persistence cold-start", "Unit 3 — Current case-only recovery", "Unit 4 — State ownership enforcement and integration"]
    adr_refs: [adr-0001-commit-last-cache, adr-0008-fail-closed-identity]
    verification:
      - id: verify-sync-record-reset
        tier: T1
        command: npm test -- --run src/sync/state.test.ts
      - id: verify-ordinary-cold-rebuild
        tier: T1
        command: npm test -- --run src/sync/orchestrator.test.ts
    partition:
      outcomes: [determinate, inconclusive]
      default_policy: Drop and recreate v7 terminal state; recover a case-only alias only through the strict current-fact contract, otherwise remain fail-closed.
    discretion: []
  - id: contract-current-case-recovery
    dimension: baseline-free case-only convergence from complete current proof
    owner: component-current-case-recovery
    requirement_refs: [FR-CCR-04, FR-CCR-05]
    unit_refs: ["Unit 3 — Current case-only recovery", "Unit 4 — State ownership enforcement and integration"]
    adr_refs: [adr-0008-fail-closed-identity]
    verification:
      - id: verify-local-actual-casing
        tier: T1
        command: npm test -- --run src/fs/local/local-fs.test.ts
      - id: verify-current-case-evidence
        tier: T1
        command: npm test -- --run src/sync/change-detector.test.ts
      - id: verify-current-case-admission
        tier: T1
        command: npm test -- --run src/sync/plan-admission.test.ts src/sync/orchestrator.test.ts
    partition:
      outcomes: [determinate, inconclusive, conflicting]
      default_policy: Shape one rename_remote only when exact current endpoint, identity, scope, hash, and size proof is complete; otherwise preserve the existing fail-closed decision.
    discretion: []
  - id: contract-state-boundary-enforcement
    dimension: closed authority and orchestrator state inventory
    owner: component-state-boundary-guard
    requirement_refs: [FR-CCR-01, FR-CCR-03, FR-CCR-05, NFR-CCR-01]
    unit_refs: ["Unit 4 — State ownership enforcement and integration"]
    adr_refs: [adr-0001-commit-last-cache, adr-0008-fail-closed-identity]
    verification:
      - id: verify-state-boundary-source-contract
        tier: T1
        command: npm test -- --run src/sync/state-boundary.test.ts
      - id: verify-full-gate
        tier: T1
        command: "npm run lint && npm run lint:bot-repro && npm run build && npm run test:coverage"
    partition:
      outcomes: [determinate, conflicting]
      default_policy: Reject authority-catalog, SyncOrchestrator-field, or pending-cache-owner drift until the governing architecture is revised explicitly.
    discretion:
      - id: discretion-source-parser
        unit_ref: "Unit 4 — State ownership enforcement and integration"
        question: Choose a deterministic source parsing mechanism for the exact instance-field inventory.
        scope:
          files: [src/sync/state-boundary.test.ts]
          component: component-state-boundary-guard
          visibility: private
        escalate_when:
          - The guard requires production runtime metadata, a broad lint disable, or a non-deterministic parser.
        constraints:
          - Run in the existing unit-test gate without network access.
          - Report the added or removed field names on mismatch.
        preserves:
          contract_refs: [contract-state-boundary-enforcement]
          invariant_refs: [invariant-two-authorities, invariant-orchestrator-field-inventory]
          observable_refs: [observable-unreviewed-state-drift-fails]
        verification_refs: [verify-state-boundary-source-contract]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: component
          context_scope: files
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: normal
          coupling: independent
          grounding: evidenced

adrs:
  - id: adr-0001-commit-last-cache
    status: accepted
    decision_input_refs: [decision-input-authority-ownership, decision-input-checkpoint-projection, decision-input-existing-vault-recovery]
  - id: adr-0002-shared-backends
    status: accepted
    decision_input_refs: [decision-input-provider-coverage]
  - id: adr-0008-fail-closed-identity
    status: accepted
    decision_input_refs: [decision-input-admission-scope]

units:
  - title: "Unit 1 — Complete final cache snapshot"
    chunk: complete-cache-checkpoint
    contract_refs: [contract-complete-cache-checkpoint]
    files:
      - src/fs/caching/remote-fs.ts
      - src/fs/caching/remote-fs.contract.test.ts
      - tests/fs/contracts/caching-remote-fs.contract.ts
      - tests/fs/remote-backend-contracts.test.ts
      - src/fs/googledrive/index.test.ts
      - src/sync/orchestrator.test.ts
    depends_on: []
    acceptance:
      - Every clean checkpoint persists the complete final live cache with the cursor.
      - Restart after executor rename restores no stale old-casing path.
      - touchedPaths and pendingFullPersist are absent and no equivalent pending field is added.
      - Cache persistence adds no Admission or identity behavior.
    objective: Replace origin-sensitive incremental cache bookkeeping with the one complete clean-boundary snapshot required by ADR 0001.
    output_format: Shared TypeScript cache change and focused/shared Vitest regressions.
    tool_guidance: Start from the Google restart failure, simplify commitCheckpoint to one complete snapshot, then run the central backend contract.
    task_boundaries: Do not change provider operations, cursor timing, Admission, SyncState, or Orchestrator behavior.
    decision_closure_reason: Owner, clean boundary, complete snapshot, failure behavior, and forbidden replacement state are fixed; only private helper shape remains.
  - title: "Unit 2 — Versioned persistence cold-start"
    chunk: persistence-cold-start
    contract_refs: [contract-metadata-cache-cold-start, contract-syncstate-cold-start]
    files:
      - src/store/metadata-store.ts
      - src/store/metadata-store.test.ts
      - src/sync/state.ts
      - src/sync/state.test.ts
      - src/sync/orchestrator.test.ts
    depends_on: ["Unit 1 — Complete final cache snapshot"]
    acceptance:
      - Opening metadata version 3 as version 4 drops and recreates only metadata stores.
      - Opening SyncState version 7 as version 8 drops and recreates terminal record and merge-base stores.
      - The missing checkpoint and baseline select ordinary COLD acquisition.
    objective: Discard the known-bad projection and incompatible path identity once, each through its existing schema owner.
    output_format: Two version constant changes and focused persistence/orchestration tests.
    tool_guidance: Seed both databases independently, open the repaired versions, and assert both reset without migration or cross-store coordination.
    task_boundaries: No migration, dual-store transaction, persisted relation, recovery state, or first-run status.
    decision_closure_reason: The reset target, retained authority, and ordinary recovery path are fixed with no implementation discretion.
  - title: "Unit 3 — Current case-only recovery"
    chunk: current-case-recovery
    contract_refs: [contract-current-case-recovery]
    files:
      - src/fs/local/index.ts
      - src/fs/local/dot-path-adapter.ts
      - src/fs/local/local-fs.test.ts
      - src/__mocks__/obsidian.ts
      - src/sync/change-detector.ts
      - src/sync/current-state-case-rename.ts
      - src/sync/change-detector.test.ts
      - src/sync/local-rename-admission.ts
      - src/sync/plan-admission.ts
      - src/sync/plan-admission.test.ts
      - src/sync/plan-executor.ts
      - src/sync/plan-executor.test.ts
      - src/sync/orchestrator.test.ts
    depends_on: ["Unit 2 — Versioned persistence cold-start"]
    acceptance:
      - Stale case-colliding vault-index aliases resolve to one adapter-proven physical spelling while genuine case-sensitive siblings remain.
      - Equal-byte, unique-identity current facts emit one cycle-local case-only candidate; unequal bytes emit none.
      - Admission independently revalidates exact endpoints, absent remote target, identity, scope, hash, size, and no-baseline proposal before one rename_remote.
      - Executor re-observes before the effect and requires terminal old-absence, new-identity, and equal-byte proof before SyncRecord commit.
      - The candidate and decision add no persistent store, SyncRecord field, status, or Orchestrator field.
    objective: Restore convergence for an already-reset vault from strict current proof without creating another state owner.
    output_format: Narrow TypeScript observation/admission changes and focused Vitest regressions.
    tool_guidance: Prove physical casing at LocalFs, acquire candidate facts in Observation, authorize only in Admission, and keep counterexamples fail-closed.
    task_boundaries: No general rename inference, folder inference, status/action vocabulary extension, persistent evidence, or executor-side action invention.
    decision_closure_reason: The exact recoverable shape, authority boundary, negative cases, and state prohibition are fixed.
  - title: "Unit 4 — State ownership enforcement and integration"
    chunk: state-boundary-enforcement
    contract_refs: [contract-complete-cache-checkpoint, contract-metadata-cache-cold-start, contract-syncstate-cold-start, contract-state-boundary-enforcement]
    files:
      - docs/adr/0001-metadata-cache-is-subordinate-to-commit-last.md
      - AGENTS.md
      - docs/code-enforcement.md
      - src/sync/orchestrator.ts
      - src/sync/state-boundary.test.ts
    depends_on: ["Unit 1 — Complete final cache snapshot", "Unit 2 — Versioned persistence cold-start", "Unit 3 — Current case-only recovery"]
    acceptance:
      - All three governing documents name exactly cursor and SyncRecord as authorities and checkpoint as an operation.
      - The source guard accepts only the reviewed SyncOrchestrator instance fields and rejects an added field.
      - The source guard rejects reintroduced pending cache state.
      - Focused checks and the full repository gate pass with only the declared cycle-local case-only identity diff.
    objective: Make silent growth of sync state ownership a mechanical failure in the normal development gate.
    output_format: Narrow architecture documentation, a deterministic source-contract test, and recorded gate evidence.
    tool_guidance: Derive the exact field list from the final source, make mutation counterexamples fail, then run the full gate.
    task_boundaries: No production registry, runtime reflection, lint disable, Orchestrator behavior change, or authority exception.
    decision_closure_reason: Documents, guarded inventory, failure protocol, and normal-gate integration are fixed; only deterministic parser choice remains.

acceptance:
  - id: AC-CCR-01
    criteria: A clean restart restores exactly the final live remote metadata projection after every cache mutation family.
    requirement_refs: [FR-CCR-02]
  - id: AC-CCR-02
    criteria: A failed cycle or checkpoint advances no cursor/cache transaction and uses no pending cache correctness state.
    requirement_refs: [FR-CCR-01, FR-CCR-03]
  - id: AC-CCR-03
    criteria: Metadata cache v3 is recreated as v4 and SyncState v7 is recreated as empty v8 state.
    requirement_refs: [FR-CCR-04]
  - id: AC-CCR-04
    criteria: A baseline-free case alias converges only from complete current proof; incomplete or conflicting proof remains fail-closed and no result is persisted.
    requirement_refs: [FR-CCR-05]
  - id: AC-CCR-05
    criteria: Documentation and the source contract reject a third authority, a new SyncOrchestrator field, or restored pending cache state.
    requirement_refs: [FR-CCR-01, FR-CCR-03, NFR-CCR-01]

dispositions:
  - decision_input_ref: decision-input-authority-ownership
    disposition: "Keep exactly two authoritative durable states: clean-cycle remote cursor and per-file terminal SyncRecord; checkpoint is the cursor commit operation."
    adr_refs: [adr-0001-commit-last-cache]
    contract_refs: [contract-complete-cache-checkpoint, contract-state-boundary-enforcement]
  - decision_input_ref: decision-input-checkpoint-projection
    disposition: Replace touched-path incremental persistence with a complete live-cache snapshot in the existing atomic cursor transaction.
    adr_refs: [adr-0001-commit-last-cache]
    contract_refs: [contract-complete-cache-checkpoint]
  - decision_input_ref: decision-input-existing-vault-recovery
    disposition: Bump metadata cache 3 to 4 and SyncState 7 to 8; rebuild from current facts and use strict cycle-local case proof when the removed baseline is needed only to establish casing continuity.
    adr_refs: [adr-0001-commit-last-cache]
    contract_refs: [contract-metadata-cache-cold-start, contract-syncstate-cold-start]
  - decision_input_ref: decision-input-admission-scope
    disposition: Keep authorization in Admission; accept only the exact baseline-free case-only proof, retain existing fail-closed reasons otherwise, and persist neither evidence nor result.
    adr_refs: [adr-0008-fail-closed-identity]
    contract_refs: [contract-syncstate-cold-start, contract-current-case-recovery, contract-state-boundary-enforcement]
  - decision_input_ref: decision-input-provider-coverage
    disposition: Verify the shared complete-snapshot behavior through the central Google Drive, Dropbox, and OneDrive contract matrix plus the focused Google restart witness.
    adr_refs: [adr-0002-shared-backends]
    contract_refs: [contract-complete-cache-checkpoint]
