acceptance:
- criteria: 'By verify-fact-projection: Unit test over fabricated SyncCycleOutcome
    values asserting the projected operation, status, kind, and the representative
    selection order. (tier T1, command npm test)'
  id: UAC-001
  requirement_refs:
  - req-failure-fact-single-owner
  - req-classification-matches-applied-policy
  - req-representative-selection
  - req-unclassified-marker
- criteria: 'By verify-classification-carrier: Unit test over plan-executor''s executeAction
    asserting that a provider re-tagged 403 failure records the FailedAction carrying
    the applied rateLimit kind, and that the projection uses that carried kind instead
    of the neutral 403 permission default. (tier T1, command npm test)'
  id: UAC-002
  requirement_refs:
  - req-classification-matches-applied-policy
- criteria: 'By verify-format-clause: Unit test asserting the exact clause for a 401,
    403, 404, 429, 5xx and a provider-translated failure, and for a null classification.
    (tier T1, command npm test)'
  id: UAC-003
  requirement_refs:
  - req-notice-no-user-instructions
  - req-notice-privacy
  - req-unclassified-marker
  - req-representative-selection
  - req-notice-one-breakdown-per-cycle
- criteria: 'By verify-format-privacy: Unit test feeding hostile fact values (path-like,
    token-like, provider-message-like strings) and asserting none appears in the output
    and no instruction verb is present. (tier T1, command npm test)'
  id: UAC-004
  requirement_refs:
  - req-notice-privacy
  - req-notice-no-user-instructions
- criteria: 'By verify-routing-sites: Orchestrator and main tests injecting a notifier
    and asserting the emitted notices carry the clause and no raw message on each
    failure path. (tier T1, command npm test)'
  id: UAC-005
  requirement_refs:
  - req-notice-one-breakdown-per-cycle
  - req-abort-notice-covered
  - req-notice-no-user-instructions
  - req-log-optin-unchanged
- criteria: 'By verify-routing-gating: Tests asserting one notice per burst with showSyncNotifications
    on and off, no per-file notice for a many-failure partial cycle, and the abort
    notice present with notifications off. (tier T1, command npm test)'
  id: UAC-006
  requirement_refs:
  - req-notice-one-breakdown-per-cycle
  - req-abort-notice-covered
- criteria: 'By verify-log-preservation: Backend-error-log tests asserting a nested
    provider code survives in the logged body and that no projection or path stripping
    is applied. (tier T1, command npm test)'
  id: UAC-007
  requirement_refs:
  - req-log-evidence-preserved
- criteria: 'By verify-log-optin: Logger tests asserting no line is written with logging
    disabled, the settings shape is unchanged, and the notice breakdown is produced
    independently of the log. (tier T1, command npm test)'
  id: UAC-008
  requirement_refs:
  - req-log-optin-unchanged
- criteria: 'By verify-doc-pointer: Documentation check over docs/error-handling.md
    only, asserting it references src/backend-api/error-classification.ts and contains
    no removed fs/errors pointer; historical change records under docs/changes are
    deliberately out of scope. (tier T0, command rg -n "src/backend-api/error-classification"
    docs/error-handling.md)'
  id: UAC-009
  requirement_refs:
  - req-error-doc-pointer
