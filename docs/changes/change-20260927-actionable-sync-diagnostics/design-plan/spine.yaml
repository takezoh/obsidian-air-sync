  - src/sync/plan-executor.test.ts
  - src/sync/execution-result.ts
  objective: Project a cycle's user-visible failures into a bounded, ordered list
    of failure facts carrying an operation label, the HTTP status when present, and
    the neutral classification the applied retry policy used, held in memory for the
    current cycle only.
  output_format: Source changes and discriminating tests limited to the listed files;
    no new setting, command or persisted field.
