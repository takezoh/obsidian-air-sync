scope_expansion_signals:
  - id: scope-signal-detached-provider-observation
    kind: post_consultation_decision
    target_ref: contract-detached-targeted-observation
    witness: User authority requires the opened file to run ahead without consuming the global batch, which requires a detached identity/ancestry observation on every provider.
    requirement_refs: [FR-FAST-PASS-01, FR-FAST-PASS-03, FR-FAST-PASS-10]
    authority_refs:
      - /home/take/.dev-skills/design/fast-pass-remote-freshness/artifacts/authority-consultation.json
      - /tmp/review-verdict-obsidian-air-sync.json
  - id: scope-signal-priority-safe-point
    kind: post_consultation_decision
    target_ref: contract-cooperative-priority-safe-point
    witness: A whole-batch mutex contradicts priority; normal action admission needs a lifecycle lease and cooperative quiescent safe point.
    requirement_refs: [FR-FAST-PASS-01, FR-FAST-PASS-04, FR-FAST-PASS-09]
    authority_refs:
      - /home/take/.dev-skills/design/fast-pass-remote-freshness/artifacts/authority-consultation.json
      - /tmp/review-verdict-obsidian-air-sync.json
  - id: scope-signal-action-cas-replan
    kind: critic_induced_contract
    target_ref: contract-path-mutation-cas
    witness: Priority and a frozen normal plan can overlap, so both mutation paths require expected record/local/remote stamps and stale-action replan.
    requirement_refs: [FR-FAST-PASS-05, FR-FAST-PASS-07, FR-FAST-PASS-08, FR-FAST-PASS-11]
    authority_refs:
      - /tmp/review-verdict-obsidian-air-sync.json
      - docs/adr/0001-metadata-cache-is-subordinate-to-commit-last.md

requirements:
  - id: FR-FAST-PASS-01
    type: event-driven
    priority: must
    statement: When an eligible synced file is opened, complete its proved non-structural remote update before every normal action not started when the request was enqueued.
  - id: FR-FAST-PASS-02
    type: conditional
    priority: must
    statement: Reject no-record, excluded, unavailable, or locally changed opens before provider I/O and return typed no-op outcomes for unchanged or unsafe remote states.
  - id: FR-FAST-PASS-03
    type: ubiquitous
    priority: must
    statement: Targeted file-open observation and read must not mutate or consume global cache, cursor, checkpoint generation, or shared provider anchors.
  - id: FR-FAST-PASS-04
    type: state-driven
    priority: must
    statement: After priority enqueue, admit no new normal action; let already-started indivisible actions finish, drain priority at quiescence, and check again before finalization.
  - id: FR-FAST-PASS-05
    type: conditional
    priority: must
    statement: Hold one path-local Air Sync mutation lease across final record/local/tracker revalidation, LocalFs.write, record CAS, post-write tracker/content observation, and generation-specific acknowledgement; abort edits observed before mutation and leave edits observed during or after dirty and unacknowledged, without claiming atomic exclusion of simultaneous external adapter writes.
  - id: FR-FAST-PASS-06
    type: conditional
    priority: must
    statement: Require request-local authoritative complete ancestry from expected remote identity to the current configured root identity at the opened relative path; Dropbox consumes src/fs/caching/remote-fs.ts::CachingRemoteFs.rootFolderId inherited by src/fs/dropbox/index.ts::DropboxFs, populated from src/fs/dropbox/provider-base.ts::DropboxBackendData.remoteVaultFolderId (typed settings.backendData.remoteVaultFolderId) through src/fs/pkce-app-folder-provider.ts::PkceAppFolderProvider.createFs, without reading/writing the shared root-path anchor or adding durable authority; same-id root rename preserves the relative path, while missing/malformed identity, mismatch, or ambiguity performs no priority write.
  - id: FR-FAST-PASS-07
    type: state-driven
    priority: must
    statement: Validate every not-yet-started normal action; classify frozen V1 older than applied V2 as superseded/no-op, and defer incomparable ordering while blocking clean checkpoint.
  - id: FR-FAST-PASS-08
    type: state-driven
    priority: must
    statement: Return exhaustive typed priority failures and hand authoritative unresolved work to the normal lifecycle without acknowledging it as success.
  - id: FR-FAST-PASS-09
    type: ubiquitous
    priority: must
    statement: Keep checkpoint commit exclusive to clean normal finalization after priority invalidations and replanned normal dispositions are resolved.
  - id: FR-FAST-PASS-10
    type: ubiquitous
    priority: must
    statement: Apply fixed provider-response token/ancestry semantics and one no-global-mutation partition to all providers through mandatory shared fake/contract tests; missing/malformed evidence fails closed per request, while optional credential-gated live E2E never controls release/runtime capability or creates provider state.
  - id: FR-FAST-PASS-11
    type: state-driven
    priority: must
    statement: On local-write success and record-save failure, retain tracker evidence and let a later normal cycle, including restart, read/hash same-size incomparable local/remote bytes on demand to converge equality as match without a marker.
  - id: NFR-FAST-PASS-01
    type: quality
    priority: must
    statement: Make zero provider calls for ineligible opens and only targeted identity/ancestor calls plus a changed-file bound read for eligible opens; never enumerate the vault or drain delta.
  - id: NFR-FAST-PASS-02
    type: constraint
    priority: must
    statement: Add no durable queue, handoff, recovery marker, checkpoint field, or settings migration.

