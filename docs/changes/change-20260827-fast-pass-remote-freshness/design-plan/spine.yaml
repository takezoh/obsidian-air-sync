units:
  - title: Unit 1 — detached observation capability and shared invariant
    chunk: chunk-1
    contract_refs: [contract-detached-targeted-observation]
    files:
      - src/fs/interface.ts
      - src/fs/priority-observation.ts
      - src/fs/caching/remote-fs.ts
      - src/fs/caching/remote-fs.contract.test.ts
    acceptance:
      - The priority capability accepts baseline identity and path and returns the typed observation/read partition with opaque tokens.
      - Delayed observation concurrent with global delta leaves live cursor, committed cursor, cache generation/content, and root anchor unchanged.
      - The old statFresh cache-write path is removed rather than guarded by another cache writer CAS.
    objective: Establish a provider-neutral detached boundary that cannot consume or rewrite global checkpoint state.
    output_format: TypeScript capability/types, shared-base implementation, and discriminating Vitest contract cases.
    tool_guidance: Do not call ensureInitialized, loadFromCache, getChangedPaths, cache setters, or checkpoint methods from the priority capability.
    task_boundaries: Do not add reset delta reporting, cursor fields, global handoff state, or persistence migration.
    decision_closure_reason: Inputs, outcome partition, no-mutation invariant, and token-bound read are fixed by Contract 1.
  - title: Unit 2 — authoritative provider observations
    chunk: chunk-2
    contract_refs: [contract-detached-targeted-observation]
    files:
      - src/fs/googledrive/index.ts
      - src/fs/googledrive/client.ts
      - src/fs/googledrive/client.test.ts
      - src/fs/googledrive/types.ts
      - src/fs/googledrive/types.test.ts
      - src/fs/googledrive/targeted-observation.test.ts
      - src/fs/dropbox/index.ts
      - src/fs/dropbox/targeted-observation.test.ts
      - src/fs/onedrive/index.ts
      - src/fs/onedrive/types.ts
      - src/fs/onedrive/types.test.ts
      - src/fs/onedrive/targeted-observation.test.ts
    depends_on: [Unit 1 — detached observation capability and shared invariant]
    acceptance:
      - Each provider uses the fixed Contract 1 token fields, proves expected identity's complete current path to the configured root, and rejects missing fields, deletion, replacement, ambiguous ancestry, and ancestor movement.
      - Dropbox point-reads root metadata with src/fs/caching/remote-fs.ts::CachingRemoteFs.rootFolderId inherited by src/fs/dropbox/index.ts::DropboxFs, populated from src/fs/dropbox/provider-base.ts::DropboxBackendData.remoteVaultFolderId (typed settings.backendData.remoteVaultFolderId) through src/fs/pkce-app-folder-provider.ts::PkceAppFolderProvider.createFs; same-id root rename preserves the child relative path, while missing/malformed identity or mismatch fails closed, no call reads/writes the shared root-path anchor, and no durable authority is added.
      - Mandatory shared fake/contract tests prove each provider response shape, point-read ancestry, token equality/order, read/reobserve behavior, malformed-field fail-closed partition, and no-global-mutation behavior; optional credential-gated live E2E is supplemental and never enables release/runtime capability or creates a receipt/backend-state lifecycle.
    objective: Supply authoritative detached evidence on all three providers without an engine-side branch.
    output_format: TypeScript provider seams and parallel provider Vitest cases.
    tool_guidance: Fetch ancestors/provider root as needed; cached parent paths are never path authority.
    task_boundaries: Do not mutate cache, cursor, root anchor, or provider checkpoint; do not infer identity from spelling.
    decision_closure_reason: Provider response fields, equality/order semantics, authority proof, mandatory shared contracts, per-request malformed-evidence failure, and optional non-gating live evidence are fixed by Contract 1.
  - title: Unit 3 — priority lease and executor safe points
    chunk: chunk-3
    contract_refs: [contract-cooperative-priority-safe-point, contract-path-mutation-cas]
    files:
      - src/sync/priority-coordinator.ts
      - src/sync/priority-coordinator.test.ts
      - src/sync/plan-executor.ts
      - src/sync/plan-executor.test.ts
      - src/sync/orchestrator.ts
      - src/sync/orchestrator.test.ts
      - src/sync/local-mutation-barrier.ts
      - src/sync/local-mutation-barrier.test.ts
      - src/fs/local/index.ts
      - src/fs/local/local-fs.test.ts
      - src/main.ts
    depends_on: [Unit 2 — authoritative provider observations]
    acceptance:
      - After enqueue no unstarted normal action is admitted; already-started actions finish, then priority completes before the next start.
      - Enqueue during planning, pooled transfer execution, phase boundaries, and pre-finalization obeys the same linearization rule without deadlock.
      - Every normal action receives a pre-start revalidation hook; frozen V1 proved older than applied V2 is terminal superseded/no-op, while incomparable ordering defers and blocks clean commit.
      - Every permit/counter releases on throws; after the final enqueue, active permits plus distinct pending attempts and one transition bound resumption, and continuous arrivals expose coalesced queue diagnostics.
      - All Air Sync LocalFs writes and tracker transitions use the same path lease through final validation, write, record CAS, post-write observation, and exact acknowledgement; an edit observed before mutation aborts, and later/different edit evidence remains dirty and unacknowledged.
    objective: Replace whole-batch file-open serialization with one batch lease and cooperative quiescent priority drain.
    output_format: TypeScript coordinator/executor integration and deterministic concurrency Vitest cases.
    tool_guidance: Preserve existing action phase safety and transfer limits; centralize admission rather than launching all pool work past the safe point.
    task_boundaries: Do not preempt an already-started action, weaken structural phase barriers, or add numeric fairness thresholds.
    decision_closure_reason: State transitions, ordering, seal, cancellation, and stale-action admission are fixed by Contracts 2 and 3.
  - title: Unit 4 — CAS integration, typed handoff, docs, and gate
    chunk: chunk-4
    contract_refs: [contract-detached-targeted-observation, contract-cooperative-priority-safe-point, contract-path-mutation-cas]
    files:
      - src/sync/scheduler.ts
      - src/sync/scheduler.test.ts
      - src/sync/orchestrator.ts
      - src/sync/orchestrator.test.ts
      - src/sync/state.ts
      - src/sync/state.test.ts
      - src/sync/local-tracker.ts
      - src/sync/local-tracker.test.ts
      - src/sync/local-mutation-barrier.ts
      - src/sync/local-mutation-barrier.test.ts
      - src/fs/local/index.ts
      - src/fs/local/local-fs.test.ts
      - src/main.ts
      - src/sync/change-detector.ts
      - src/sync/change-detector.test.ts
      - src/sync/change-hash-enrichment.ts
      - src/sync/decision-engine.ts
      - src/sync/decision-engine.test.ts
      - src/sync/sync-cycle-finalization.ts
      - src/sync/sync-cycle-finalization.test.ts
      - docs/sync-pipeline.md
      - docs/adr/adr-20260827-file-open-fast-pass-preserves-remote-change-batches.md
    depends_on: [Unit 3 — priority lease and executor safe points]
    acceptance:
      - Priority holds the shared path-local Air Sync mutation lease across final record/local/tracker validation, LocalFs write, record CAS, post-write tracker/content observation, and exact self-write acknowledgement; it does not claim atomic exclusion of simultaneous external adapter writes.
      - Same-path frozen V1 becomes superseded/no-op after proved applied V2, never pull; incomparable ordering defers and blocks checkpoint.
      - All failure kinds are observable and route unresolved authoritative work to normal sync; after restart, same-size both-changed incomparable content may use one normal local/remote byte read and SHA-256 equality proof without a marker.
      - Exact repository gate passes and docs describe detached observation, safe points, and CAS.
    objective: Close end-to-end mutation safety, failure handoff, commit-last integration, documentation, and mechanical verification.
    output_format: TypeScript integration, Vitest proofs, persistent Markdown, and gate evidence.
    tool_guidance: Reuse existing error classification, decision engine, Admission, and finalizer; mandatory shared fake/contract tests gate the implementation, while creds-gated E2E may be run as optional non-gating fidelity evidence and missing/malformed request evidence fails closed as unverifiable.
    task_boundaries: Do not swallow priority failures, acknowledge in finally, add durable schema, or bypass normal conflict/rename Admission.
    decision_closure_reason: CAS inputs, typed outcomes, convergence, checkpoint blocking, and user-visible failure mapping are fixed by Contract 3.

acceptance:
  - id: AC-FAST-PASS-01
    criteria: In an overlapping batch, only already-started indivisible actions may finish before the opened-file attempt; the opened file completes before every later normal action.
    requirement_refs: [FR-FAST-PASS-01, FR-FAST-PASS-04]
  - id: AC-FAST-PASS-02
    criteria: File-open leaves global cursor/cache/checkpoint/root state unchanged and the following normal batch receives the same sibling and structural deltas.
    requirement_refs: [FR-FAST-PASS-03, FR-FAST-PASS-09, FR-FAST-PASS-10]
  - id: AC-FAST-PASS-03
    criteria: An edit observed during queue wait, provider I/O, or final lease-held revalidation aborts before priority mutation; any edit evidence observed during or after the write is not acknowledged and remains dirty for normal Admission. The lease orders all Air Sync writes/tracker transitions but makes no stronger atomic-exclusion guarantee for simultaneous external adapter writes after its mutation linearization point.
    requirement_refs: [FR-FAST-PASS-02, FR-FAST-PASS-05, NFR-FAST-PASS-01]
  - id: AC-FAST-PASS-04
    criteria: A same-identity Dropbox root rename preserves the vault-relative path using request-local proof from src/fs/caching/remote-fs.ts::CachingRemoteFs.rootFolderId inherited by src/fs/dropbox/index.ts::DropboxFs and populated from src/fs/dropbox/provider-base.ts::DropboxBackendData.remoteVaultFolderId; the shared root-path anchor is not read/written, no durable authority is added, and missing/malformed root identity, mismatch, outside-root/ambiguous ancestry, or Google Drive/OneDrive ancestor movement produces no priority write.
    requirement_refs: [FR-FAST-PASS-06, FR-FAST-PASS-10]
  - id: AC-FAST-PASS-05
    criteria: After priority applies V2, frozen V1 is terminal superseded/no-op and never pull; incomparable ordering defers, blocks clean checkpoint, and never writes its stale snapshot.
    requirement_refs: [FR-FAST-PASS-07, FR-FAST-PASS-09]
  - id: AC-FAST-PASS-06
    criteria: Auth, rate, provider, read, write, superseded, and baseline-save failures return distinct typed results and cannot be logged-only success.
    requirement_refs: [FR-FAST-PASS-08]
  - id: AC-FAST-PASS-07
    criteria: A baseline-save failure leaves tracker evidence; after restart, a bounded normal on-demand local/remote byte SHA-256 proof converges equality as match while failure/divergence uses conflict Admission.
    requirement_refs: [FR-FAST-PASS-09, FR-FAST-PASS-11]
  - id: AC-FAST-PASS-08
    criteria: Each provider passes mandatory shared fake/contract tests for fixed response-token equality/order, authoritative ancestry, read/reobserve, malformed-evidence fail-closed behavior, and no-global-mutation; credential-gated live fidelity is optional and does not gate release/runtime capability or create provider state.
    requirement_refs: [FR-FAST-PASS-10]
