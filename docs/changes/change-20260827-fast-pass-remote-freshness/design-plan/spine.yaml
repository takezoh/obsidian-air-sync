contracts:
  - id: contract-detached-targeted-observation
    dimension: Identity-addressed authoritative observation and token-bound read with zero global cache/cursor/root mutation
    owner: component-detached-observer
    requirement_refs: [FR-FAST-PASS-02, FR-FAST-PASS-03, FR-FAST-PASS-06, FR-FAST-PASS-10, NFR-FAST-PASS-01, NFR-FAST-PASS-02]
    unit_refs:
      - Unit 1 — detached observation capability and shared invariant
      - Unit 2 — authoritative provider observations
    adr_refs:
      - adr-0002-shared-backend-contracts
      - adr-0006-order-independent-rename
      - adr-0008-logical-identity-admission
      - adr-20260827-file-open-fast-pass-preserves-remote-change-batches
    verification:
      - id: verify-detached-no-mutation
        tier: T0
        command: npm test -- src/fs/caching/remote-fs.contract.test.ts
      - id: verify-authoritative-ancestry
        tier: T0
        command: npm test -- src/fs/googledrive/targeted-observation.test.ts src/fs/dropbox/targeted-observation.test.ts src/fs/onedrive/targeted-observation.test.ts
      - id: verify-provider-observation-parity
        tier: T1
        command: npm test -- src/fs/googledrive/targeted-observation.test.ts src/fs/dropbox/targeted-observation.test.ts src/fs/onedrive/targeted-observation.test.ts
      - id: verify-live-provider-fidelity
        tier: T2
        command: npm run test:e2e
    partition:
      outcomes: [determinate, inconclusive, conflicting]
      default_policy: Authorize a read/write only from expected identity, exact authoritative path, complete root ancestry, and an equal well-formed final observation token; missing/malformed request evidence and all other outcomes hand off without mutation, and optional live-E2E evidence is not an enablement input.
  - id: contract-cooperative-priority-safe-point
    dimension: Batch lifecycle lease, strict priority over unstarted normal actions, quiescent drain, and finalization seal
    owner: component-priority-coordinator
    requirement_refs: [FR-FAST-PASS-01, FR-FAST-PASS-04, FR-FAST-PASS-07, FR-FAST-PASS-09]
    unit_refs:
      - Unit 3 — priority lease and executor safe points
      - Unit 4 — CAS integration, typed handoff, docs, and gate
    adr_refs:
      - adr-0001-commit-last
      - adr-20260827-file-open-fast-pass-preserves-remote-change-batches
    verification:
      - id: verify-priority-linearization
        tier: T0
        command: npm test -- src/sync/priority-coordinator.test.ts
      - id: verify-current-action-only
        tier: T1
        command: npm test -- src/sync/plan-executor.test.ts src/sync/orchestrator.test.ts
      - id: verify-finalization-safe-point
        tier: T0
        command: npm test -- src/sync/sync-cycle-finalization.test.ts src/sync/priority-coordinator.test.ts
      - id: verify-coordinator-liveness
        tier: T0
        command: npm test -- src/sync/priority-coordinator.test.ts src/sync/orchestrator.test.ts
    partition:
      outcomes: [determinate, inconclusive]
      default_policy: Once enqueue linearizes, admit no normal action until prior permits settle and coalesced priority drains; after the final enqueue finish within active-permit plus distinct-path attempts and one transition, while continuous arrivals remain observable strict priority and cannot strand counters.
    discretion:
      - id: discretion-priority-waiter-container
        unit_ref: Unit 3 — priority lease and executor safe points
        question: Choose the private waiter/promise container while retaining one ordered pending node per normalized path and the specified linearization points.
        scope:
          files:
            - src/sync/priority-coordinator.ts
            - src/sync/priority-coordinator.test.ts
          component: component-priority-coordinator
          visibility: private
        escalate_when:
          - A new normal action can start after an earlier priority enqueue.
          - Finalization can seal with a pending waiter or unresolved invalidation.
          - Cancellation can execute work against a replaced backend target.
        constraints:
          - Every acquired normal-action permit is released on success and failure.
          - Duplicate same-path opens share one attempt.
          - No global remote batch or payload is retained.
        preserves:
          contract_refs: [contract-cooperative-priority-safe-point, contract-path-mutation-cas]
          invariant_refs: [FR-FAST-PASS-01, FR-FAST-PASS-04, FR-FAST-PASS-09]
        verification_refs: [verify-priority-linearization, verify-current-action-only, verify-finalization-safe-point, verify-coordinator-liveness]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: private
          context_scope: component
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: concurrency
          coupling: shared_across_units
          grounding: evidenced
  - id: contract-path-mutation-cas
    dimension: Priority and normal action record/local/remote stamps, Air Sync mutation and acknowledgement ordering, admission-time replan, typed failure handoff, and content-equal recovery
    owner: component-action-cas
    requirement_refs: [FR-FAST-PASS-05, FR-FAST-PASS-07, FR-FAST-PASS-08, FR-FAST-PASS-09, FR-FAST-PASS-11]
    unit_refs:
      - Unit 3 — priority lease and executor safe points
      - Unit 4 — CAS integration, typed handoff, docs, and gate
    adr_refs:
      - adr-0001-commit-last
      - adr-0008-logical-identity-admission
      - adr-20260827-file-open-fast-pass-preserves-remote-change-batches
    verification:
      - id: verify-priority-cas
        tier: T0
        command: npm test -- src/sync/local-mutation-barrier.test.ts src/fs/local/local-fs.test.ts src/sync/orchestrator.test.ts src/sync/state.test.ts src/sync/local-tracker.test.ts
      - id: verify-normal-action-replan
        tier: T1
        command: npm test -- src/sync/plan-executor.test.ts src/sync/orchestrator.test.ts
      - id: verify-typed-handoff
        tier: T0
        command: npm test -- src/sync/scheduler.test.ts src/sync/orchestrator.test.ts
      - id: verify-content-equal-convergence
        tier: T0
        command: npm test -- src/sync/decision-engine.test.ts src/sync/orchestrator.test.ts
    partition:
      outcomes: [determinate, inconclusive, conflicting]
      default_policy: Priority mutates only after lease-held final stamp validation, keeps the Air Sync lease through write, record CAS, post-write observation, and exact acknowledgement, and leaves later/different edit evidence dirty; frozen older evidence is superseded/no-op, incomparable ordering defers, and restart equality requires an on-demand normal byte proof before clean retirement.

