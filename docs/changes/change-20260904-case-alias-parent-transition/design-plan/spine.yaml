artifact: design-plan-spine
version: 2
granularity_profile: boundary-complete

scope_expansion_signals: []

requirements:
  - id: FR-CAPU-001
    type: invariant
    priority: must
    statement: Admission shall transform each applicable case-alias parent component into one normalized candidate action set, route that candidate through exactly one final component evaluator, and emit no terminal disposition before that evaluator returns.
  - id: FR-CAPU-002
    type: event_driven
    priority: must
    statement: When complete current facts contain a valid target-keyed child SyncRecord, the unique current provider-old occurrence of that identity, retained child content work, and one complete included case-only parent mapping, Admission shall authorize the content work followed by exactly one existing parent rename_remote action.
  - id: FR-CAPU-003
    type: safety
    priority: must
    statement: A cross-path stable-identity edge without controlling reported rename evidence shall be covered only by the exact current occurrence to unique committed baseline occurrence pair for the same opaque stable identity inside one validated complete parent rename_remote mapping; an intended endpoint without that occurrence shall not establish coverage.
  - id: FR-CAPU-004
    type: safety
    priority: must
    statement: Unrelated, absent, incomplete, crossed, duplicated, wrongly directed, out-of-scope, unresolved, or identity-conflicting coverage shall retain the existing applicable fail-closed reason and authorize no partial component plan.
  - id: FR-CAPU-005
    type: compatibility
    priority: must
    statement: The repair shall preserve existing reported native rename decisions, unbaselined single-file case-alias canonicalization, standalone deletion authority, failure reason vocabulary, and disconnected proposal ordering.
  - id: FR-CAPU-006
    type: invariant
    priority: must
    statement: Equal complete component facts shall produce the same Admission actions, disposition, and reasons after COLD, WARM, or HOT acquisition, with no temperature, global-state, schema-version, or prior-failure input.
  - id: FR-CAPU-007
    type: safety
    priority: must
    statement: Each file SyncRecord shall remain committed only after its admitted I/O and cursor plus complete derived cache plus scope shall remain committed only after a wholly clean cycle; retry shall use ordinary current-fact acquisition.
  - id: NFR-CAPU-001
    type: maintainability
    priority: must
    statement: The implementation shall add no action, disposition, status, failure reason, evidence kind, persisted field, schema, migration, recovery branch, provider branch, exported policy owner, or correctness-critical in-memory owner.
  - id: NFR-CAPU-002
    type: performance
    priority: must
    statement: The evaluator shall derive one validated topology-coverage relation exactly once per component without I/O in O(A + D + E + S) time and O(D) cycle-local auxiliary space, where A, D, E, and S are actions, mapped descendants, evidence items, and relevant scope endpoints; repeated per-edge rescans are non-conforming.
  - id: NFR-CAPU-003
    type: evidence_gate
    priority: must
    statement: Fresh dependency and change-surface evidence shall be green before production implementation begins; a newly discovered caller, owner, or cross-boundary dependency shall stop implementation and return the design for revision.

components:
  - id: component-admission-pipeline
    kind: existing
    contract_refs:
      - contract-single-final-postcondition
      - contract-exact-topology-coverage
    paths:
      - src/sync/plan-admission.ts
      - src/sync/plan-admission-case-alias.ts
      - src/sync/identity-component-decision.ts
      - src/sync/plan-admission-graph.ts
  - id: component-admission-regression-harness
    kind: existing
    contract_refs:
      - contract-fresh-evidence-and-regression
      - contract-single-final-postcondition
      - contract-exact-topology-coverage
      - contract-current-fact-convergence
    paths:
      - src/sync/plan-admission.test.ts
      - src/sync/orchestrator.test.ts
      - sync-state-ownership-guard.test.mjs
  - id: component-existing-execution-and-commit
    kind: existing
    contract_refs:
      - contract-current-fact-convergence
    paths:
      - src/sync/plan-executor.ts
      - src/sync/state-committer.ts
      - src/sync/sync-cycle-finalization.ts

contracts:
  - id: contract-fresh-evidence-and-regression
    dimension: evidence_seeking
    owner: component-admission-regression-harness
    requirement_refs:
      - FR-CAPU-001
      - FR-CAPU-002
      - FR-CAPU-003
      - FR-CAPU-004
      - NFR-CAPU-003
    unit_refs:
      - unit-0-fresh-evidence-and-regression-lock
    adr_refs:
      - adr-0008-logical-identity-admission-fails-closed
      - adr-20260903-stateless-current-state-recovery
    verification:
      - id: verify-fresh-dependency-surface
        tier: T0
        command: null
      - id: verify-production-shaped-red-and-negatives
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
      - id: verify-pre-evaluator-terminal-rejection
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
    partition:
      outcomes: [determinate, unknown, conflicting]
      default_policy: Production implementation may start only with fresh scope evidence and discriminating positive and negative witnesses; stale, unknown, conflicting, or expanded ownership returns to design.
    discretion: []

  - id: contract-single-final-postcondition
    dimension: responsibility_boundary
    owner: component-admission-pipeline
    requirement_refs:
      - FR-CAPU-001
      - FR-CAPU-004
      - FR-CAPU-005
      - NFR-CAPU-001
    unit_refs:
      - unit-0-fresh-evidence-and-regression-lock
      - unit-1-unified-final-postcondition
    adr_refs:
      - adr-20260831-admission-owns-identity-component-decisi
      - adr-20260903-four-stage-sync-pipeline
    verification:
      - id: verify-one-final-verdict
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
      - id: verify-no-pre-evaluator-terminal-authorization
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
      - id: verify-admission-production-cut
        tier: T1
        command: npm test -- --run src/sync/orchestrator.test.ts
    partition:
      outcomes: [determinate, unknown, inconclusive, conflicting]
      default_policy: Candidate normalization may report only that no candidate exists or return candidate actions; every normalized component reaches the existing final evaluator before exactly one disposition is emitted, and every non-determinate proof remains failed and non-clean.
    discretion: []

  - id: contract-exact-topology-coverage
    dimension: safety_and_performance_boundary
    owner: component-admission-pipeline
    requirement_refs:
      - FR-CAPU-002
      - FR-CAPU-003
      - FR-CAPU-004
      - FR-CAPU-005
      - NFR-CAPU-002
    unit_refs:
      - unit-0-fresh-evidence-and-regression-lock
      - unit-1-unified-final-postcondition
      - unit-2-convergence-and-documentation
    adr_refs:
      - adr-0008-logical-identity-admission-fails-closed
    verification:
      - id: verify-exact-baseline-occurrence-coverage
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
      - id: verify-covered-plus-uncovered-partition
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
      - id: verify-native-and-single-file-compatibility
        tier: T0
        command: npm test -- --run src/sync/plan-admission.test.ts
      - id: verify-linear-single-derivation
        tier: T0
        command: npm run lint
    partition:
      outcomes: [determinate, unknown, inconclusive, conflicting]
      default_policy: Only one exact current-to-unique-baseline occurrence edge for the same opaque identity inside one complete validated parent rename_remote mapping enters the shared coverage relation; absent, intended-only, unrelated, partial, crossed, duplicate, heuristic, unresolved, or conflicting proof retains the existing fail-closed reason.
    discretion:
      - id: discretion-private-coverage-representation
        unit_ref: unit-1-unified-final-postcondition
        question: Which private Set- or Map-based representation stores the single already-derived validated topology-coverage relation during one component evaluation?
        scope:
          files:
            - src/sync/identity-component-decision.ts
          component: component-admission-pipeline
          visibility: private
        escalate_when:
          - The representation must be exported, persisted, retained outside one evaluator call, or consulted by normalization or execution.
          - The choice changes accepted edge identity, failure precedence, the single-derivation rule, O(A + D + E + S) time, O(D) auxiliary space, or any observable action/disposition.
        constraints:
          - Derive the relation once from validated normalized actions and discard it before return.
          - Alias and stable-identity checks consume the same relation; repeated per-edge rescans are forbidden.
        authority:
          may_choose:
            - A private Set keyed by exact current and baseline occurrence coordinates plus opaque identity.
            - A private Map keyed by the current occurrence whose value records the unique baseline occurrence and opaque identity.
        preserves:
          contract_refs:
            - contract-single-final-postcondition
            - contract-exact-topology-coverage
          invariant_refs:
            - invariant-one-terminal-postcondition-owner
            - invariant-one-linear-coverage-derivation
            - invariant-no-new-authority
          observable_refs:
            - observable-one-component-disposition
            - observable-exact-baseline-coverage
        verification_refs:
          - verify-no-pre-evaluator-terminal-authorization
          - verify-exact-baseline-occurrence-coverage
          - verify-linear-single-derivation
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: private
          context_scope: files
          reversibility: trivial
          verification_strength: discriminating
          runtime_risk: normal
          coupling: coupled_within_unit
          grounding: evidenced

  - id: contract-current-fact-convergence
    dimension: state_lifecycle
    owner: component-existing-execution-and-commit
    requirement_refs:
      - FR-CAPU-006
      - FR-CAPU-007
      - NFR-CAPU-001
    unit_refs:
      - unit-2-convergence-and-documentation
    adr_refs:
      - adr-0001-metadata-cache-is-subordinate-to-commit-last
      - adr-20260903-four-stage-sync-pipeline
      - adr-20260903-stateless-current-state-recovery
    verification:
      - id: verify-cold-warm-hot-equivalence
        tier: T1
        command: npm test -- --run src/sync/orchestrator.test.ts
      - id: verify-execution-and-finalization-unchanged
        tier: T1
        command: npm test -- --run src/sync/plan-executor.test.ts src/sync/state-committer.test.ts src/sync/sync-cycle-finalization.test.ts src/sync/orchestrator.test.ts
      - id: verify-state-ownership-guard
        tier: T1
        command: npm test -- --run sync-state-ownership-guard.test.mjs
      - id: verify-full-project-gate
        tier: T1
        command: npm run lint && npm run lint:bot-repro && npm run build && npm run test:coverage
    partition:
      outcomes: [determinate, inconclusive, conflicting]
      default_policy: Equal complete facts have one temperature-independent Admission result; any action failure or missing terminal proof keeps the cycle non-clean, aborts the live working view, preserves the prior checkpoint, and leaves the next attempt to ordinary current-fact acquisition.
    discretion: []

adrs:
  - id: adr-20260831-admission-owns-identity-component-decisi
    status: accepted
    decision_input_refs:
