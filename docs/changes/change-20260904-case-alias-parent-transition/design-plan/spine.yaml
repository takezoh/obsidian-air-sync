  - id: adr-20260903-four-stage-sync-pipeline
    status: accepted
    decision_input_refs:
      - input-final-proof-owner
      - input-native-and-single-file-compatibility
  - id: adr-20260903-stateless-current-state-recovery
    status: accepted
    decision_input_refs:
      - input-temperature-equivalence
      - input-no-recovery-authority
      - input-stale-deferred-language
  - id: adr-0001-metadata-cache-is-subordinate-to-commit-last
    status: accepted
    decision_input_refs:
      - input-no-recovery-authority

units:
  - title: unit-0-fresh-evidence-and-regression-lock
    chunk: evidence-and-test-first
    contract_refs:
      - contract-fresh-evidence-and-regression
      - contract-single-final-postcondition
      - contract-exact-topology-coverage
    files:
      - src/sync/plan-admission.test.ts
      - src/sync/orchestrator.test.ts
    depends_on: []
    acceptance:
      - Fresh dependency evidence confirms the single production callers and owners named by this plan; any new caller, owner, or cross-boundary dependency stops implementation.
      - The target-keyed child SyncRecord production shape remains RED before the repair and proves normalized child content plus complete parent rename followed by identity_postcondition_unproven.
      - A determinate normalizeLocalMove candidate with a second opaque identity at the same remote-current slot reaches the current pre-evaluator terminal branch before repair; the regression requires exactly one failed disposition with conflicting_identity and zero executable actions, so retaining that branch fails.
      - Exact baseline-occurrence controls distinguish the unique same-identity baseline endpoint from an intended endpoint lacking that occurrence, and negative fixtures distinguish unrelated, incomplete, crossed, duplicate, reversed, covered-plus-uncovered, unresolved, and conflicting shapes.
      - Equal complete COLD, WARM, and HOT Admission facts are expressible without a production temperature field.
    objective: Refresh stale scope evidence and lock tests that discriminate the intended positive, exact baseline edge, all negative boundaries, and the forbidden pre-evaluator terminal path before production edits.
    output_format: Fresh evidence receipt plus test-only characterization and RED fixtures.
    tool_guidance: Use the current dev-evidence startup/dependency entry, then production-shaped Observation and Admission seams; assert exact disposition count, existing reason strings, and executable actions.
    task_boundaries: No production edits, hand-built success bypass, weakened negative assertion, runtime recovery, provider changes, or new action/status/failure reason.
    decision_closure_reason: The fixtures fail under each rejected policy variant, including early authorization, intended-path substitution, broad ancestor coverage, and partial coverage.

  - title: unit-1-unified-final-postcondition
    chunk: admission-policy-reduction
    contract_refs:
      - contract-single-final-postcondition
      - contract-exact-topology-coverage
    files:
      - src/sync/plan-admission.ts
      - src/sync/identity-component-decision.ts
      - src/sync/plan-admission.test.ts
    depends_on:
      - unit-0-fresh-evidence-and-regression-lock
    acceptance:
      - normalizeCaseAliasParentTransition and normalizeLocalMove shape candidates only; every normalized component reaches evaluateIdentityComponent exactly once before admitDestructivePlan emits exactly one existing disposition.
      - The evaluator derives one validated coverage relation once in O(A + D + E + S) time and O(D) auxiliary space; alias and stable-identity rules consume it and no per-edge rescan remains.
      - Each eligible stable edge is the exact unique current occurrence to unique committed baseline occurrence pair for the same opaque identity; intended-only endpoints never cover it.
      - The mixed target-record witness authorizes its exact child content plus parent action while every negative and pre-evaluator-terminal fixture remains fail-closed with the existing reason.
      - Action, evidence, disposition, and failure-reason vocabularies remain unchanged.
    objective: Remove both terminal paths and duplicate coverage notions in favor of one compositional, action-aware, linearly bounded final evaluator.
    output_format: A narrow Admission-internal pure-code change and focused tests.
    tool_guidance: Keep coverage representation private to identity-component-decision.ts, derive it once from the normalized action set, and preserve reason precedence.
    task_boundaries: Do not filter true evidence, synthesize rename evidence, change normalizer semantics beyond candidate-only routing, change providers/executor, or add runtime/persistent state.
    decision_closure_reason: Owner, exact occurrence identity, coverage derivation, complexity, negative partition, and observable disposition are design-fixed; only Set-versus-Map representation is delegated.

  - title: unit-2-convergence-and-documentation
    chunk: integration-and-conformance
    contract_refs:
      - contract-exact-topology-coverage
      - contract-current-fact-convergence
    files:
      - src/sync/plan-admission.test.ts
      - src/sync/orchestrator.test.ts
      - src/sync/plan-executor.test.ts
      - src/sync/state-committer.test.ts
      - src/sync/sync-cycle-finalization.test.ts
      - sync-state-ownership-guard.test.mjs
      - docs/design/design-four-stage-sync-pipeline.md
      - docs/adr/adr-20260831-admission-owns-identity-component-decisi.md
      - docs/adr/adr-20260903-stateless-current-state-recovery.md
    depends_on:
      - unit-1-unified-final-postcondition
    acceptance:
      - Production-shaped COLD, WARM, and HOT equal-fact cases yield identical executable action, disposition, and reason projections.
      - Child content completes before the parent structural rename; any child or parent failure leaves cursor/cache/scope unpublished, aborts the live view, and retries from current facts without recovery state.
      - The active four-stage design names candidate-only normalization and one final action-aware Admission evaluator; stale deferred or rename-debt wording is explicitly superseded by the accepted stateless contract, with no new ADR.
      - The ownership guard and complete repository gate pass without changes to provider, executor, state, schema, migration, or action/disposition vocabulary.
    objective: Prove ordinary retry convergence and align current design authority without changing execution or durable authority.
    output_format: Integration regressions, narrow persistent design/accepted-ADR clarification, and recorded gate evidence.
    tool_guidance: Compare observable action/disposition projections, assert event order and checkpoint absence, and run the repository-root ownership guard before the full gate.
    task_boundaries: No live E2E requirement, provider implementation changes, executor phase changes, state writers, schema/version bump, migration, recovery instruction, or new ADR.
    decision_closure_reason: Existing accepted ADRs own lifecycle and durable state; this unit verifies conformance and persists only the clarified single-owner invariant.

acceptance:
  - id: AC-CAPU-001
    criteria: A complete mixed-record parent case alias, including a valid target-keyed child SyncRecord and exact current-to-unique-baseline occurrence coverage, yields retained child content work plus exactly one complete parent rename_remote and no Admission failure.
    requirement_refs: [FR-CAPU-001, FR-CAPU-002, FR-CAPU-003]
  - id: AC-CAPU-002
    criteria: An intended endpoint without the same identity's unique committed baseline occurrence, or any unrelated, absent, incomplete, crossed, duplicate, reversed, covered-plus-uncovered, unresolved, or conflicting edge, cannot borrow parent coverage and retains the existing fail-closed reason with no executable component action.
    requirement_refs: [FR-CAPU-003, FR-CAPU-004, FR-CAPU-005]
  - id: AC-CAPU-003
    criteria: A determinate normalizeLocalMove candidate carrying a second opaque identity at the same remote-current slot produces exactly one failed conflicting_identity disposition and zero executable actions; any pre-evaluator authorized or resolved_no_action disposition fails the test.
    requirement_refs: [FR-CAPU-001, FR-CAPU-004]
  - id: AC-CAPU-004
    criteria: One O(A + D + E + S) and O(D)-space coverage derivation is shared by alias and stable-identity checks; repeated per-edge scans or a second relation are non-conforming.
    requirement_refs: [NFR-CAPU-002]
  - id: AC-CAPU-005
    criteria: Production-shaped COLD, WARM, and HOT acquisition yielding equal complete facts produces identical Admission actions, dispositions, and reasons without temperature or prior failure in the decision input.
    requirement_refs: [FR-CAPU-006]
  - id: AC-CAPU-006
    criteria: Child content precedes the parent rename, successful per-file records remain valid, any incomplete cycle leaves cursor/cache/scope unpublished, and retry adds no durable or correctness-critical memory.
    requirement_refs: [FR-CAPU-007, NFR-CAPU-001]
  - id: AC-CAPU-007
    criteria: Fresh dependency evidence, focused tests, ownership guard, and the full repository gate are green; native rename, single-file alias, standalone delete, execution, and checkpoint behavior remain compatible.
    requirement_refs: [FR-CAPU-005, NFR-CAPU-001, NFR-CAPU-003]

dispositions:
  - decision_input_ref: input-final-proof-owner
    disposition: adopted; evaluateIdentityComponent is the sole final postcondition owner after all component-local candidate shaping, and no normalizer may emit a terminal disposition.
    adr_refs: [adr-20260831-admission-owns-identity-component-decisi, adr-20260903-four-stage-sync-pipeline]
    contract_refs: [contract-single-final-postcondition]
  - decision_input_ref: input-exact-descendant-coverage
    disposition: adopted; only the exact current occurrence to unique committed baseline occurrence pair of the same opaque identity inside one complete validated parent rename_remote mapping establishes coverage; intended-only endpoints are rejected.
    adr_refs: [adr-0008-logical-identity-admission-fails-closed]
    contract_refs: [contract-exact-topology-coverage]
  - decision_input_ref: input-temperature-equivalence
    disposition: adopted; acquisition temperature remains outside Admission and equal complete facts have one result.
    adr_refs: [adr-0008-logical-identity-admission-fails-closed, adr-20260903-stateless-current-state-recovery]
    contract_refs: [contract-current-fact-convergence]
  - decision_input_ref: input-no-recovery-authority
    disposition: adopted; no persistent or correctness-critical in-memory recovery authority is permitted.
    adr_refs: [adr-20260903-stateless-current-state-recovery, adr-0001-metadata-cache-is-subordinate-to-commit-last]
    contract_refs: [contract-current-fact-convergence]
  - decision_input_ref: input-negative-boundary
    disposition: adopted; every existing fail-closed category and exact reason boundary is retained, with only the exact complete baseline-occurrence edge added as positive proof.
    adr_refs: [adr-0008-logical-identity-admission-fails-closed]
    contract_refs: [contract-exact-topology-coverage]
  - decision_input_ref: input-native-and-single-file-compatibility
    disposition: adopted; reported native rename, unbaselined single-file canonicalization, and standalone delete paths remain distinct and unchanged.
    contract_refs: [contract-single-final-postcondition, contract-exact-topology-coverage]
  - decision_input_ref: input-stale-deferred-language
    disposition: adopted as documentation reconciliation; stale deferred or rename-debt wording is clarified against the accepted failed/stateless contract without a new ADR.
    adr_refs: [adr-20260831-admission-owns-identity-component-decisi, adr-20260903-stateless-current-state-recovery]
    contract_refs: [contract-current-fact-convergence]
  - decision_input_ref: input-dependency-freshness
    disposition: adopted as a pre-implementation evidence gate; stale, unknown, or expanded dependency evidence stops implementation.
    contract_refs: [contract-fresh-evidence-and-regression]
  - decision_input_ref: alternative-local-stable-identity-bypass
    disposition: rejected; fixture-specific suppression preserves split policy and can authorize unrelated identities.
    contract_refs: [contract-single-final-postcondition, contract-exact-topology-coverage]
  - decision_input_ref: alternative-proof-token-or-recovery-state
    disposition: rejected; a token, status, marker, or recovery branch creates another authority instead of making the final proof compositional.
    adr_refs: [adr-20260903-stateless-current-state-recovery]
    contract_refs: [contract-current-fact-convergence]
  - decision_input_ref: decision-input-single-final-owner
    disposition: subsumed by input-final-proof-owner; candidate shaping is non-terminal and the existing evaluator owns the only final reasons and verdict.
    contract_refs: [contract-single-final-postcondition]
  - decision_input_ref: decision-input-stable-edge-coverage
    disposition: subsumed by input-exact-descendant-coverage; baseline means the unique committed baseline occurrence of the same identity, never a merely intended path.
    contract_refs: [contract-exact-topology-coverage]
  - decision_input_ref: decision-input-temperature
    disposition: subsumed by input-temperature-equivalence; equal complete facts have equal Admission meaning.
    contract_refs: [contract-current-fact-convergence]
  - decision_input_ref: decision-input-recovery-state
    disposition: subsumed by input-no-recovery-authority; ordinary current-fact replanning uses only existing durable facts.
    contract_refs: [contract-current-fact-convergence]
  - decision_input_ref: decision-input-helper-shape
    disposition: implementation detail; only the private Set-versus-Map representation of the single derived relation is delegated, while derivation count, complexity, edge identity, and consumers are fixed.
    contract_refs: [contract-exact-topology-coverage]
  - decision_input_ref: decision-input-dependency-freshness
    disposition: subsumed by input-dependency-freshness; refresh is a hard evidence gate before production editing.
    contract_refs: [contract-fresh-evidence-and-regression]
  - decision_input_ref: decision-input-stale-adr-wording
    disposition: subsumed by input-stale-deferred-language; clarify the existing authority without creating a new ADR or lifecycle.
    contract_refs: [contract-current-fact-convergence]
