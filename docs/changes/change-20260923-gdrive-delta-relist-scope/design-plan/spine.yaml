acceptance:
- criteria: Driven through applyIdDeltaPage and applyRemoteChanges, the per-call entered
    target set contains exactly the folders whose prior cached path was undefined
    and whose new path resolved, in first-entered order, is empty on a steady-state
    page, and is discarded with the call.
  id: AC-001
  requirement_refs:
  - FR-001
  - FR-002
  - FR-006
- criteria: Zero declared-operation listings on a no-entry drain; exactly one for
    the topmost remaining target otherwise; the account-wide walk on the delta path
    is absent, pinned RED-first by an adapter unit
  id: AC-002
  requirement_refs:
  - FR-002
  - FR-003
  - NFR-001
- criteria: For Google Drive, OneDrive and Dropbox the shared scope-entry case reports
    exactly F, F/a.md, F/sub and F/sub/b.md as modified with no deleted and no renamed
    facts, and the same exact set is repeated after abortWorkingView.
  id: AC-003
  requirement_refs:
  - FR-004
- criteria: An injected listing rejection aborts the attempt, leaves the durable checkpoint
    and scope fingerprint unchanged (cursor-sensitive fake), and the next attempt
    re-derives the same complete subtree
  id: AC-004
  requirement_refs:
  - FR-005
  - NFR-003
- criteria: cursor_invalid makes fetchChanges return needsFullScan and take the full-scan
    fallback, publishing no partial delta and keeping a same-path content update the
    diff cannot re-derive
  id: AC-005
  requirement_refs:
  - FR-008
- criteria: One invocation of the declared operation issues exactly one scoped listing
    through the existing client for the supplied folder identity, returns the provider's
    current subtree entries, and reads no cache, cursor, scope or store; an adapter
    that omits the operation stays valid and is issued no completion request.
  id: AC-006
  requirement_refs:
  - FR-004
  - FR-007
  - FR-009
- criteria: The three canonical modules register and validate both with and without
    the optional member, a declared-but-malformed member is rejected at registration
    while a valid omitting adapter is accepted, and the required-contract catalog
    reports zero issues with OneDrive and Dropbox production code unchanged.
  id: AC-007
  requirement_refs:
  - FR-009
  - NFR-002
- criteria: The adapter class doc no longer claims an account-wide per-changed-folder
    re-list and the list-all.ts comment no longer cites the removed incremental-sync
    walk, each naming only the single entered-folder exception.
  id: AC-008
  requirement_refs:
  - FR-010
- criteria: The opt-in live Google Drive e2e exercises the move-in scenario and confirms
    the complete entered subtree surfaces outside the gate; the steady-state zero-listing
    count is evidenced by the deterministic managed delta test, not by the live e2e
  id: AC-009
  requirement_refs:
  - NFR-001
