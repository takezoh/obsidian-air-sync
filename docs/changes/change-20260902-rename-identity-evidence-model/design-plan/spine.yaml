    decision_input_refs: [decision-input-multi-remote-preservation]
    status_provenance:
      source: user_consultation
      confidence: confirmed
      evidence_refs: [operator-decision-20260903.json]
      rationale: >-
        The user explicitly selected preserve_all_then_resolve_tracked_identity for R at a
        third path plus foreign destination Y.
      consultation_id: multi-remote-preservation-policy

units:
  - title: unit-cycle-evidence
    chunk: immutable evidence prerequisite
    contract_refs: [contract-cycle-evidence]
    files:
      - src/sync/sync-cycle-planning.ts
      - src/sync/cycle-admission-snapshot.ts
      - src/sync/plan-admission.test.ts
    depends_on: []
    acceptance: [AC-CYCLE-01]
    objective: >-
      Derive the local rename candidate once in planning and emit a deeply immutable cycle value.
    output_format: TypeScript boundary refactor and mutation-attempt/candidate-count tests.
    tool_guidance: Fold or delete the shallow carrier; do not create a replacement component.
    task_boundaries: No classification, I/O, resolver, persistence, or provider behavior change.
    decision_closure_reason: All boundary fields and immutability obligations are fixed; no design choice remains.
  - title: unit-normalization-admission
    chunk: legal evidence and total authority
    contract_refs: [contract-legal-normalization, contract-total-admission]
    files:
      - src/sync/plan-admission.ts
      - src/sync/plan-admission-graph.ts
      - src/sync/identity-component-decision.ts
      - src/sync/local-rename-admission.ts
      - src/sync/plan-admission.test.ts
    depends_on: [unit-cycle-evidence]
    acceptance: [AC-LEGAL-02, AC-ADMISSION-03]
    objective: >-
      Normalize raw evidence into the sole legal union and derive one total decision plus debt membership.
    output_format: Private discriminated unions, exhaustive switch/table tests, and no-I/O guards.
    tool_guidance: Keep normalizer and authorizer private to Admission; compile-time exhaustiveness is required.
    task_boundaries: No filesystem calls, conflict artifacts, executor fallback classification, or state write.
    decision_closure_reason: Legal variants, precedence, disposition mapping, and lifecycle ownership are fixed.
  - title: unit-conflict-resolution
    chunk: bounded preparation and single resolver output
    contract_refs: [contract-conflict-preparation, contract-resolver-preservation]
    files:
      - src/sync/conflict-resolver.ts
      - src/sync/conflict.ts
      - src/sync/content-identity.ts
      - src/sync/conflict-resolver.test.ts
    depends_on: [unit-normalization-admission]
    acceptance: [AC-SNAPSHOT-04, AC-PRESERVE-05, AC-RESOLVER-06]
    objective: >-
      Build read-only exact snapshots and make one configured resolver invocation create and verify all outputs.
    output_format: Closed prepared/result unions, resolver extension, and fault/visibility/retry tests.
    tool_guidance: Reuse existing filesystem calls and conflict allocator; primary is R and additional is Y.
    task_boundaries: No artifact write in preparation, provider API, new strategy, persistent receipt, or dedup claim.
    decision_closure_reason: Snapshot bound, ordered inputs, naming, visibility, strategy scope, and retry consequence are fixed.
  - title: unit-executor-terminal-proof
    chunk: compound mutation and terminal proof
    contract_refs: [contract-executor-effects-proof]
    files:
      - src/sync/plan-executor.ts
      - src/sync/execution-result.ts
      - src/sync/plan-executor.test.ts
    depends_on: [unit-conflict-resolution]
    acceptance: [AC-FAILURE-07, AC-PROOF-08]
    objective: >-
      Sequence resolver, delete/rename/write, and terminal re-observation under the executor's sole ownership.
    output_format: Executor-private proof seam, branded success value, and every-cut fault tests.
    tool_guidance: Keep terminal helper private in plan-executor.ts; do not add a terminal-proof component/file.
    task_boundaries: No fresh classification, artifact policy, per-file record implementation, checkpoint, retry, or rollback.
    decision_closure_reason: Effect order, failure union, proof fields, and owner are fixed; no design choice remains.
  - title: unit-commit-finalization
    chunk: durable commit boundaries
    contract_refs: [contract-per-file-cas, contract-clean-finalization]
    files:
      - src/sync/state-committer.ts
      - src/sync/state-committer.test.ts
      - src/sync/sync-cycle-finalization.ts
      - src/sync/sync-cycle-finalization.test.ts
    depends_on: [unit-executor-terminal-proof]
    acceptance: [AC-CAS-09, AC-FINALIZE-10, AC-BOUNDARY-11]
    objective: >-
      Gate per-file CAS on terminal proof and retain separate clean checkpoint then exact debt release ownership.
    output_format: Type-level proof gate, finalization tests, and forbidden-surface diff inspection.
    tool_guidance: Preserve disconnected successful per-file commits and existing checkpoint-first ordering.
    task_boundaries: No composite commit owner, schema migration, broad debt deletion, provider change, or new store.
    decision_closure_reason: Per-file and global durable owners and all failure conditions are fixed.

acceptance:
  - id: AC-CYCLE-01
    criteria: >-
      A cycle exposes one deeply immutable evidence value and the local rename candidate is derived once.
    requirement_refs: [REQ-IMMUTABLE-CYCLE-EVIDENCE]
  - id: AC-LEGAL-02
    criteria: >-
      Every permitted raw observation constructs exactly one legal union variant; Cartesian illegal states cannot compile or authorize effects.
    requirement_refs: [REQ-LEGAL-NORMALIZED-STATE]
  - id: AC-ADMISSION-03
    criteria: >-
      Every legal variant has one total disposition and one debt persist/release set; unknown and contradicted perform zero action.
    requirement_refs: [REQ-TOTAL-ADMISSION-DECISION]
  - id: AC-SNAPSHOT-04
    criteria: >-
      Missing checksum/mtime obtains stable exact bytes with at most two reads bracketed by stats; unreadable or changing input terminates failed/blocked.
    requirement_refs: [REQ-BOUNDED-VERSION-SNAPSHOT]
  - id: AC-PRESERVE-05
    criteria: >-
      R at a third path and Y at the destination produces verified exact-byte visible outputs for both before destructive effects.
    requirement_refs: [REQ-PRESERVE-ALL-REMOTE-VERSIONS]
  - id: AC-RESOLVER-06
    criteria: >-
      The configured resolver is called once, applies strategy to primary R, preserves additional Y, owns every output, and documents numbered duplicates on fresh retry.
    requirement_refs: [REQ-RESOLVER-ONCE, NFR-NO-NEW-RECOVERY-SURFACE]
  - id: AC-FAILURE-07
    criteria: >-
      Evidence unknown/contradicted is zero-action; I/O is failed, auth/proof mismatch is blocked, and branded invariant mismatch fails fast.
    requirement_refs: [REQ-EXECUTOR-TERMINAL-PROOF]
  - id: AC-PROOF-08
    criteria: >-
      Every partial cut reacquires fresh legal evidence, while success alone proves old/source absence, target identity, and intended bytes.
    requirement_refs: [REQ-EXECUTOR-TERMINAL-PROOF]
  - id: AC-CAS-09
    criteria: Raw resolver or mutation results cannot call per-file CAS; only branded terminal proof with the exact admitted baseline can.
    requirement_refs: [REQ-PER-FILE-CAS]
  - id: AC-FINALIZE-10
    criteria: >-
      Only a clean cycle commits checkpoint then exact debt release; disconnected proof-backed per-file records may remain committed when global finalization is withheld.
    requirement_refs: [REQ-CLEAN-FINALIZATION]
  - id: AC-BOUNDARY-11
    criteria: >-
      The exact-head diff adds no durable recovery state, provider/checkpoint API, strategy, workflow engine, terminal-proof component, raw retry, or rollback.
    requirement_refs: [NFR-NO-NEW-RECOVERY-SURFACE, NFR-UNIQUE-OWNERS]

dispositions:
  - decision_input_ref: decision-input-admission-owner
    disposition: adopted; Admission remains the sole normalization, authorization, and debt-membership owner.
    adr_refs: [adr-20260831-admission-owns-identity-component-decisi]
    contract_refs: [contract-legal-normalization, contract-total-admission]
  - decision_input_ref: decision-input-fresh-reclassification
    disposition: adopted; every partial cut returns to ordinary fresh legal normalization without replay authority.
    adr_refs: [adr-20260902-fresh-state-reconciliation-for-rename-edits]
    contract_refs: [contract-executor-effects-proof, contract-clean-finalization]
  - decision_input_ref: decision-input-multi-remote-preservation
    disposition: adopted by explicit user approval; preserve all observed remote versions then resolve primary tracked R once.
    adr_refs: [adr-20260903-preserve-all-observed-remote-versions]
    contract_refs: [contract-conflict-preparation, contract-resolver-preservation]
  - decision_input_ref: decision-input-commit-last
    disposition: adopted; branded terminal proof gates per-file CAS and clean checkpoint precedes exact debt release.
    adr_refs: [adr-0001-metadata-cache-is-subordinate-to-commit-last]
    contract_refs: [contract-per-file-cas, contract-clean-finalization]
