    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-no-operator-signal-on-main
    disposition: >-
      Adopted as a constraint on every observable this plan asserts, with one claim withdrawn as measured false.
      Logger.enabled and src/sync/sync-cycle-diagnostics.ts are not on main, and DEFAULT_SETTINGS.enableLogging and
      showSyncNotifications are both false, so no requirement or witness here depends on a log line or a notice;
      every asserted observable is a cycle outcome, and a stalled component is silent to the user and shows only as
      work not progressing. The previous revision went one step further and said the path index's constraint
      classification "is the only diagnosable trace a violated fs premise leaves". That is false as the code stands:
      idb-helper.ts:142 registers tx.onerror before tx.onabort and the transaction's error attribute is only set
      during the abort steps, so the onerror rejection wins the race with tx.error still null and
      IDBTransactionError.domName is null for every aborted transaction, not only for a constraint violation.
      Measured against the repository's own fake-indexeddb: request.onerror ConstraintError, tx.onerror null,
      tx.onabort ConstraintError, rows unchanged. So the diagnosable trace is not the name but the shape — a thrown
      transaction failure from a CAS method that never returns false for it, an action that fails, and a checkpoint
      that stays uncommitted — and that is what this plan asserts. The helper defect is independently repairable
      with a blast radius of both persistent stores; it is recorded as open question 5, is not repaired by this
      change, and is not worked around at any call site.
    adr_refs: [adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-record-identity-uniqueness, contract-cross-source-rename-validation]
  - decision_input_ref: decision-input-owner-decision-5-path-uniqueness-is-upstream
    disposition: Binding, and applied by rejecting a frame rather than by answering a question. The owner's authority delta states that trying to hold several records at one path is the mistake, that path may simply be a unique constraint, and that fs owes the sync engine object-path uniqueness. Four things follow and all four are applied. First, adr-record-key-shape resolves to keyPath remoteIdentityKey with a unique index over path, and its status moves from reserved to accepted; the cost comparison that was reserved for the owner is retired as a decision input and survives only as this change's work inventory. Second, the unique path index is a guard on a broken upstream and not a policy mechanism — it aborts rather than replaces, its ConstraintError is a defect signal, it is never mapped onto the ordinary stale-baseline false, and each CAS method compares the target address itself so the index is only reachable when the premise is false. Third, the premise that fs guarantees object-path uniqueness is stated explicitly under scope with its owner named — issue #90, resolving a provider that permits two objects at one name below the IFileSystem seam by provider rename — and is out of this change's scope. Fourth, the record identity floor stops being a choice — a keyPath over a missing property is a DataError, so adr-record-identity-floor-tolerated inverts from tolerance to a floor and fr-rik-012 inverts from declaring the positional fallback live to retiring it by construction.
    adr_refs: [adr-record-key-shape, adr-record-identity-uniqueness-mechanism, adr-record-identity-floor-tolerated]
    contract_refs: [contract-record-identity-uniqueness, contract-record-identity-floor-disposition, contract-record-field-audit, contract-merge-base-survives-relocation]
  - decision_input_ref: decision-input-owner-decision-2-identity-keyed
    disposition: Read literally, as owner decision 5 says it always should have been. The decision fixes that the remote side of the correspondence is identified by provider object identity with path as a persisted field carrying a secondary index. The plan previously read it for its observable content, offered a unique index as an equivalent realization, and reserved the choice; the owner's authority delta confirmed the literal reading and rejected the frame that made the two look interchangeable. sync-records now uses keyPath remoteIdentityKey with a unique index over path, and adr-record-key-shape is accepted rather than reserved.
    adr_refs: [adr-record-key-shape]
    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-keypath-replacement-probe-withdrawn
    disposition: Withdrawn as a blocker and still not replaced by a substitute defect, with one residue relocated to where it is real. The probe wrote one identity at two paths, which is one object that moved and whose record correctly updates. Under the chosen key the replacement it described is genuine in exactly one case — two entities carrying an empty-string identity would fold into one row, because an empty string is a valid key — and contract-record-identity-floor-disposition refuses an empty identity rather than storing it. Nothing else in this plan is justified by the probe.
    adr_refs: [adr-record-key-shape]
    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-path-addressed-call-site-inventory
    disposition: Re-measured from the repository rather than inherited. It was presented to the owner as the costing artifact and was explicitly not allowed to decide the shape; the owner decided on other grounds, so it is now this change's work inventory. Production has 21 SyncStateStore call sites; 17 address a row by the primary key and are re-expressed — address-asking reads through the path index, row-addressing writes by identity — while getAll at change-detector.ts:84, :96 and :104 and clear at orchestrator.ts:95 are key-agnostic and do not change. Inside state.ts six mutating methods are rewritten plus get, getMany, getContent and putContent, and compareAndMove ceases to exist.
