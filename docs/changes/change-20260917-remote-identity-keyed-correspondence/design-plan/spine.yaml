units:
  - title: unit-0-admission-branch-measurement
    chunk: evidence
    contract_refs: [contract-positional-mechanism-evidence]
    files:
      - src/sync/plan-admission.test.ts
      - src/sync/record-rekey-across-commit.test.ts
    acceptance:
      - Both measurement files exist in the working tree already and this unit lands them unchanged in substance - no file under src/ other than these two tests is modified by this unit, and neither file is replaced by a described equivalent.
      - Five fixtures are driven through captureBatchObservation into admitBatchObservation on unchanged production code, each asserting by name the branch taken by selectReportFamily, aliasFolder, completeIdentityEvidence's newPath lookup and the identity guard at identity-component-decision.ts:105-107, so that a mutation to any of those branches fails at least one assertion.
      - The five shapes are present and distinguishable — a remote object renamed under an unchanged local file with a baseline carrying an identity; the same with a baseline carrying none; a remote object replaced at an address by a different id; a rename whose evidence carries no identity; and a folder rename whose descendants are not re-emitted.
      - The recorded answer to whether identity-component-decision.ts:106-107 can fail on main is carried by the file and cited by every later claim in place of the plan's earlier analysis - it cannot fail on any fact shape today's Observation layer emits, the replaced-destination shape is authorized with a match rather than a wrong rename, and removing the rename enrichment is therefore lossless.
      - A sixth case pins the boundary of that answer by constructing the two divergences where the completion map and current.remote key one entity differently and recording conflicting_identity with no actions for both; deleting or weakening that case is a failure of this unit, because the claim it bounds is a claim about a population and not about impossibility.
      - The second measurement drives the orchestrator's own chain — collectChanges, prepareSyncCycleSnapshotForExecution, admitBatchObservation, executePlan — over the real SyncStateStore on fake-indexeddb with pass-through spies on the durable publication routes, and records that the same-cycle baseline is preserved by identity-keyed binding at identity-component-decision.ts:408-409 rather than by the store's key, and that the split-cycle baseline is not retained, the old row being discarded and the object re-downloaded as new, with no wrong-object operation in either shape since decision-engine.ts:19 yields conflict rather than delete_remote. Under owner decision 8a that second result is the model's expected end state and is asserted deliberately as such, not as a defect.
      - No production behaviour changes and no mechanism is retired by this unit.
    objective: Land, as this change's evidence base, the two measurements that settle what production Admission does for five never-measured shapes and what survives a commit, so that every later claim cites a recorded result rather than an analysis.
    output_format: Two test files carried into the change unchanged - one new describe block in the existing Admission test, one new end-to-end measurement over the real store - with the branch or the commit route recorded per shape as an explicit assertion.
    tool_guidance: Drive the production entry rather than calling decideIdentityComponent or selectReportFamily directly, because the unknown this settles is specifically about the end-to-end path; seed the baseline through the same store double the other cases use so the facts are the ones Admission would really see; for the commit-boundary measurement keep the spies pass-through so the real store still performs every write.
    task_boundaries: Change no production file. Do not retire, relax or reroute any positional mechanism. Do not add an AdmissionFailureReason member. Do not assert on internal helpers reached outside admitBatchObservation. Do not adjust either file to the post-change behaviour here - the split-cycle case records the loss on main, and inverting it is unit-4's.
    decision_closure_reason: The five shapes, the four observation sites, the commit-boundary chain and the prohibition on retiring anything are fixed, and the measurements have already been taken; what they found is the point and is not a design choice.

  - title: unit-1-seam-identity-carrier
    chunk: seam
    contract_refs: [contract-seam-carried-identity]
    files:
      - src/fs/types.ts
      - src/fs/interface.ts
      - src/fs/caching/metadata-cache.ts
      - src/fs/caching/id-delta.ts
      - src/fs/caching/id-delta.test.ts
      - src/fs/caching/remote-fs.ts
      - src/fs/caching/remote-fs.contract.test.ts
      - src/fs/dropbox/incremental-sync.ts
      - src/fs/dropbox/incremental-sync.test.ts
    acceptance:
      - RenamePair gains an optional identityKey documented as the producing filesystem's own FileEntity projection for newPath, and the doc comment names extractId, idAt, getPathById and snapshotPathsById as forbidden sources for any value crossing the IFileSystem boundary.
      - The producers reach the identity through one total helper over the already-public abstract toEntity, whose returned value equals toEntity(path, file).identityKey for every cached path and undefined for every uncached one, which never routes through extractId, and which forces no new abstract member on any backend subclass.
      - All three producers — applyEntry's move branch in id-delta.ts, diffById in remote-fs.ts, and applyRename in dropbox/incremental-sync.ts — set identityKey through that one helper and through no other source.
      - A Dropbox full-scan case-only rename of a cached entry with no provider id produces a rename pair with identityKey absent, never with the path_lower value that extractId returns for the same entry, and the test asserts the two differ; this is staged in remote-fs.contract.test.ts, because it is the only shape an id-less entry can reach — incremental-sync.ts:158 gates applyRename on entry.id, and remote-fs.ts:416-421's surrogate key entry.id ?? entry.path_lower changes with any path-changing rename, while path_lower is stable across a case-only one.
      - A Dropbox delta rename of an id-bearing entry produces a pair whose identityKey is the entity projection's, staged in incremental-sync.test.ts, which is the constructible witness that file can host.
      - A Google Drive and a OneDrive fixture each produce a pair whose identityKey equals the id the delta entry carried, and the existing order-independence cases stay green unchanged.
    objective: Stop discarding an identity the producer already holds, using one rule that cannot leak a cache-internal synthetic id.
    output_format: One widened FS type, one new cache helper, three one-line producer changes, and the first unit test file for applyIdDeltaPage.
    tool_guidance: Build fixtures through each backend's own cache subclass so the projection is the real one; assert the carried value against a stat or list projection of the same object rather than against the raw id, so a projection that diverges is caught. At remote-fs.ts:416 the TFile is already in the destructured pair and only needs to stop being thrown away.
    task_boundaries: Do not change apply ordering, descendant enumeration, removeTree, upsertedPaths, or any path-derived behaviour; do not make identityKey required; do not touch src/sync/.
    decision_closure_reason: The identity source and the three call sites are fixed by contract; only the private call shape and the helper's placement remain discretionary.

  - title: unit-2-evidence-preservation
    chunk: evidence-carrier
    contract_refs: [contract-evidence-identity-preservation]
    files:
      - src/sync/identity-evidence.ts
      - src/sync/identity-evidence.test.ts
      - src/sync/remote-change-source.ts
      - src/sync/plan-admission.test.ts
    depends_on: [unit-0-admission-branch-measurement, unit-1-seam-identity-carrier]
    acceptance:
      - collectRemoteRenameEvidence copies identityKey from the pair onto the RenameEvidence and adds nothing when the pair carries none.
      - The rename-evidence dedupe key distinguishes a carried key from an absent key and from a different key, so two claims on one edge with different identities both survive into the report family; absent and empty do not alias. This is this module's own encoding rule and is deliberately not the record layer's admissibility rule, where absent and empty are one inadmissible case.
      - completeIdentityEvidence no longer attaches a remote rename's identityKey from a destination-address lookup, and a report with no carried key reaches Admission with identityKey undefined.
      - The stable_identity occurrence index and the alias pass in the same function are unchanged, and their existing cases stay green.
      - Local rename evidence still carries no identityKey and none is inferred for it.
      - unit-0's recorded branches are cited in this unit's review as the evidence that the removal loses nothing; they show exactly that, so the removal proceeds on a measurement rather than on an argument.
      - The measurement file is updated with the removal rather than left stale - fixtures 1 through 4 record the rename claim reaching Admission with no identity where they currently record the newPath fill, and the sixth case's two divergences record the guard as not reached where they currently record conflicting_identity, which is the observable form of the manufactured failures going with the enrichment. No assertion is loosened into a partial match.
    objective: Carry the producer's identity intact to Admission and remove the address-derived re-attachment that made the downstream check compare a value to its own source.
    output_format: Two small edits in identity-evidence.ts plus the evidence tests that pin the removal and the dedupe distinction.
    tool_guidance: Write the removal test first and watch it fail against the current enrichment; assert on the evidence array rather than on downstream decisions so the two concerns stay separable.
    task_boundaries: Do not change RenameEvidence's public shape beyond the field that already exists, do not add a provenance field, and do not alter the alias or stable_identity passes.
    decision_closure_reason: What is removed, what is preserved and what gates the removal are named line by line; only the private dedupe-key encoding remains discretionary.

  - title: unit-3-cross-source-validation
    chunk: admission
    contract_refs: [contract-cross-source-rename-validation, contract-local-positional-boundary]
    files:
      - src/sync/identity-component-decision.ts
      - src/sync/identity-component-report-family.ts
      - src/sync/plan-admission.test.ts
      - src/fs/local/local-fs.test.ts
    depends_on: [unit-2-evidence-preservation]
    acceptance:
      - A fixture driven through admitBatchObservation in which the carried identity for a remote rename differs from the identity observed at newPath fails the component and produces no action; the RED half is the same producer-level input on main, staged by giving the rename pair an identity rather than by hand-keying the report, which on main reaches Admission keyless, is filled from the destination and is admitted. A fixture whose report is pre-keyed is not a valid RED witness, because completeIdentityEvidence's fill is guarded by !item.identityKey and such a fixture already fails on main.
      - A fixture in which the carried identity matches admits the relation and produces the same actions main produces today.
      - A fixture whose report carries no identity produces exactly the actions main produces today, so ADR 0008's missing-keys-are-no-evidence rule is preserved and no component fails for a missing key.
      - A fixture in which two remote rename claims share an edge but carry different identities reaches the report family and is classified conflicting, and the component degrades to ordinary actions rather than binding either claim.
      - No fixture exists in which a report family, folder relation or binding rejected without identity becomes admissible with one; a mutation that would allow it fails at least one case.
      - LocalFs still reports identityKey undefined, no branch reads a local entity's identityKey as evidence, and the cross-scope local rename and missed-event non-improvements are stated where a reader of the change will find them.
    objective: Turn a self-satisfying guard into a genuine cross-source check without widening what Admission will admit.
    output_format: A minimal change at the remote-rename validation site, no change to the report family's positional rules, and the fixtures that pin the four outcomes.
    tool_guidance: Drive captureBatchObservation into admitBatchObservation rather than calling decideIdentityComponent directly, reusing unit-0's fixture scaffolding; record the branch taken for each fixture as unit-0 did.
    task_boundaries: Do not relax any positional rule, do not add an AdmissionFailureReason member, do not persist a failure, and do not touch decideFolder's suffix coverage or aliasFolder.
    decision_closure_reason: The validation's inputs, outcomes and the prohibition on widening are fixed; only which existing failure reason is reused remains discretionary.

  - title: unit-4-store-constraint-and-merge-base
    chunk: store
    contract_refs: [contract-record-identity-uniqueness, contract-merge-base-survives-relocation]
    files:
      - src/sync/state.ts
      - src/sync/state.test.ts
      - src/sync/state-committer.ts
      - src/sync/state-committer.test.ts
      - src/sync/plan-executor.ts
      - src/sync/plan-executor.test.ts
      - src/sync/change-detector.ts
      - src/sync/opened-file-priority.ts
      - src/sync/conflict-resolver.ts
      - src/sync/identity-component-decision.ts
      - src/sync/plan-admission.test.ts
      - src/sync/fact-first-execution.test.ts
      - src/sync/record-rekey-across-commit.test.ts
      - src/__mocks__/sync-test-helpers.ts
    depends_on: [unit-5-record-shape-and-identity-floor]
    acceptance:
      - sync-records is created with keyPath remoteIdentityKey and createIndex over path declared unique inside the existing onUpgrade recreate, sync-content is re-keyed the same way, and DB_VERSION is bumped with a comment in the established style recording both the reason and that the bump is not what closes the identity-less record class.
      - Two records carrying the same remoteIdentityKey cannot both exist, asserted by writing the second and observing exactly one row for that identity with the later address; no refusal, named duplicate-identity error, or same-transaction holder pre-read exists anywhere in the store.
      - A write whose target address is occupied by a record that is not the expected occupant returns false having written nothing, without reaching the unique path index — the ordinary stale-baseline outcome, asserted to be distinguishable from a transaction abort.
      - Two distinct records written at one path through the uncompared put abort the transaction having written nothing, and the failure reaches the caller as a thrown IDBTransactionError rather than as false, with both stores unchanged; a test fails if it is caught, mapped to false, or compensated by deleting the incumbent. The test does not assert domName, which is null on main for every abort, and nothing in this unit changes or works around src/store/idb-helper.ts.
      - compareAndRewritePaths publishes nothing and returns false when any item's terminal address equals a different item's source address, or when the set is cyclic, while admitting self-overlap where an unmoved item's terminal address is its own source address; a twelve-child folder relocation publishes normally, and a folder relocation whose terminal subtree already holds baselined records outside the set publishes too, each such item being a replacement that deletes its captured foreign incumbent under the one transaction image rather than aborting on the index.
      - compareAndMove no longer exists; compareAndPut takes two explicit expectations — expectedRow for the row keyed by record.remoteIdentityKey and expectedOccupant for the current occupant of record.path through the path index — with no defaulted parameter, and does not acquire compareAndMove's unconditional sync-content deletes. compareAndPut(undefined, record, undefined) still refuses a non-vacant address, and compareAndDelete with no expected record verifies vacancy, deletes nothing and returns true.
      - Every publication is one of exactly two operations and the tests distinguish them. A rename - a terminal carrying expectedRow's own identity at a new address - is a single put, so no delete is issued at all, the primary key is unchanged, and the identically keyed sync-content row stays in place. A replacement - a terminal whose identity differs from that of the record holding the claimed address - deletes that incumbent and inserts the terminal within one transaction, so that afterwards exactly one row holds the address and the incumbent's sync-content row is gone with it; the delete is observable as its own operation rather than as a side effect of the put. A replacement publication carries no continued row, so identity-component-decision.ts:509-511 and :549-551 stop passing the incumbent as both source and destination; a mutation that leaves them passing it as both makes the replacement return false forever and fails at least one case.
      - The comparison precedes the delete, so a replacement whose captured expectation no longer matches the row at the address deletes nothing and returns false, so a stale expectation can never destroy a row the engine did not admit. No classification vocabulary, evidence test, ordering pass, deferral or new AdmissionFailureReason appears anywhere in this unit; an address permutation behaves exactly as on main, the first publication committing and the second returning false on its stale expectation.
      - The commit-boundary measurement is re-priced rather than inverted. src/sync/record-rekey-across-commit.test.ts's split-cycle cases already record the correct end state under owner decision 8a - the old row discarded and the object re-downloaded as new - and are changed only to assert it deliberately, as the model working, rather than as a defect — shape 2 cycle 1 keeps its single surviving row at P and additionally asserts that the incumbent's removal was an explicit delete inside the claiming transaction, and shape 2 cycle 2 keeps its assertion that K1 is treated as a new file. traceCommits loses its compareAndMove spy because the method ceases to exist; the control and same-cycle cases record compareAndPut where they record compareAndMove; and the merge-base case's relocation leg records the base preserved where it records absent, because a rename does not move the row. No instrumentation is weakened and no assertion is loosened into a partial match.
      - compareAndPut and compareAndRewritePaths apply compareAndPut's existing invalidation predicate to the merge base and otherwise leave it in place; a folder relocation either preserves or invalidates every child's base under one transaction image and never partially applies.
      - rewritePaths no longer exists on SyncStateStore or on the store double at src/__mocks__/sync-test-helpers.ts, and nothing in src/ or tests/ references it or compareAndMove. The compareAndMove surface is enumerated and closed — src/sync/state.test.ts, src/sync/fact-first-execution.test.ts (:282, :402-417, :671, :727-742), src/sync/state-committer.test.ts:210-215, src/sync/plan-executor.test.ts:1101 and src/__mocks__/sync-test-helpers.ts:270 — and each spy or bind is re-expressed against compareAndPut rather than deleted.
      - The seventeen key-addressed production call sites are re-expressed — address-asking reads through the path index, row-addressing writes by identity — plan-executor.ts's checkRecord sites are :420, :421, :436 and :437 over the single store.get at :414, and conflict-resolver.ts:135 reads the merge base by the baseline record it already holds rather than by ctx.baselinePath.
      - Every CAS method keeps its boolean return and its stale-baseline false, which stays distinct from a thrown transaction failure.
      - npm run lint, npm run build and npm run test:coverage are green at this unit's boundary.
    objective: Re-key the durable correspondence to provider object identity so two baselines for one object become unrepresentable, split publication into the two operations owner decision 8b names so the displacement the old keyPath performed silently becomes an explicit, compared, asserted delete, guard the filesystem layer's path-uniqueness premise without turning it into a policy branch, stop every rename destroying the three-way merge base, and delete the CAS-free overwrite route.
    output_format: A schema change, seventeen re-expressed call sites, one collapsed CAS method taking two explicit expectations and performing either a single put or a delete-plus-insert, one corrected pair of Admission publication expectations, one invalidation predicate applied where two unconditional deletes were, one relocation admission rule, and the store, Admission and execution tests that pin each.
    tool_guidance: Use fake-indexeddb; seed a previous-version database to prove the cold start rather than asserting on the upgrade callback. Assert the index case through the uncompared put, since every replacement now deletes its own incumbent and cannot reach the index; assert it by the shape of the failure — a throw where a stale baseline returns false, both stores unchanged — and never by a DOMException name, because idb-helper.ts:142 rejects on tx.onerror with tx.error still null and every abort on main is unnamed. Write a test that fails if the error is swallowed into the boolean return. Distinguish the two operations by observing the store's calls and not only its final contents — the rename case must fail if any delete is issued, and the replacement case must fail if the incumbent disappears without one. Write the overlapping and cyclic relocation cases as direct constructions so they stay true if the production loop is rewritten. Drive the corrected publication expectations through admitBatchObservation, reusing unit-0's fixture scaffolding. Let the compiler enumerate the call sites rather than grepping.
    task_boundaries: Do not add a convergence strategy, retry, recovery path, recovery marker or queue for the path-index violation; the index stays a pure defect signal, and a correctly built replacement never reaches it. Do not reintroduce anything owner decision 8 removed — no evidence test for whether a displaced object still exists, no classification vocabulary, no ordering between bindings, no relocating-first emission, no claimer-expects-vacant expectation, no address-permutation refusal and no fail-closed disposition - the correspondence's end is directly observed and a replacement simply deletes the incumbent. Do not add an identity-keyed deletion channel, a scope-completeness or temperature fact carried into Admission, or a new observation kind. Do not push anything to the executor and do not add ordering, regrouping, a dependency graph or a recovery queue there. Do not add a store-side reaper. Do not add a by-identity refusal, a duplicate-identity error, or a holder pre-read — there is no holder to name under this key. Do not order or add a temporary for overlapping relocation sets; refuse them. Do not issue a delete on the rename path, and do not delete an incumbent before comparing it. Do not add a new mutating method, do not add an AdmissionFailureReason member, do not remove put or putContent, do not repair or work around src/store/idb-helper.ts, and do not design or assume anything about how fs enforces path uniqueness or how two objects at one address are arbitrated, which is issue #90's. The record type's required-identity change and the floor land in unit-5, which runs first; this unit must not re-open them.
    decision_closure_reason: The key shape is owner decision 5's and is fixed; the index's role as a hard constraint and guard rather than a policy mechanism under owner decision 7a, the two operations under owner decision 8b, the two CAS expectations and which record fills each, the relocation admission rule, the invalidation predicate and the deletions are all stated; only the private shape of the address comparison and where the invalidation predicate is factored remain discretionary.

