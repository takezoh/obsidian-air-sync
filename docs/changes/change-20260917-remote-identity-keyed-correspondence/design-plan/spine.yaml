    disposition: Retained without amendment. The existing onUpgrade drop-and-recreate is the whole upgrade; no transform is written and no proposal to preserve sync-content across the bump is entertained. Preserving the merge base across a rename is a method-body policy, not a migration, and is a separate matter.
