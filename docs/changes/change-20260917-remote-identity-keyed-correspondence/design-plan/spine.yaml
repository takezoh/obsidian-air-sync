  - decision_input_ref: decision-input-adr-0001-cache-commits-last
    disposition: Retained and extended by one sentence. The record store's new key and its unique path index are storage mechanism subordinate to commit-last, not an identity policy owner — the store declines to represent a state rather than deciding between claimants, and the path index guards a guarantee the filesystem layer owes rather than a policy this layer sets. Identity policy stays confined to identity-component-decision.ts, and sync-admission-authority-guard.test.mjs staying green with no fixture edit is the machine proof of that. The ADR sentence and the accompanying enforcement-document correction are carried by unit-6 as hygiene consequent on the store surface change, not as an obligation AGENTS.md:71-73 imposes; that clause binds an intentional new writer, owner or field, and removing two dead detector names is neither.
