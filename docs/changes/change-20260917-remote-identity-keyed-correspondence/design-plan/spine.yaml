    contract_refs: [contract-record-identity-floor-disposition, contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-dropbox-refusal-creates-the-harm
    disposition: Withdrawn as a mitigation, restated by its real outcome, and still honoured under the floor. Refusing an id-less entity at the Dropbox boundary does not avoid the unbaselinable object, it creates one and additionally removes it from listings, because decision-engine.ts:8-21 puts delete_local, delete_remote and cleanup all under if (prevSync). Nothing in this plan does that — the refusal is at the baseline, not at the backend boundary, so an id-less entity stays listed, compared and conflict-resolvable and only fails to acquire a durable record. That narrower consequence is named in contract-record-identity-floor-disposition and asserted by test, and no requirement here depends on the unknown resolving a particular way.
    adr_refs: [adr-record-identity-floor-tolerated, adr-record-key-shape]
    contract_refs: [contract-record-identity-floor-disposition]
  - decision_input_ref: decision-input-buildsyncrecord-has-no-identity-floor
    disposition: Adopted as the correction to the version bump's stated reach, and inverted by owner decision 5. buildSyncRecord at state-committer.ts:42 copies remote?.identityKey with no floor of its own, so the bump alone would re-mint the identity-less class. Under keyPath remoteIdentityKey the class is unstorable — SyncRecord.remoteIdentityKey becomes required, the positional fallback at identity-component-decision.ts:408-410 stops type-checking and is removed, and the publication path refuses an entity that cannot supply an identity with a named error before any store write. The consequence for that entity is stated and tested rather than tolerated, and it is still not restated as a rule that fails a rename report.
    adr_refs: [adr-record-identity-floor-tolerated]
    contract_refs: [contract-record-identity-floor-disposition]
  - decision_input_ref: decision-input-identityless-class-is-bounded-to-dropbox
    disposition: Established by reading the three wire types, then sharpened by one further measurement and used to size the floor's failure branch rather than to bound a tolerated class. googledrive/types.ts:25 and onedrive/types.ts:20 declare id as a required string; dropbox/types.ts:23 declares id as optional only because the same type also covers deleted tombstones, whose own doc comment says they are never cached and which buildFromFiles skips at dropbox/metadata-cache.ts:148. Every cached entry of all three families therefore carries a provider id, so the floor's refusal branch is expected to be unreachable in production — which is why it is asserted by test rather than designed around.
    adr_refs: [adr-record-identity-floor-tolerated]
    contract_refs: [contract-record-identity-floor-disposition]
  - decision_input_ref: decision-input-empty-string-is-an-index-key
    disposition: Adopted, and its mechanism inverted with the key. Normalizing an empty identity to absent was correct when an absent property meant skipped by a unique index. Under keyPath remoteIdentityKey an absent property is a DataError and an empty string is a perfectly valid key that would silently fold two entities into one row — the only place the withdrawn replacement probe describes something real. The single construction path therefore refuses both as one inadmissible case, and fr-rik-007 states that the field ranges over non-empty strings only. This answer is deliberately not exported to the rename-evidence dedupe key, which must keep a carried, an absent and an empty key distinct; the two layers ask different questions and the plan no longer claims one answer serves both.
    adr_refs: [adr-record-identity-floor-tolerated]
    contract_refs: [contract-record-identity-floor-disposition, contract-evidence-identity-preservation]
  - decision_input_ref: decision-input-warm-escalation-covers-hot-miss
    disposition: Costed and the resulting mechanism excluded, with one caveat carried. A by-identity record read was considered and rejected, because rename evidence already contributes oldPath to the HOT fetch set and an unreported move leaves a component with a current occurrence and no prevSync, which needsWarmComponentAcquisition escalates to a full getAll. The caveat neither draft carried — CurrentFacts.records is rebuilt per cycle from MixedEntity.prevSync and never read from the store inside Admission, but candidateFacts[].baseline is store-derived via getMany at change-detector.ts:147, so the no-store-read statement is true of the first and not the second.
    adr_refs: [adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-scaffold-lists-deleted-rename-debt
    disposition: Checked and found to need no correction. src/sync/rename-debt.ts and adr-20260902-rename-identity-evidence-model.md are both absent from the repository, but neither appears in the change package's source_paths; the stale references live in recovery-scope.json's seed refs, which is not a change-package artifact. No unit owns a correction because none is owed, and the observation is recorded so the question is not reopened.
    adr_refs: [adr-record-identity-uniqueness-mechanism]
  - decision_input_ref: decision-input-issue90-cache-bijection-scaffold
    disposition: Kept separate and not merged, and now also named as the owner of this change's stated premise. The issue-90 direction owns the derived metadata cache's path-to-id bijection and its own change package, and owner decision 5 makes it the owner of the filesystem layer's object-path-uniqueness guarantee — a provider that permits two objects at one name resolving that below the IFileSystem seam, by provider rename, before the sync engine observes it. This change is entitled to assume that guarantee, says so explicitly under scope, designs none of it, and guards it with a unique path index whose violation is a defect signal rather than a branch. This direction owns the durable correspondence and the FS seam; the only overlap is the rename pair's shape, and this plan adds one optional field without widening getChangedPaths' result type, touching RenameAction, or adding an Admission stage.
    adr_refs: [adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-seam-carried-identity]
  - decision_input_ref: decision-input-owner-decision-6-ordering-retirement-and-floor
    disposition: >-
      Binding, and applied by correcting a decomposition rather than by adding a mechanism. The owner's three
      clauses settle the three blockers the independent plan attack returned against the shape-(A) plan, and each
      is applied as stated. 6a - an empty identity is impossible, because a SyncRecord is only written after the
      remote side is settled, so the floor is buildSyncRecord's own and must fail loudly, naming the entity, across
      all three production callers in two files; the plan's claim that the positional fallback is retired because
      its arm stops type-checking is withdrawn as measured false and replaced with retirement by absent population,
      verified by a construction test. 6b - a SyncRecord is no longer authoritative for the address it records once
      the object it names has left that address; the open point the owner required be settled is settled by owner
      decision 8a, which generalises 6b into the record model itself, because the literal "a path the vault no
      longer manages" reading does not reach the attack's witness, where row Z carries path B.md and B.md is still
      managed locally as the move's terminal. Under 8a the record is the correspondence, so the correspondence at
      that address ended when the address became another object's, and the claiming publication observes that end
      directly rather than inferring anything about object Z. 6c - the constraint violation is not a third problem,
      and the first reading of this decision, which proposed a separate issue with a convergence strategy, was
      rejected by the owner for treating a symptom as a new problem without first checking whether an
      already-assigned upstream guarantee closes it. What this change therefore owes is the replacement operation
      of owner decision 8b - delete the incumbent and insert the terminal in one transaction - and not a
      publication order, which owner decision 8 removed along with the evidence rule it served; no convergence
      strategy, retry, recovery path, recovery marker, queue or ordering pass is added, nothing is pushed to the
      executor, and the unique path index stays the pure defect signal owner decision 5 framed it as.
    adr_refs: [adr-record-identity-uniqueness-mechanism, adr-record-key-shape, adr-record-identity-floor-tolerated]
    contract_refs: [contract-record-identity-uniqueness, contract-record-identity-floor-disposition]
  - decision_input_ref: decision-input-owner-decision-7-hard-constraint-and-evidence-retirement
    disposition: >-
      Binding in part, and superseded in part by owner decision 8. 7a stands and is applied: keyPath
      remoteIdentityKey and the unique path index both stay, and the proposal to drop the index is rejected,
      because facts.records is keyed by prevSync.path at identity-component-decision.ts:353 and Admission looks up
      the record for this path, so SyncRecord.path is which local file a record is the correspondence for and two
      such rows are a contradiction; a real filesystem resolves the contention by silently letting the last writer
      win and a durable store of correspondences must refuse. 7b and 7c are superseded outright. 7b asked for
      evidence that an incumbent's object is gone before its row could be retired, and 7c made the absence of that
      evidence a fail-closed component. Owner decision 8a dissolves the question both were answering rather than
      answering it differently: a SyncRecord records a correspondence, not the object's existence, so a
      correspondence whose address now belongs to another object has ended - and that end is directly observed,
      because the new object is at the address now. No death evidence is required, ADR 0008 is not engaged, and the
      whole apparatus 7b and 7c motivated is removed rather than re-contented: the four-way classification, the
      checkpoint_deleted conjunct, currentByIdentity as a retirement input, the analysis of what Admission does not
      hold, the fail-closed disposition, the convergence narrative, the relocating-first ordering, the
      claimer-expects-vacant expectation change and the address-permutation refusal. What replaces them is the
      operation of owner decision 8b - a replacement deletes the incumbent and inserts the terminal in one
      transaction, a rename is a single put - stated in contract-record-identity-uniqueness. Two measurements drive
      what survives and are folded into the verification surface rather than described: plan-admission.test.ts,
      which settles that the guard cannot fail on any shape Observation emits and that the change may not be
      justified on it, and record-rekey-across-commit.test.ts, whose split-cycle end state is the one owner
      decision 8a prescribes, and which unit-4 must re-price so that the case asserts it deliberately rather than
      as a defect.
    adr_refs: [adr-record-key-shape, adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-record-identity-uniqueness, contract-positional-mechanism-evidence]
  - decision_input_ref: decision-input-displaced-incumbent-is-implicit-under-path-keying
    disposition: >-
      Established by measurement and made the whole basis of the replacement operation's minimality. Every
      publication route on main displaces the record occupying the destination address by overwriting its key, and
      three of them are live - identity-component-decision.ts:509-511 and :549-551 build a same-address replacement
      publication whose liveness follows from state.ts:104-106 invalidating the merge base on exactly
      expected.remoteIdentityKey !== record.remoteIdentityKey; src/sync/state.test.ts:250-261 moves object X onto an
      address row Z still holds and asserts the move succeeds; and identity-component-decision.ts:719 carries a
      captured foreign destination outside the relocation set, which state.ts:181-183 compares and today's
      store.put displaces. Under keyPath "path" that displacement is free and invisible at state.ts:101-103; under
      keyPath remoteIdentityKey the displaced row survives the write, keeps its old path and holds the unique path
      index. The consequence taken is that (A) creates no new obligation at all: the discard is exactly the one
      today's put already performs, and what changes is that it must now be written as a delete inside the claiming
      action's own transaction, after the incumbent has been compared. That is the whole reason the unique path
      index earns its keep - it converts a silent side effect of the key into an admitted, compared and asserted
      operation. Under owner decision 8a no disposition falls outside that equivalence, so the previous revision's
      priced behaviour change - a component failing closed and writing nothing where no evidence of the incumbent's
      death existed - is withdrawn along with the rule that produced it. That is why no new durable authority, no
      second publication point, no reaper and no queue is introduced, and why the third scope-expansion signal the
      attack raised - that rows for retired identities would accumulate with no reclamation route - is resolved
      outright: every row whose address is claimed by a record for a different object is deleted by the claiming
      write, with its sync-content row under the same key, and no row is retained past the end of its
      correspondence.
    adr_refs: [adr-record-identity-uniqueness-mechanism, adr-record-key-shape]
    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-cas-expectations-separate-under-identity-keying
    disposition: >-
      Adopted as the correction that closes the store's outcome partition. Under keyPath "path" a single captured
      record served as both "the row this publication continues" and "the row holding this address", because they
      were the same row, which is why state-committer.ts:122 can pass publication.destination as compareAndPut's
      only expectation. Under (A) they separate, and two representative implementations that both satisfied the
      previous wording diverged observably - addressing the row by record.remoteIdentityKey makes a replacement
      publication return false forever, addressing it by expected.remoteIdentityKey drives the write into the path
      index. The plan now states both expectations explicitly with no defaulted parameter, so compareAndMove's
      inherited expected.path === record.path ? expected : undefined at state.ts:119 does not survive in any form,
      compareAndPut(undefined, record, undefined) keeps today's vacancy check for a baseline-free create, and
      compareAndDelete with no expected record keeps today's verified no-op. Which record fills each expectation is
      stated in the same contract, which also corrects :509-511's and :549-551's source: expected
      for a replacement publication, where the continued row is undefined and the incumbent is the destination.
    adr_refs: [adr-record-key-shape, adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-idb-helper-loses-every-abort-name
    disposition: >-
      Measured, accepted, and used to remove a requirement rather than to add work. src/store/idb-helper.ts:139-143
      registers tx.oncomplete, then tx.onerror = () => reject(new IDBTransactionError("error", tx.error)), then
      tx.onabort; per the IndexedDB error-bubbling order the transaction's error attribute is only set during the
      abort steps, so the onerror rejection wins the race and domName is null. Re-measured independently here
      against the repository's own fake-indexeddb with a keyPath remoteIdentityKey store and a unique path index:
      request.onerror ConstraintError, tx.onerror null, tx.onabort ConstraintError, store empty afterwards. This
      affects every aborted transaction, not only a constraint violation, so it is an ordinary helper defect and
      not a design question for this change - owner decision 6c says so explicitly. FR-RIK-006,
      contract-record-identity-uniqueness, AC-RIK-005, verify-duplicate-path-aborts-and-propagates and unit-4's
      acceptance therefore drop the requirement that the failure name ConstraintError and assert what is observable
      instead: the write throws where a stale baseline returns false, nothing is written, the action fails and the
      cycle does not complete. The two repairs an implementer would reach for - catching the request-level error,
      re-parsing the message string - stay forbidden; discretion-cas-address-comparison-shape keeps its prohibition
      on touching idb-helper.ts, which is now consistent rather than contradictory, because the observable no
      longer needs the helper. The defect is recorded as open question 5 and is neither repaired nor worked around.
    adr_refs: [adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-required-field-is-not-a-type-error
    disposition: >-
      Accepted as a falsification and applied by replacing the verification, per owner decision 6a. The claim that
      making SyncRecord.remoteIdentityKey required turns the positional arm at
      identity-component-decision.ts:408-410 into a type error was measured false: the empty string is falsy, so
      x ? A : B over x: string is a legal, unflagged condition, the exact shape compiles clean under this
      repository's own tsc -noEmit -skipLibCheck --strict, and eslint.config.mts configures no
      @typescript-eslint/no-unnecessary-condition. npm run build therefore cannot discriminate whether the arm is
      present, so AC-RIK-012 was unachievable and verify-positional-fallback-does-not-type-check was
      non-discriminating. Both are replaced. The arm is retired because the population it serves cannot exist -
      buildSyncRecord refuses an absent or empty identity - and that is asserted by
      verify-identityless-record-construction-fails, a test that fails when an identity-less record is constructed.
      The same false premise is removed from fr-rik-012, unit-5's acceptance and
      adr-record-identity-floor-tolerated. The attack's accompanying enumeration of other absence-branching sites
      is taken and extended by re-measurement, and disposed of under DP-6 by the distinction it blurred: an absent
      record stays possible and its optional chains are untouched, while an absent field does not and every test of
      it is removed, reduced or tightened, none repaired positionally and none folded to the empty string.
    adr_refs: [adr-record-identity-floor-tolerated]
    contract_refs: [contract-record-identity-floor-disposition]
  - decision_input_ref: decision-input-buildsyncrecord-has-three-callers-in-two-files
    disposition: >-
      Measured and made the floor's placement rule, per owner decision 6a. buildSyncRecord (state-committer.ts:33-46)
      is one function with three production callers in two files - state-committer.ts:119,
      opened-file-priority.ts:61 and :88 - and the two the previous revision did not name both write to the store,
      at opened-file-priority.ts:62 and :91. So a floor placed in commitAction leaves the priority path unguarded,
      and to keep the required field satisfiable an implementer taking that option must write
      remote?.identityKey ?? "" inside buildSyncRecord, which is exactly the fold fr-rik-007 forbids - meaning the
      discretion's two permitted alternatives did not preserve the same observable. discretion-identity-floor-refusal-site
      now offers only representatives inside buildSyncRecord, scopes to both files, and unit-5's file list carries
      opened-file-priority.ts. A second gap is closed with it: the contract's unknown outcome no longer describes
      the priority path as a cycle action. It is not one - its outer try/catch at :37 and :116-123 ends a failed
      attempt with a warn, requestNormalLifecycle() and failed_retryable, and its inner baseline commit at :89-99
      warns and defers - so the refusal takes that existing route, and the same entity reaches commitAction in the
      batch cycle where the cycle-level outcome applies.
    adr_refs: [adr-record-identity-floor-tolerated]
    contract_refs: [contract-record-identity-floor-disposition]
  - decision_input_ref: decision-input-required-field-binds-the-test-surface
    disposition: >-
      Accepted and priced, closing the asymmetry the attack named. tsconfig.json includes tests/**/*.ts as well as
      src/**/*.ts, so npm run build type-checks the whole test surface and a required non-empty field binds every
      SyncRecord construction in the repository. Re-measured on main at 60e85b0 - 27 files contain a SyncRecord
      literal, of which three are production, leaving 24 test and mock files; tests/fs/contracts/remote-change-detection.contract.ts
      calls buildSyncRecord at :64, :74 and :90; state.test.ts's makeRecord at :7-17 omits the field entirely; and
      compareAndMove is referenced in five files, of which fact-first-execution.test.ts and plan-executor.test.ts
      appeared in no unit's file list while unit-4 required that nothing in src/ or tests/ reference it. The seam
      half priced exactly this blast radius through scope-signal-conformance-cell-rewrites-existing-assertions and
      the store half priced none of it. unit-5 now enumerates the record-literal surface and unit-4 the
      compareAndMove surface, the work inventory under approach carries a row for it, and
      scope-signal-required-field-binds-the-whole-test-surface records it. The unit boundary is the measured set
      plus any further file the compiler names, because the compiler is the reliable enumerator here.
    adr_refs: [adr-record-key-shape, adr-record-identity-floor-tolerated]
    contract_refs: [contract-record-identity-floor-disposition, contract-record-field-audit]
  - decision_input_ref: decision-input-ownership-guard-second-fixture-consumer
    disposition: >-
      Accepted as a correction to a measurement this plan made and got wrong. The claim that
      MUTATING_SYNC_STATE_METHODS is "consumed at exactly one site, :199" is false: sync-state-ownership-guard.test.mjs:320
      is a second, hardcoded consumer iterating the five compare-and-swap names and generating two negative-fixture
      tests per name, so once compareAndMove leaves the set at :9-12 both of its generated tests fail and
      npm run lint:bot-repro goes red. The claim is removed from DP-5, fr-rik-009 and nfr-rik-004. What survives,
      re-derived by hand here, is the load-bearing half: the four per-file inventories stay byte-identical -
      mutationCallers remains [opened-file-priority.ts, orchestrator.ts, state-committer.ts] because each still
      calls a method that remains in the reduced set, and imports, references and constructors are untouched - so
      this is detector hygiene and not the intentional new writer, owner or field AGENTS.md:71-73 binds the triple
      to, and the removal of contract-two-authority-enforcement-triple stands. unit-6 now prices the fixture edit at
      both sites and its tool_guidance is corrected, because it previously instructed the implementer to read a
      :320 failure as evidence that a removed name was still load-bearing, which would be the opposite of the
      truth: only an inventory change is that evidence.
    adr_refs: [adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-dropbox-idless-rename-is-case-only
    disposition: >-
      Accepted, and used to re-home a witness and re-ground a rejection rather than to drop either. Re-measured -
      on the delta route dropbox/incremental-sync.ts:158 computes oldPath only when entry.id is truthy, so
      applyRename at :201 is unreachable for an id-less entry and no pair is pushed; on the full-scan route
      remote-fs.ts:416-421 keys on extractId = entry.id ?? entry.path_lower, so for an id-less entry the surrogate
      key is the lowercased path and any path-changing rename changes it, missing oldPathById and surfacing as
      delete-plus-add. The one constructible shape is a case-only rename, where path_lower is stable while the
      cached display path changes. contract-seam-carried-identity's adversarial witness was bound to
      verify-dropbox-delta-rename-carries-entry-id, a verification that runs incremental-sync.test.ts and therefore
      cannot host it; it moves onto the case-only full-scan shape and onto
      verify-fullscan-diff-carries-projected-identity, which runs remote-fs.contract.test.ts where diffById and
      idAt are both reachable, and the delta verification keeps a constructible id-bearing normal witness. DP-1's
      rejection of option (a) is re-grounded rather than preserved: the decisive reason is that fr-rik-002 cannot
      be stated over extractId at all, because extractId's own doc comment declares it a total address function, so
      any agreement with the entity projection would be coincidental rather than contractual; the stall survives at
      one-sub-case size and is now described at that size. unit-1's acceptance is restated to match.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-seam-carried-identity, contract-cross-family-identity-conformance]
