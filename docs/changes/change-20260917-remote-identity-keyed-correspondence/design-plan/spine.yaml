    disposition: Position taken — remove it from SyncRecord only. Measured — one writer at state-committer.ts:43, the type declaration, and hot-warm-promotion.ts:43 merging the entity's field, not the record's; no production reader. The identifying half of its contents duplicates the correspondence key. Reversal condition recorded as a named production reader of SyncRecord.backendMeta.
