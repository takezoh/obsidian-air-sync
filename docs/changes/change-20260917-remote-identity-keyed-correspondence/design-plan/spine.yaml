contracts:
  - id: contract-seam-carried-identity
    dimension: integration_contract
    owner: component-fs-rename-contract
    requirement_refs: [FR-RIK-001, FR-RIK-002, NFR-RIK-001, NFR-RIK-003]
    unit_refs: [unit-1-seam-identity-carrier, unit-7-cross-family-conformance]
    adr_refs: [adr-remote-correspondence-identity-carrier]
    verification:
      - id: verify-renamepair-carries-projected-identity
        tier: T0
        command: npm test -- src/fs/caching/id-delta.test.ts
      - id: verify-dropbox-delta-rename-carries-entry-id
        tier: T0
        command: npm test -- src/fs/dropbox/incremental-sync.test.ts
      - id: verify-fullscan-diff-carries-projected-identity
        tier: T0
        command: npm test -- src/fs/caching/remote-fs.contract.test.ts
      - id: verify-order-independence-unchanged
        tier: T1
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
    partition:
      outcomes: [determinate, unknown]
      default_policy: A produced pair carries identityKey when the producing filesystem's own entity projection for newPath yields one (determinate); it omits the field when the projection yields none (unknown). There is no third outcome and no substitute value; the producer never invents, defaults, or falls back to a cache-internal id, and extractId, idAt, getPathById and snapshotPathsById are forbidden as sources for any value crossing the IFileSystem boundary.
    discretion:
      - id: discretion-identity-lookup-call-shape
        unit_ref: unit-1-seam-identity-carrier
        question: Whether each producer calls the cache projection helper once per moved entry, hoists it above the branch, or passes the already-held TFile to a projection call.
        scope:
          files:
            - src/fs/caching/id-delta.ts
            - src/fs/caching/remote-fs.ts
            - src/fs/dropbox/incremental-sync.ts
          component: component-delta-producers
          visibility: private
        escalate_when:
          - The shape would read extractId, idAt, getPathById or snapshotPathsById as the identity source.
          - The shape would make the carried value differ from the entity projection for any backend.
          - The shape would require a backend-specific branch in src/fs/caching/.
        constraints:
          - The three producers must reach the same single rule; no producer keeps a private identity source.
        preserves:
          invariant_refs: [FR-RIK-002]
        verification_refs: [verify-renamepair-carries-projected-identity]
        difficulty_inputs:
          decision_reasoning: mechanical
