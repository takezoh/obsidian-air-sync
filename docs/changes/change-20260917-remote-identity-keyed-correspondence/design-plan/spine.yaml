    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-getmany-is-a-primary-key-lookup
    disposition: Adopted as the correction that made the inherited table unusable as is, and now as work. SyncStateStore.getMany at state.ts:61-76 issues store.get(p) per path, so change-detector.ts:147 and :180 are primary-key lookups and not record.path field reads, and the conclusion that three sites need nothing is false; both move to the path index. One further correction the critique did not make is carried with it — getAll is neither a field read nor a key lookup, because it returns every value regardless of keyPath.
    adr_refs: [adr-record-key-shape]
    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-conflict-resolver-reads-content-by-path
    disposition: Adopted as a consumer-disposition correction and now discharged. conflict-resolver.ts:135 calls getContent(ctx.baselinePath ?? ctx.path), a by-path read of the content store, so draft-1's listing of it as needing no change was wrong. sync-content is re-keyed with sync-records, so getContent takes the identity and this one caller supplies it from the baseline record it already holds — the expression is guarded by ctx.baseline && and baseline is typed SyncRecord at conflict-resolver.ts:21 — and stops consulting ctx.baselinePath there. The content store gains no path index, because nothing reads a merge base by address afterwards.
    adr_refs: [adr-record-key-shape]
    contract_refs: [contract-merge-base-survives-relocation]
  - decision_input_ref: decision-input-relocation-overlap-under-inversion
    disposition: Live, and discharged by refusing the class rather than ordering it. Injectivity in addresses and in identities does not imply the terminal address set is disjoint from the source address set, and under identity keying the store.delete(item.source.path) that makes today's order safe is gone — source and terminal are one row — so an overlapping set aborts in one put order and completes in the reverse while a cyclic set has no safe order without a temporary. contract-record-identity-uniqueness extends compareAndRewritePaths' existing non-injectivity refusal at state.ts:167-169 with one more admission condition of the same shape — any item's terminal address equalling a different item's source address publishes nothing and returns false, and self-overlap is admitted because it is one row whose address does not change. Ordering is not added, because the only production caller cannot construct either class — all sources share the old folder prefix, all terminals the new one, and a folder cannot be renamed into its own subtree — so ordering would be structure with no reachable failure behind it, the same test that rejected the folder-relocation identity graft.
    adr_refs: [adr-record-key-shape]
    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-dropbox-entry-without-id-unsettled
    disposition: Kept on record with its settling observation — the Dropbox list_folder contract text plus one opt-in e2e raw page dump — and re-pointed at what it actually is under the chosen key — a precondition of the store shape rather than a sizing question, and no longer a gate on any decision here. Measurement bounds its expected population to empty — DropboxEntry.id is optional only because the same type covers deleted tombstones, whose doc comment says they are never cached and which buildFromFiles skips at dropbox/metadata-cache.ts:148, while googledrive/types.ts:25 and onedrive/types.ts:20 declare id as a required string. contract-record-identity-floor-disposition is total either way and asserts the id-less outcome by test rather than assuming it unreachable. The unknown still gates whether a remote folder rename may ever require an identity, which stays out of scope.
