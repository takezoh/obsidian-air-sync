  - decision_input_ref: decision-input-owner-decision-4-version-bump-cold-start
    disposition: Binding and not re-litigated, with its reach corrected. The bump is the only place a keyPath or an index can be declared, and the existing onUpgrade drop-and-recreate is the whole upgrade. What it does not do is retire the positional fallback at identity-component-decision.ts:408-410 — that is the key's doing, not the bump's, because buildSyncRecord has no floor of its own and would otherwise re-mint the class. The plan says so explicitly rather than crediting the bump with a closure it does not give. The standing cold-start cost is not specific to this change and is not re-costed.
