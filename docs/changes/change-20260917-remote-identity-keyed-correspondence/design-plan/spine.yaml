  - id: contract-positional-mechanism-evidence
    dimension: control_flow
    owner: component-admission-identity-gate
    requirement_refs: [FR-RIK-014, FR-RIK-004]
    unit_refs: [unit-0-admission-branch-measurement, unit-2-evidence-preservation, unit-5-record-shape-and-identity-floor]
    adr_refs: [adr-remote-correspondence-identity-carrier]
    verification:
      - id: verify-five-shapes-reach-named-branches
        tier: T0
        command: npm test -- src/sync/plan-admission.test.ts
      - id: verify-replaced-destination-shape-records-guard-branch
        tier: T0
        command: npm test -- src/sync/plan-admission.test.ts
      - id: verify-guard-failure-boundary-stays-pinned
        tier: T0
        command: npm test -- src/sync/plan-admission.test.ts
      - id: verify-committed-baseline-fate-is-recorded
        tier: T0
        command: npm test -- src/sync/record-rekey-across-commit.test.ts
    partition:
      outcomes: [determinate, unknown]
      default_policy: >-
        A shape is determinate when it reaches a named branch at each of the four observed sites through
        admitBatchObservation and that branch is asserted; it is unknown when the shape cannot be constructed
        through the production entry, in which case the reason is recorded rather than replaced by a direct call to
        an internal function. No mechanism is retired by either outcome; an unknown shape blocks only the claim
        that depended on it. The measurement has been taken and this contract now records its result rather than
        the work. All five shapes are determinate: shapes 1, 2 and 3 fill the rename claim's identity from the
        newPath lookup and the guard passes because the filled key is the current occupant's own, shape 4's lookup
        misses so line 106's precondition short-circuits the guard, and shape 5 produces no remote rename evidence
        at all; shape 3, the replaced-destination case, is authorized with a match rather than a wrong rename,
        because indexFacts and bindFiles:420-421 discriminate it ahead of the guard. The recorded answer is that
        identity-component-decision.ts:106-107 cannot fail on any fact shape today's Observation layer emits, so
        removing the positional enrichment is lossless and the change is not justified on that guard. The record is
        complete in both directions: a sixth case constructs the two divergences where the completion map and
        current.remote key one entity differently - an entry addressed at one path carrying a remote endpoint
        resolved at another, and two remote observations at one address where insert keeps the hashed unkeyed
        prior - and records conflicting_identity with no actions for both, so the boundary of the cannot-fail claim
        stays pinned rather than being softened into never-fails. Whether the Observation layer can emit either
        divergence is not established and is not claimed either way. A second measurement,
        src/sync/record-rekey-across-commit.test.ts, records across the publication boundary that the same-cycle
        baseline is preserved by identity-keyed binding at identity-component-decision.ts:408-409 and not by the
        store's key, and that the split-cycle baseline is not retained - the old row is discarded and the object
        re-downloaded as new. Under owner decision 8a that second result is the model working rather than a defect,
        because a correspondence whose address now belongs to another object has ended and a reappearing object is a
        new file, so the case is asserted deliberately as the expected end state. Both files
        must be landed and kept green; deleting or weakening the divergence case, or replacing either file with a
        described equivalent, is forbidden.

  - id: contract-local-positional-boundary
    dimension: integration_contract
    owner: component-local-endpoint
    requirement_refs: [NFR-RIK-002]
    unit_refs: [unit-3-cross-source-validation]
    adr_refs: [adr-remote-correspondence-identity-carrier]
    verification:
      - id: verify-localfs-identity-stays-undefined
        tier: T0
        command: npm test -- src/fs/local/local-fs.test.ts
      - id: verify-local-rename-evidence-carries-no-identity
        tier: T0
        command: npm test -- src/sync/identity-evidence.test.ts
      - id: verify-local-tracker-unchanged
        tier: T1
        command: npm test -- src/sync/local-tracker.test.ts
    partition:
      outcomes: [determinate, unknown]
      default_policy: Every local endpoint is unknown with respect to provider identity, permanently and by construction; determinate applies only to the remote endpoint. A local rename is bound by the live vault event plus vacancy and terminal proofs, never by an identity, no code may read a local entity's identityKey as evidence, and the change states rather than repairs the missed-event and cross-scope cases.

  - id: contract-record-identity-uniqueness
    dimension: data_model
    owner: component-record-store
    requirement_refs: [FR-RIK-006, FR-RIK-007, FR-RIK-008, FR-RIK-009, FR-RIK-012, NFR-RIK-001, NFR-RIK-004]
    unit_refs: [unit-4-store-constraint-and-merge-base, unit-6-enforcement-triple]
    adr_refs: [adr-record-identity-uniqueness-mechanism, adr-record-key-shape]
    verification:
      - id: verify-replacement-deletes-incumbent-and-inserts-one-row
        tier: T0
        command: npm test -- src/sync/state.test.ts
      - id: verify-rename-is-a-single-put-that-deletes-nothing
        tier: T0
        command: npm test -- src/sync/state.test.ts
      - id: verify-duplicate-path-aborts-and-propagates
        tier: T0
        command: npm test -- src/sync/state.test.ts
      - id: verify-refusals-return-false-without-reaching-the-index
        tier: T0
        command: npm test -- src/sync/state.test.ts
    partition:
      outcomes: [determinate, conflicting, unknown]
      default_policy: sync-records uses keyPath remoteIdentityKey with a unique index over path, and sync-content is re-keyed the same way; both remoteIdentityKey and path are mandatory. At most one record per remote identity holds by construction, so there is no duplicate-identity outcome to handle. Each CAS method takes two explicit expectations with no defaulted parameter — expectedRow for the row keyed by record.remoteIdentityKey, and expectedOccupant for the current occupant of record.path read through the path index — so compareAndMove's inherited default at state.ts:119 does not survive in any form and compareAndPut(undefined, record, undefined) keeps today's vacancy check for a baseline-free create; compareAndDelete with no expected record verifies the address is vacant, deletes nothing and returns true, which is today's verified no-op. Admission fills the two expectations mechanically from facts it already holds - expectedRow is the row carrying the identity this publication writes and is undefined for a replacement, expectedOccupant is the row holding the claimed address - which corrects identity-component-decision.ts:509-511 and :549-551, where a same-address replacement today passes the incumbent as both source and destination; left as it is, the CAS would look for a row keyed by the new identity, compare it against the old record and return false on every cycle. Every publication is one of exactly two operations. A rename, where expectedRow and the terminal carry one identity and only path differs, is a single put - the primary key does not move, no row is deleted, and sync-content's identically keyed row stays in place; this is simpler than today's compareAndMove, which had to delete at the old key and put at the new one, and is why that method collapses rather than being re-expressed. A replacement, where expectedOccupant is a record for a different identity than the terminal's, deletes that incumbent and inserts the terminal in one transaction, after comparing the incumbent against expectedOccupant. Nothing is inferred about whether the incumbent's object still exists - owner decision 8a settles that a SyncRecord records a correspondence, that a correspondence whose address now belongs to another object has ended, and that the claiming publication observes that end directly - so there is no classification, evidence test, ordering pass or failure reason anywhere in this contract. A durable record write is determinate when both comparisons pass and the write applies, deleting a displaced incumbent in the same transaction when the publication is a replacement; conflicting when either comparison fails, in which case nothing is written, nothing is deleted because the comparison precedes the delete, and the method returns false exactly as a stale baseline does today; unknown when the write nonetheless reached the unique path index and the index aborted it, which can only mean the filesystem layer's path-uniqueness guarantee is broken, in which case nothing is written and the transaction failure propagates as a throw rather than being caught, mapped to false, or compensated by deleting an incumbent after the fact - the only row a write removes is the incumbent captured as that publication's destination and compared inside the same transaction. The unknown outcome is asserted by its shape — a throw where a stale baseline returns false, with both stores unchanged — and never by a DOMException name, because idb-helper.ts:142 rejects on tx.onerror with tx.error still null so every abort on main is unnamed; measured against the repository's own fake-indexeddb, request.onerror is ConstraintError, tx.onerror is null and tx.onabort is ConstraintError. That helper defect is independently repairable, is not repaired here, and is not worked around at any call site. Conflicting produces the ordinary re-plan; unknown fails the action, blocks cycle completeness and leaves the checkpoint uncommitted. A multi-record relocation updates each identity-keyed row in place and, where an item's terminal address is held by a captured foreign incumbent at identity-component-decision.ts:719, that item is a replacement and deletes it under the one transaction image; the set refuses — publishing nothing, returning false — any arrangement in which one item's terminal address equals a different item's source address, or which is cyclic; self-overlap, where an unmoved item's terminal address is its own source address, is admitted.
    discretion:
      - id: discretion-cas-address-comparison-shape
        unit_ref: unit-4-store-constraint-and-merge-base
        question: Whether each CAS method reads the target address through the path index directly, or through one shared private helper issued inside the same readwrite transaction.
        scope:
          files:
            - src/sync/state.ts
          component: component-record-store
          visibility: private
        escalate_when:
          - The shape would change any CAS method's boolean return contract into a new result type.
          - The shape would let an abort from the path index be caught, mapped to false, or compensated by deleting an incumbent to make room after the fact; the only row a write may remove is the incumbent captured as that publication's destination and compared inside the same transaction before it is removed.
          - The shape would issue the incumbent's delete before comparing it, so that a stale expectation could destroy a row the engine did not admit.
          - The shape would issue a delete on the rename path, where the primary key does not move and a single put is the whole operation.
          - The shape would recover the abort's DOMException name by catching the request-level error or re-parsing a message string.
          - The shape would require a change to src/store/idb-helper.ts, or a second transaction.
        constraints:
          - The address comparison is issued inside the same readwrite transaction as the write it guards, so an ordinary stale destination is conflicting and never reaches the index.
          - No pre-read is added to name the holder of a duplicated identity; there is no such holder under this key.
        preserves:
          invariant_refs: [FR-RIK-006]
        verification_refs: [verify-refusals-return-false-without-reaching-the-index]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: component
          context_scope: files
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: data_loss
          coupling: independent
          grounding: evidenced

  - id: contract-merge-base-survives-relocation
    dimension: state_lifecycle
    owner: component-record-store
    requirement_refs: [FR-RIK-013]
    unit_refs: [unit-4-store-constraint-and-merge-base]
    adr_refs: [adr-record-identity-uniqueness-mechanism]
    verification:
      - id: verify-unchanged-rename-keeps-merge-base
        tier: T0
        command: npm test -- src/sync/state.test.ts
      - id: verify-content-changing-rename-drops-merge-base
        tier: T0
        command: npm test -- src/sync/state.test.ts
      - id: verify-folder-relocation-preserves-every-child-base
        tier: T0
        command: npm test -- src/sync/state.test.ts
      - id: verify-renamed-file-still-three-way-merges
        tier: T1
        command: npm test -- src/sync/conflict-resolver.test.ts
    partition:
      outcomes: [determinate, conflicting]
      default_policy: The relocating publication paths apply compareAndPut's existing invalidation predicate — delete the base when there is no expected record, when the record has no hash, or when hash, localSize or remoteIdentityKey changed — and otherwise leave the content row in place (determinate), which suffices because sync-content is keyed by remoteIdentityKey and a relocation does not move the row. Where the enclosing CAS comparison fails, nothing is published, the call returns false exactly as a stale baseline does today, and the base is untouched (conflicting). A relocation set never partially applies. The predicate must survive compareAndMove's collapse into compareAndPut rather than being carried across as that method's unconditional content deletes, and must replace compareAndRewritePaths' two unconditional deletes with one per-item application. This is a method-body policy and is not counted as a payoff of the record key shape.
    discretion:
      - id: discretion-merge-base-invalidation-site
        unit_ref: unit-4-store-constraint-and-merge-base
        question: Whether the invalidation predicate is factored into one private helper the CAS bodies share, or applied inline in each.
        scope:
          files:
            - src/sync/state.ts
          component: component-record-store
          visibility: private
        escalate_when:
          - The site would need a second transaction or a read outside the transaction that guards the write.
          - The site would change getContent's or putContent's public signature beyond the key change the store shape already requires.
          - The site would let a relocation set apply partially, or let any path delete a base unconditionally.
        constraints:
          - The invalidation predicate is compareAndPut's existing one, referenced rather than copied into a second statement of it.
        preserves:
          invariant_refs: [FR-RIK-013]
          contract_refs: [contract-record-identity-uniqueness]
        verification_refs: [verify-unchanged-rename-keeps-merge-base]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: component
          context_scope: files
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: data_loss
          coupling: coupled_within_unit
          grounding: evidenced

  - id: contract-record-field-audit
    dimension: data_model
    owner: component-record-shape
    requirement_refs: [FR-RIK-010, FR-RIK-008, NFR-RIK-001]
    unit_refs: [unit-5-record-shape-and-identity-floor]
    adr_refs: [adr-record-identity-uniqueness-mechanism]
    verification:
      - id: verify-backendmeta-absent-from-record
        tier: T0
        command: npm test -- src/sync/state-committer.test.ts
      - id: verify-no-production-reader-of-record-backendmeta
        tier: T1
        command: npm run build
      - id: verify-cas-equality-unaffected
        tier: T0
        command: npm test -- src/sync/state.test.ts
      - id: verify-entity-backendmeta-untouched
        tier: T1
        command: npm test -- src/sync/plan-admission.test.ts
    partition:
      outcomes: [determinate, unknown]
      default_policy: Each SyncRecord field is kept when its last-sync value is both underivable from current state and not already carried by the correspondence key, and removed otherwise; backendMeta is the single removal, and path, remoteIdentityKey, remoteChecksum, hash, localMtime, remoteMtime, localSize, remoteSize and syncedAt are kept. path is kept as a persisted, queryable fact carrying a unique index — a constraint, not the identity of the row — and remoteIdentityKey is kept and promoted to the store's keyPath, becoming required and non-empty. syncedAt is kept as underivable although no production reader was found, and that observation is recorded rather than acted on. The reversal condition for the one removal is a named production reader of SyncRecord.backendMeta.

  - id: contract-record-identity-floor-disposition
    dimension: failure_recovery
    owner: component-record-shape
    requirement_refs: [FR-RIK-012, FR-RIK-007]
    unit_refs: [unit-5-record-shape-and-identity-floor]
    adr_refs: [adr-record-identity-floor-tolerated]
    verification:
      - id: verify-empty-identity-takes-the-same-branch-as-absent
        tier: T0
        command: npm test -- src/sync/state-committer.test.ts
      - id: verify-identityless-record-construction-fails
        tier: T0
        command: npm test -- src/sync/state-committer.test.ts
      - id: verify-priority-attempt-defers-instead-of-baselining
        tier: T0
        command: npm test -- src/sync/opened-file-priority.test.ts
      - id: verify-identityless-publication-writes-nothing
        tier: T0
        command: npm test -- src/sync/state.test.ts
    partition:
      outcomes: [determinate, unknown]
      default_policy: >-
        SyncRecord.remoteIdentityKey is a required non-empty string and buildSyncRecord is the single construction function, which is where the value floor lives — not in any one of its three production callers in two files, src/sync/state-committer.ts:119 and src/sync/opened-file-priority.ts:61 and :88, because a floor in commitAction would leave the priority path unguarded and would force a remote?.identityKey ?? "" fold inside buildSyncRecord to keep the required type satisfiable. A record is determinate when the provider supplied a non-empty identity, in which case the record carries it and is the unique row for it. It is unknown when the provider supplied none or an empty string, which are one inadmissible case — no record is constructed, buildSyncRecord throws naming the entity before any store write, nothing is written, and each caller disposes of the throw by its own established route: commitAction fails the action so the cycle does not complete, the checkpoint stays uncommitted and the entity is re-observed next cycle, while the opened-file priority attempt takes no baseline, invalidates its target and defers to the batch through the try/catch it already has, where the same entity reaches commitAction. The entity is not refused at the backend boundary and stays listed, compared and conflict-resolvable; what it cannot acquire is a durable baseline. The unknown outcome's expected population is empty, because every cached entry of all three families carries a provider id, and the outcome is asserted by test rather than assumed unreachable. The retirement of the positional arm at identity-component-decision.ts:408-410 follows from this outcome's emptiness and is asserted by the construction test, never by npm run build, which was measured non-discriminating.
    discretion:
      - id: discretion-identity-floor-refusal-site
        unit_ref: unit-5-record-shape-and-identity-floor
        question: Whether the floor is a guard clause inside buildSyncRecord's body or a small named predicate that buildSyncRecord calls and that narrows the remote entity's type for it.
        scope:
          files:
            - src/sync/state-committer.ts
            - src/sync/opened-file-priority.ts
          component: component-record-shape
          visibility: private
        escalate_when:
          - The refusal would sit in a caller rather than in buildSyncRecord, which would leave the two opened-file-priority callers at :61 and :88 unguarded while they both write to the store at :62 and :91.
          - The refusal would require a remote?.identityKey ?? "" fold anywhere to keep the required type satisfiable.
          - The check would let an absent or empty identity reach the store and surface as a DataError or as a silently replaced row.
          - The check would also rewrite FileEntity.identityKey, refuse the entity at the backend boundary, or remove it from a listing.
          - The refusal would make the opened-file priority attempt fail the cycle, or make commitAction defer instead of failing the action.
        constraints:
          - Absent and empty are one case with one branch; no third state is introduced, and this answer is not exported to the rename-evidence dedupe key, which must keep them distinct.
          - Both representatives put the branch inside buildSyncRecord, so all three production callers in both files reach the same refusal and the same observable.
        preserves:
          invariant_refs: [FR-RIK-007, FR-RIK-012]
        verification_refs: [verify-empty-identity-takes-the-same-branch-as-absent, verify-identityless-record-construction-fails]
        difficulty_inputs:
          decision_reasoning: mechanical
          boundary_reach: private
          context_scope: files
          reversibility: trivial
          verification_strength: discriminating
          runtime_risk: normal
          coupling: independent
          grounding: evidenced

  - id: contract-cross-family-identity-conformance
    dimension: integration_contract
    owner: component-shared-fs-contracts
    requirement_refs: [FR-RIK-011, FR-RIK-001, NFR-RIK-003]
    unit_refs: [unit-7-cross-family-conformance]
    adr_refs: [adr-remote-correspondence-identity-carrier]
    verification:
      - id: verify-file-rename-pair-identity-matches-stat
        tier: T0
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
      - id: verify-folder-rename-pair-identity-matches-stat
        tier: T0
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
      - id: verify-both-provider-orderings-agree
        tier: T0
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
      - id: verify-matrix-still-fails-closed-on-missing-cell
        tier: T1
        command: npm run build
    partition:
      outcomes: [determinate, unknown, conflicting]
      default_policy: For each registered family a rename case is determinate when the pair's identityKey equals the identityKey a stat of newPath reports; unknown when the family's projection legitimately yields no identity, which the case must assert as an explicit absence with a cited reason rather than skip; conflicting when the pair carries an identity stat does not report, which fails the shared case for that family with no opt-out. The existing object literals at :314, :333 and :351-356 are updated to include the identity, never loosened to a partial match.

adrs:
  - id: adr-remote-correspondence-identity-carrier
    status: proposed
