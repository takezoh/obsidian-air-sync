acceptance:
  - id: AC-RIK-001
    criteria: For every registered backend family and both provider orderings, each reported remote rename pair carries the identityKey that a stat of newPath reports, or explicitly no identity with a cited reason; no pair ever carries a cache-internal synthetic id, and a Dropbox entry with no provider id yields a pair whose identityKey is absent rather than path_lower.
    requirement_refs: [FR-RIK-001, FR-RIK-002, FR-RIK-011]
  - id: AC-RIK-002
    criteria: A carried identity reaches Admission unchanged, and two rename claims on one edge carrying different identities both survive the evidence stage and are classified conflicting rather than collapsed by the dedupe key.
    requirement_refs: [FR-RIK-003]
  - id: AC-RIK-003
    criteria: Driven through admitBatchObservation, a remote rename whose carried identity disagrees with the identity observed at newPath fails its component and produces no action, where the same producer-level input on main produces one or more actions. The RED half is staged by giving the rename pair an identity, never by hand-keying the report - completeIdentityEvidence's fill is guarded by !item.identityKey at identity-evidence.ts:41-44, so a pre-keyed report already fails on main and is no witness; and the action main produces for that input is not a wrong rename, since plan-admission.test.ts's fixture 3 records a match for the same-address form.
    requirement_refs: [FR-RIK-004]
  - id: AC-RIK-004
    criteria: No fixture exists in which a report family, folder relation or binding that the positional rules reject becomes admissible because an identity is present; a report with no carried identity produces exactly main's actions and no component fails for a missing key.
    requirement_refs: [FR-RIK-005, NFR-RIK-003]
  - id: AC-RIK-005
    criteria: Two SyncRecords cannot both claim one remoteIdentityKey, because that property is the store's key and the second write updates the one row rather than creating a second, and both remoteIdentityKey and path are mandatory. A rename - a terminal carrying the expected row's own identity at a new address - is a single put that issues no delete, leaves the primary key unchanged and leaves the identically keyed sync-content row in place. A replacement - a terminal whose identity differs from that of the record holding the claimed address - deletes that incumbent and inserts the terminal within one transaction, after comparing the incumbent, so that afterwards exactly one row holds the address, the incumbent's sync-content row is gone with it, and the delete is observable as its own operation rather than as a side effect of the put; a replacement whose captured expectation no longer matches deletes nothing and returns false, because the comparison precedes the delete. A replacement publication carries no continued row, so identity-component-decision.ts:509-511 and :549-551 no longer pass the incumbent as both source and destination. Two distinct records written at one path without the incumbent being deleted abort the transaction having written nothing, with the failure reaching the caller as a throw and never as the stale-baseline false, and with the assertion made on that shape rather than on a DOMException name, which is null on main for every abort; a baseline-free create still refuses a non-vacant address and a delete with no expected record verifies vacancy, deletes nothing and returns true; a twelve-child relocation that preserves every identity publishes normally; and a relocation set whose terminal addresses intersect another item's source addresses, or which is cyclic, publishes nothing and returns false.
    requirement_refs: [FR-RIK-006]
  - id: AC-RIK-006
    criteria: No stored SyncRecord has an absent or empty remoteIdentityKey; a remote entity supplying either is refused inside buildSyncRecord with one named error before any store write, so all three production callers in two files reach the same refusal and none folds the value to the empty string; both inputs take the same branch and nothing is written; commitAction's caller fails the action so the cycle does not complete, the opened-file priority attempt takes no baseline and defers to the batch, and the refused entity is still listed, compared and conflict-resolvable.
    requirement_refs: [FR-RIK-007]
  - id: AC-RIK-007
    criteria: A database seeded at the previous version opens at the new one with zero records and zero content entries, both stores are recreated with keyPath remoteIdentityKey and sync-records carries a unique index over path, no migration, transform or record-preserving upgrade code exists anywhere in src/, and the version comment records what the bump does not do.
    requirement_refs: [FR-RIK-008]
  - id: AC-RIK-008
    criteria: rewritePaths and compareAndMove are both absent from SyncStateStore, from the store test double, from the ownership guard's mutating-method set at :9-12, from the generated negative-fixture list at :320 and from docs/sync-pipeline.md; every remaining CAS method still has both of its generated negative fixtures; that document names the three compare-and-swap routes production takes; the guard's import, reference, constructor and mutation-caller inventories are byte-identical before and after; and lint:bot-repro is green.
    requirement_refs: [FR-RIK-009, NFR-RIK-004]
  - id: AC-RIK-009
    criteria: SyncRecord carries no backendMeta, FileEntity.backendMeta is unchanged, and whole-record CAS equality compares the same field set on both sides.
    requirement_refs: [FR-RIK-010]
  - id: AC-RIK-010
    criteria: No persisted evidence, rename intent, Admission disposition, retry instruction or recovery marker exists, no new retained in-memory correctness owner exists, the SyncStateStore import, reference, constructor and mutation-caller sets are unchanged, and sync-admission-authority-guard.test.mjs is green with no fixture edit.
    requirement_refs: [NFR-RIK-001, NFR-RIK-004]
  - id: AC-RIK-011
    criteria: LocalFs still reports identityKey undefined, local rename evidence carries no identityKey, no production branch reads a local entity's identityKey as evidence, and the four non-improvements are stated in the change's own documents.
    requirement_refs: [NFR-RIK-002]
  - id: AC-RIK-012
    criteria: The positional arm at identity-component-decision.ts:408-410 no longer exists, and what stops it returning is the absence of its population, not a type error - a test fails when a SyncRecord is constructed without a non-empty identity, and npm run build is not the assertion, because the arm's exact shape compiles clean under this repository's own tsc --strict with remoteIdentityKey typed string and eslint.config.mts configures no no-unnecessary-condition. Every stored baseline resolves its remote endpoint through currentByIdentity with no address fallback available; every production branch that tested a stored record's own identity absence is removed, reduced or tightened with none repaired positionally and none folding to the empty string; and nothing in the change claims that fallback is still live or asserts its retirement through the build.
    requirement_refs: [FR-RIK-012]
  - id: AC-RIK-013
    criteria: A file renamed remotely with unchanged bytes keeps its three-way merge base and the next conflict on it resolves by merge rather than newer-mtime-wins, including on the path that compareAndMove used to take before it collapsed into compareAndPut; a rename that changes the content hash drops the base; a 500-child folder relocation preserves or invalidates every child's base under one transaction image.
    requirement_refs: [FR-RIK-013]
  - id: AC-RIK-014
    criteria: Five fixture shapes are recorded against unchanged production code with the branch taken named at each of the four observation sites; the record says that identity-component-decision.ts:106-107 cannot fail on any fact shape today's Observation layer emits, and a sixth case pins that boundary by recording conflicting_identity for the two map-keying divergences where it does fail; a second measurement over the real SyncStateStore records that the same-cycle baseline is preserved by identity-keyed binding while the split-cycle baseline is not retained, the old row being discarded and the object re-downloaded as new, which owner decision 8a settles is the model working and which the case asserts deliberately rather than as a defect; both measurement files exist in the change rather than being described, every later claim cites their recorded results rather than the plan's earlier analysis, and no positional mechanism is retired by the measurement itself.
    requirement_refs: [FR-RIK-014]
  - id: AC-RIK-015
    criteria: npm run lint, npm run lint:bot-repro, npm run build and npm run test:coverage are all green at every unit boundary, not only at the end — in particular no boundary leaves a keyPath over an optional property, so no non-null assertion and no empty-string fold is ever required — with Dropbox's path-keyed upsertedPaths reclaim guard and every ADR 0006 ordering case unchanged.
    requirement_refs: [NFR-RIK-003, FR-RIK-011]

dispositions:
  - decision_input_ref: decision-input-owner-purpose-is-misoperation
    disposition: >-
      Binding and used as the sole judging criterion, and the criterion is now applied against measurement rather than
      against analysis. The plan previously claimed every mechanism was justified by a named wrong operation it
      prevents. Two measurements landed and that claim does not survive intact. src/sync/plan-admission.test.ts shows
      the guard at identity-component-decision.ts:106-107 cannot fail on any fact shape today's Observation layer
      emits and that the replaced-destination shape is admitted as a match rather than a wrong rename, because
      indexFacts and bindFiles:420-421 discriminate it first, so the seam half is carried as replacing a tautology
      with a real cross-source check and removing failures the enrichment manufactures - not as stopping a reachable
      wrong operation. src/sync/record-rekey-across-commit.test.ts shows no wrong-object operation occurring, and
      owner decision 8a settles that its split-cycle end state is the model working rather than a loss, so the
      record half's payoff is claimed as structural and only as structural - M2 and M3 stop being representable and
      the silent discard of an incumbent becomes an admitted, compared and asserted operation - and never as
      baseline continuity across cycles. M3's delete_local-of-a-live-file consequence is marked analytical. Collision representation remains out of scope and no mechanism that only matters for it was
      proposed. The one graft that failed this test — a store-level identity-preservation check on folder
      relocations — was rejected rather than kept for symmetry.
    adr_refs: [adr-remote-correspondence-identity-carrier, adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-cross-source-rename-validation, contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-conductor-note-boundary-carried-identity
    disposition: Adopted as the change's first half and measured. Boundary-carried identity is not sufficient on its own and not subsumed by the store change; it is the only thing that closes the in-flight mis-binding, because the rename report never reaches any store. Verdict recorded as complementary with a named division of labour across M1, M2 and M3.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-seam-carried-identity, contract-cross-source-rename-validation]
  - decision_input_ref: decision-input-renamepair-has-no-identity-field
    disposition: The historical question is closed by decision rather than by evidence. No commit, ADR or design clause states the omission as intentional; the ADR now records that the FS contract carries identity, so the provenance no longer gates anything and unknown-renamepair-identity-omission-intent is dissolved.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-seam-carried-identity]
  - decision_input_ref: decision-input-enrichment-is-self-satisfying
    disposition: >-
      Established by reading, made the design's pivot, and now closed by measurement rather than carried as an
      assumption. completeIdentityEvidence fills a remote rename's identity from the same two sources indexFacts
      builds current.remote from, so the guard compares a value to its own source; src/sync/plan-admission.test.ts
      drives five fixtures through the production entry and records exactly that at every one. Removing the
      enrichment for rename evidence is what makes the check real, and the claim that it loses nothing is now a
      recorded result: the only outcomes the fill changes are the two map-keying divergences the same file
      constructs, where what it produces is a conflicting_identity the world does not support. What the closure also
      costs the plan is recorded rather than hidden - the guard cannot admit a wrong operation today, so no clause
      rests on that any more.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-evidence-identity-preservation, contract-cross-source-rename-validation]
  - decision_input_ref: decision-input-indexfacts-insert-is-a-different-selection
    disposition: >-
      Adopted as the limit on the previous input, and the limit is now measured at the capture boundary.
      identity-component-decision.ts:328-329 selects the prior entity when it has a hash and the incoming one does
      not, and the incoming entity otherwise — a different selection, not a stricter check — and it keys by
      entity.path where completeIdentityEvidence keys an entry's identity by entry.path at identity-evidence.ts:39.
      src/sync/plan-admission.test.ts constructs both divergences directly and records the guard failing with
      conflicting_identity and no actions for each, so the limit is real rather than hypothetical. Whether the
      Observation layer can emit either shape is still not established and is claimed neither way; what follows
      regardless is that the only failures the guard produces are manufactured by the enrichment, which is why the
      removal is lossless and why the divergence case must stay in the file to keep the cannot-fail claim bounded to
      the population it is true of.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-positional-mechanism-evidence, contract-evidence-identity-preservation]
  - decision_input_ref: decision-input-dropbox-extractid-total-fallback
    disposition: Decisive, and it fixed the contract's wording. Lifting the cache's id would carry Dropbox's path_lower pseudo-identity into a rename pair on the shared full-scan route, where it can never equal any FileEntity.identityKey and would fail every such rename closed, stalling the component forever. contract-seam-carried-identity is written against the entity projection, names extractId, idAt, getPathById and snapshotPathsById as forbidden sources, and carries the adversarial witness that asserts the two values differ for an id-less Dropbox entry — which is the structural half a separate projection-source contract used to hold. That contract was removed as uncompelled by the minimality audit, since the helper is concrete over the already-public abstract toEntity and forces no new member on any subclass; its outcome survives in the seam contract and in contract-cross-family-identity-conformance, and its discretion moved to the seam contract. extractId remains legitimate as the cache-internal total address function it is.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-seam-carried-identity, contract-cross-family-identity-conformance]
  - decision_input_ref: decision-input-renameevidencekey-omits-identity
    disposition: Adopted as a latent defect to close in the same change. renameEvidenceKey at identity-evidence.ts:22-24 omits identityKey while selectReportFamily's own unique map already includes report.identityKey ?? "", so the upstream dedupe is what makes the downstream arbitration dead. Without the repair, once producers carry keys, Map.set last-wins silently drops one of two conflicting claims on one edge and a wrong rename is admitted.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-evidence-identity-preservation]
  - decision_input_ref: decision-input-selectreportfamily-identity-checks-unreachable
    disposition: Established by reading and used as the safety argument, with the correction that reachability also requires the dedupe repair. edgesByIdentity and identitiesByEdge cannot fire today because one enrichment pass yields at most one key per newPath and two edges sharing a newPath are already conflicting via sourcesByTarget. Producer-carried identity plus an identity-bearing dedupe key makes them reachable, and they only ever tighten, so no widening risk is introduced.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-cross-source-rename-validation, contract-evidence-identity-preservation]
  - decision_input_ref: decision-input-adr-0008-missing-keys-no-evidence
    disposition: Binding, and it is why the report.identityKey guard keeps its shape. ADR 0008 Decision section 2 has three states and missing keys provide no evidence is the third; requiring an identity on every remote rename would encode absence of evidence as evidence of conflict against an accepted ADR and would stall Dropbox's unsettled id-less case. What changes is the source of the key, not whether it is required. This rule is about cycle-local rename evidence only and does not discharge the record layer's discipline.
    adr_refs: [adr-remote-correspondence-identity-carrier, adr-record-identity-floor-tolerated]
    contract_refs: [contract-cross-source-rename-validation]
  - decision_input_ref: decision-input-adr-0006-order-independence
    disposition: Binding and treated as a preserved contract. The seam change touches only what is reported, never apply ordering, descendant enumeration or the reclaim guard, and the existing both-orderings cases in the shared caching contract are the regression stop.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-cross-family-identity-conformance, contract-seam-carried-identity]
  - decision_input_ref: decision-input-dropbox-tombstone-positional-guard
    disposition: Binding and untouched. The upsertedPaths reclaim guard keys on path because a Dropbox tombstone carries no id; an identity-keyed guard is unconstructible, not merely worse. Nothing in this design changes it, and Dropbox's eighteen path-derived topology sites stay path-derived because extractParentIds returns an empty array unconditionally.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-seam-carried-identity]
  - decision_input_ref: decision-input-local-side-no-identity
    disposition: Binding and made an explicit contract rather than an omission. The local endpoint of every correspondence stays positional permanently; neither half of this change reaches it, no local identity is invented or inferred, and the change states what it does not improve — the missed local rename event and the cross-scope local rename — where a reader will find it.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-local-positional-boundary]
  - decision_input_ref: decision-input-aliasfolder-is-report-free
    disposition: Settled by reading, closing one of the recovery's four open sub-questions. aliasFolder reads only local alias observations and current occupancy; no remote identity can produce or replace a local casing alias, so it is not an identification mechanism and is unchanged. The eighth part of the residual-obligation unknown is the only one reading could not close, and it is measured instead.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-positional-mechanism-evidence]
  - decision_input_ref: decision-input-required-contract-matrix
    disposition: Adopted as the placement rule. The seam guarantee is asserted in the shared caching contract inside the central composition root so it binds all three families at once and a missing cell stays a compile error; no case is registered elsewhere and no registry fixture is extended except for backend-specific construction data.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-cross-family-identity-conformance]
  - decision_input_ref: decision-input-shared-rename-cells-and-harnesses
    disposition: Adopted as a grounding correction. The rename cells are caching-remote-fs.contract.ts:297-360 with object literals at :314, :333 and :351-356 that break the instant RenamePair gains a field; remote-change-detection.contract.ts contains no rename content at all and stableIdentity is an option of ifilesystem.contract.ts:42,157. The three caching-remote-fs.contract-harness.ts registrations are named in unit-7's file list so the widening is costed at design time rather than discovered at build time, and the literals are updated rather than loosened.
    adr_refs: [adr-remote-correspondence-identity-carrier]
    contract_refs: [contract-cross-family-identity-conformance]
  - decision_input_ref: decision-input-agents-two-publication-points
    disposition: Binding and unchanged. Carried identity lives only in the cycle's evidence and is discarded with it; the store's DataError and ConstraintError refusals are raised and not persisted; no third durable authority, no new persistent-store owner and no retained in-memory correctness owner is added, and the measurement unit records nothing durable either.
    adr_refs: [adr-remote-correspondence-identity-carrier, adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-seam-carried-identity, contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-record-store-enforces-only-path-uniqueness
    disposition: >-
      Adopted as the store half's justification, answered by the key rather than by an observation, and narrowed
      after measurement. Nothing observes identity uniqueness across records today, so two baselines may claim one
      provider object; bindFiles binds the first and occurrenceClaimed silently drops the second. The further step
      the plan asserted - that the dropped address then falls through to a confirmed-deletion binding that deletes
      a live local file - is analytical and is withdrawn as an established claim, because
      identity-component-decision.ts:568-569 refuses delete_local without a provider-reported deletion at that
      address and no measurement produces the destructive outcome; the one wrong-operation candidate driven end to
      end, a local deletion under a substituted path in record-rekey-across-commit.test.ts, yields conflict rather
      than delete_remote. Neither the seam nor the version bump closes the two-baseline state. Making
      remoteIdentityKey the store's key makes it unrepresentable rather than merely observed, which is claimed as a
      structural result, so no refusal, no named duplicate-identity error and no holder pre-read is built.
    adr_refs: [adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-same-transaction-pre-read-is-atomic
    disposition: Correct, and no longer needed. The measurement stands — a read issued from the failing put's onerror cannot complete because the transaction is already aborting, while an index read issued before the put inside the same readwrite transaction completes and returns the holder, since IndexedDB serialises readwrite transactions over a store — and it corrected draft-2's rejection of application-level checking. But it existed to let a duplicate-identity refusal name the record already holding the identity, and under keyPath remoteIdentityKey there is no such refusal and no such holder. The pre-read is retired unbuilt, contract-record-identity-uniqueness forbids re-adding it, and the store declines to represent the state rather than arbitrating it.
    adr_refs: [adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-relocation-order-is-load-bearing
    disposition: Adopted, then superseded by the key shape and replaced with an obligation of the same kind. Under a unique identity index, delete-before-put was what made a folder rename publishable at all. Under keyPath remoteIdentityKey the delete disappears, because each relocation is an in-place update of one row, and what is load-bearing instead is which sets may be admitted. contract-record-identity-uniqueness states the admission rule, and a verification pins it, so a future caller that needs an overlapping or cyclic set fails a named test instead of aborting in production.
    adr_refs: [adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-record-identity-uniqueness]
  - decision_input_ref: decision-input-merge-base-discarded-by-method-body
    disposition: Adopted as a defect to repair, and still detached from the key choice. compareAndMove at state.ts:132-133 and compareAndRewritePaths at :186-187 delete sync-content at both addresses unconditionally on CAS success where compareAndPut at :104-108 applies a predicate, so every rename destroys the three-way merge base and conflict-resolver.ts:135 falls through to newer-mtime-wins. One correction to the attribution — commitAction's folder branch returning before maybeStoreMergeBase is correct, because a folder has no content, so the repair lands in the CAS bodies only. What the key shape supplies for free is the carry, because sync-content is keyed by identity and a relocation does not move the row; what it threatens is the predicate, which must survive compareAndMove's collapse into compareAndPut rather than being carried across as that method's unconditional deletes. The predicate repair is owed under any shape and is not counted as a payoff of this one.
    adr_refs: [adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-merge-base-survives-relocation]
  - decision_input_ref: decision-input-relocation-terminal-is-a-source-spread
    disposition: Rejected the graft it was offered to support, with the witness, and then load-bearing for the key shape. state-committer.ts:104-105 builds each terminal as a spread of its source with only path changed, so a terminal's remote identity is its source's identity by construction at the only production caller. Under keyPath remoteIdentityKey that spread is why a relocation is an in-place field update of one row rather than a key change, which is what collapses compareAndMove into compareAndPut and what makes the source delete disappear. Identity injectivity across terminals reduces to identity injectivity across sources, which the key makes unrepresentable, so a store-level identity-preservation check would be structure with no reachable failure behind it and is not added.
    adr_refs: [adr-record-identity-uniqueness-mechanism]
    contract_refs: [contract-record-identity-uniqueness, contract-merge-base-survives-relocation]
  - decision_input_ref: decision-input-rewritepaths-uncalled-no-cas
    disposition: Position taken — remove it. Zero callers in src/, no compare-and-swap, and a put that silently overwrites whatever occupies the destination address, which is a sanctioned route to the exact mis-operation this change exists to remove; its documented role at docs/sync-pipeline.md:304 was taken over by compareAndRewritePaths. Under the chosen key it is additionally incoherent, since it rewrites a field that is no longer the key while leaving the row it should have moved untouched, and its content-carry at :216-222 is not a mechanism the merge-base repair reuses but one the identity key makes unnecessary. Measured alongside it — SyncStateStore.put and putContent also have zero production callers — is recorded and deliberately not acted on; they are re-expressed with the rest of the surface, and correcting the same doc section removes the only named route to them, so removing them would be structure-reduction without a named failure.
