  - id: contract-evidence-identity-preservation
    dimension: data_model
    owner: component-rename-evidence
    requirement_refs: [FR-RIK-003, FR-RIK-004, NFR-RIK-001]
    unit_refs: [unit-2-evidence-preservation]
    adr_refs: [adr-remote-correspondence-identity-carrier]
    verification:
      - id: verify-carried-identity-reaches-evidence
        tier: T0
        command: npm test -- src/sync/identity-evidence.test.ts
      - id: verify-different-identity-same-edge-not-collapsed
        tier: T0
        command: npm test -- src/sync/identity-evidence.test.ts
      - id: verify-rename-newpath-enrichment-removed
        tier: T0
        command: npm test -- src/sync/identity-evidence.test.ts
      - id: verify-stable-identity-and-alias-passes-intact
        tier: T1
        command: npm test -- src/sync/change-detector.test.ts
    partition:
      outcomes: [determinate, unknown, conflicting]
      default_policy: A remote rename claim is determinate when the producer carried an identity; unknown when it did not, in which case no identity is attached from any address; conflicting when two claims share side, oldPath, newPath and isFolder but carry different identities, which the dedupe key now preserves for the report-family stage to reject. Local rename claims are always unknown by construction and this is not a failure. A carried, an absent and an empty key never alias in the dedupe key, which is an encoding rule and not the record layer's admissibility rule. The removal of the destination-address enrichment is admitted only after contract-positional-mechanism-evidence has recorded each of its five shapes on unchanged production code.
    discretion:
      - id: discretion-dedupe-key-encoding
        unit_ref: unit-2-evidence-preservation
        question: How identityKey is encoded into the rename-evidence dedupe key given that undefined and the empty string must not alias.
        scope:
          files:
            - src/sync/identity-evidence.ts
          component: component-rename-evidence
          visibility: private
        escalate_when:
          - The encoding lets a carried key and an absent key collapse to one entry.
          - The encoding changes the observable order of the returned evidence array.
          - The encoding requires a change to RenameEvidence's public shape.
        constraints:
          - The key stays a private string derivation inside this module and is never persisted or exported.
          - A carried key, an absent key and an empty key are three values the key must keep distinct. This is an encoding question and deliberately not the record layer's admissibility question, where absent and empty are one inadmissible case.
        preserves:
          invariant_refs: [FR-RIK-003]
        verification_refs: [verify-different-identity-same-edge-not-collapsed]
        difficulty_inputs:
          decision_reasoning: mechanical
          boundary_reach: private
          context_scope: files
          reversibility: trivial
          verification_strength: discriminating
