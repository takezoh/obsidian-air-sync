    partition:
      outcomes: [determinate, unknown, conflicting]
      default_policy: For a remote rename report, determinate means the carried identity equals the identity of the current remote fact at newPath and the relation may be bound; unknown means the report carries no identity, in which case ADR 0008 forbids treating absence as evidence and the report is handled exactly as on main; conflicting means the carried identity differs from the current remote fact at newPath, which fails the component with an existing failure reason, blocks cycle completeness, leaves the checkpoint uncommitted and replays the same delta. No outcome authorizes a rename that the positional rules already reject, and no outcome fails a component because a key is missing.
    discretion:
