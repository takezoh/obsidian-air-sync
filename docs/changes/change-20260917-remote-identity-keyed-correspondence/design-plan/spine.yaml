      - SyncRecord.remoteIdentityKey is declared required, and buildSyncRecord itself refuses a remote entity whose identityKey is absent or empty with one named error before any store write; both inputs take the same branch and nothing is written. The refusal is in the construction function, so all three production callers reach it — state-committer.ts:119, opened-file-priority.ts:61 and :88 — and no site folds an absent identity to the empty string to satisfy the required type.
      - >-
          The refusal's two consumer contexts keep their own established routes: commitAction fails the action so the cycle does not complete, and the opened-file priority attempt takes no baseline, invalidates its target and defers to the batch rather than failing a cycle it is not part of.
      - The positional arm at identity-component-decision.ts:408-410 is removed, and a test that fails when an identity-less record is constructed is what asserts the retirement; npm run build is explicitly not the assertion, because a required string is not always-truthy to TypeScript and the arm still compiles.
      - Every production branch that tested a stored record's own identity absence is disposed of and none is repaired positionally — the whole branch at opened-file-priority.ts:41 is removed, the vacuous terms at plan-admission.ts:125, plan-executor.ts:556 and :788, priority-batch-state.ts:63, change-hash-enrichment.ts:33, conflict-action-contract.ts:42, plan-admission-case-alias.ts:152, sync-cycle-finalization.ts:44, identity-evidence.ts:57 and identity-component-decision.ts:420 and :459 are dropped with their comparisons unchanged, and the runtime shape validator at conflict-action-contract.ts:150 is tightened to require a non-empty string. Sites that test an absent record rather than an absent field are untouched.
      - A test asserts that the refused entity is still listed, still compared and still conflict-resolvable — the refusal is at the baseline, not at the backend boundary or the listing.
      - The measurement fixture that can no longer exist is deleted with its reason cited, not repaired - unit-0's shape 2, a baseline carrying no identity, becomes unconstructible the moment the field is required and the floor lands, and its disappearance is the observable form of fr-rik-012's retirement. Every other SyncRecord literal in that file gains a non-empty identity rather than an empty-string fold.
      - Whole-record JSON equality in every CAS method compares the same field set on both sides, and the existing publication cases stay green.
      - Every other field is kept with its reason recorded, including syncedAt, which is kept as underivable although no production reader was found.
      - npm run lint, npm run build and npm run test:coverage are green at this unit's boundary with the store's keyPath still "path". tsconfig.json type-checks tests/**/*.ts as well as src/**/*.ts, so every SyncRecord literal in the 24 measured test and mock files carries a non-empty identity; the file list above is the measured set and the unit's boundary is that set plus any further file the compiler names.
    objective: Apply the persist-only-what-cannot-be-derived discipline field by field, and make the record layer's identity floor real before anything depends on it — the declared shape by the type, the value by a refusal inside the single construction function — with the consequence for an id-less entity named and tested and the whole type-checked construction surface closed. This unit runs before the re-key so that no intermediate state ever has a keyPath over an optional property, which would force a non-null assertion or an empty-string fold.
    output_format: One field removed from the record type and its single writer, one field promoted to required, one refusal inside buildSyncRecord, the now-dead positional arm and every vacuous absence guard removed, one shape validator tightened, plus the test-helper and test-literal updates that follow.
    tool_guidance: Let the compiler enumerate the construction sites rather than grepping; it is the reliable enumerator here precisely because tsconfig covers tests/. Keep the entity-side backendMeta in every assertion that already exercises it so the two fields are visibly separate. Write the floor test as an assertion of the declared outcome — the construction throws and nothing is written — not as an assertion that the input cannot occur, and do not reach for npm run build to assert the positional arm's retirement. When dropping a vacuous term, change nothing else on the line.
    task_boundaries: Do not touch the store's keyPath, its index or DB_VERSION — those are unit-4's and depend on this unit. Do not remove any other field, do not touch FileEntity, do not synthesize an identity from a path, do not fold an absent identity to the empty string anywhere, and do not refuse an id-less entity at the backend boundary or remove it from a listing. Do not make the opened-file priority attempt fail a cycle. src/sync/identity-component-decision.ts is touched by three units on two independent chains - unit-3 on the seam chain, this unit and unit-4 on the store chain - so the two halves must not be integrated concurrently in that file; each chain lands whole before the other starts, which is also what lets the halves ship independently.
    decision_closure_reason: The audit outcome is stated field by field with a reversal condition for the single removal; the floor, its site, its two consumer dispositions and the disposition of every absence guard are decided by owner decisions 5 and 6a and enumerated from the repository; only whether the refusal is a guard clause or a named predicate inside buildSyncRecord remains discretionary.

