  - id: contract-cross-source-rename-validation
    dimension: control_flow
    owner: component-admission-identity-gate
    requirement_refs: [FR-RIK-004, FR-RIK-005, NFR-RIK-003]
    unit_refs: [unit-3-cross-source-validation]
    adr_refs: [adr-remote-correspondence-identity-carrier]
