scope_expansion_signals:
  - id: scope-signal-fs-contract-widening
    kind: shared_boundary
    target_ref: contract-seam-carried-identity
    witness: RenamePair is declared part of the IFileSystem contract (src/fs/types.ts:69-73) and appears in IncrementalCheckpoint.getChangedPaths, so adding a field binds all three backend families, every registered harness and every test double at once.
    requirement_refs: [FR-RIK-001, FR-RIK-002, FR-RIK-011]
    authority_refs:
      - src/fs/types.ts:69-79
      - src/fs/interface.ts:128-140
      - AGENTS.md:44-50
  - id: scope-signal-identity-uniqueness-persisted-constraint
    kind: persistent_state
    target_ref: contract-record-identity-uniqueness
    witness: The durable authority's primary key changes. sync-records moves from keyPath "path" to keyPath "remoteIdentityKey" and sync-content moves with it, which re-expresses 17 production call sites and six mutating methods, collapses compareAndMove into compareAndPut, makes SyncRecord.remoteIdentityKey required, and makes an identity-less record unstorable. createIndex has zero occurrences in src/ and tests/ (measured), so the accompanying unique index over path is also the repository's first IndexedDB index. It arrives with a DB_VERSION bump whose onUpgrade drops both stores, which is the only place either declaration is legal.
    requirement_refs: [FR-RIK-006, FR-RIK-007, FR-RIK-008, FR-RIK-012]
    authority_refs:
      - src/sync/state.ts:17
      - src/sync/state.ts:27-40
      - /home/take/.dev-skills/design/remote-identity-keyed-correspondence/artifacts/owner-decision.md
      - /home/take/.dev-skills/design/remote-identity-keyed-correspondence/authority-deltas/000001-c7074fbeca79fc0c.message
  - id: scope-signal-store-index-not-rekey
    kind: post_consultation_decision
    target_ref: adr-record-key-shape
    witness: The smaller structural alternative was measured, presented and overruled, and this signal records that rather than the alternative. A unique index over remoteIdentityKey with keyPath "path" delivers the same two invariants while leaving 17 production call sites and six CAS methods untouched, so the plan reserved the choice for the owner and wrote its body against the index. The owner's binding authority delta rejected the frame the comparison was posed in — the store was never the thing that had to refuse a second record at one path, because path uniqueness is an invariant fs owes the sync engine upstream of the store — and settled adr-record-key-shape on keyPath "remoteIdentityKey" with a unique index over path. The larger structure is therefore adopted on authority, not on the cost comparison, and the comparison survives only as this change's work inventory.
    requirement_refs: [FR-RIK-006, FR-RIK-007, FR-RIK-012]
    authority_refs:
      - /home/take/.dev-skills/design/remote-identity-keyed-correspondence/authority-deltas/000001-c7074fbeca79fc0c.message
      - /home/take/.dev-skills/design/remote-identity-keyed-correspondence/artifacts/owner-decision.md
      - /home/take/.dev-skills/design/remote-identity-keyed-correspondence/artifacts/conductor-resolution.md
      - src/fs/dropbox/types.ts:23
  - id: scope-signal-conformance-cell-rewrites-existing-assertions
    kind: shared_boundary
    target_ref: contract-cross-family-identity-conformance
    witness: The seam change forces edits to three already-passing shared cases — caching-remote-fs.contract.ts:314, :333 and :351-356 assert the pair by object literal — plus per-family staging in the three caching-remote-fs.contract-harness.ts files; rewriting a passing shared conformance assertion across all three families is this change's widest blast radius and the literals must be updated rather than loosened.
    requirement_refs: [FR-RIK-011, FR-RIK-001]
    authority_refs:
      - tests/fs/contracts/caching-remote-fs.contract.ts:297-360
      - tests/fs/remote-backend-contracts.test.ts
      - AGENTS.md:52-58
  - id: scope-signal-critic-induced-merge-base-contract
    kind: critic_induced_contract
    target_ref: contract-merge-base-survives-relocation
    witness: A normative contract added in response to the critique's second graft item. Its concrete failure without it is user-visible and current — compareAndMove (state.ts:132-133) and compareAndRewritePaths (:186-187) discard sync-content at both addresses unconditionally where compareAndPut (:104-108) applies a predicate, so every rename destroys the three-way merge base and the next conflict on a renamed file resolves by newer-mtime-wins at conflict-resolver.ts:135.
    requirement_refs: [FR-RIK-013]
    authority_refs:
      - src/sync/state.ts:104-108
      - src/sync/state.ts:132-133
      - src/sync/state.ts:186-187
      - src/sync/conflict-resolver.ts:135
  - id: scope-signal-critic-induced-record-floor-contract
    kind: critic_induced_contract
    target_ref: contract-record-identity-floor-disposition
    witness: A normative contract added in response to issue-d2-m2-not-closed-by-the-bump and inverted by the owner's authority delta. Its concrete failure without it is that the plan leaves the record layer's identity floor implicit in a storage mechanism — buildSyncRecord (state-committer.ts:42) copies remote?.identityKey with no floor of its own, so under keyPath "remoteIdentityKey" an entity whose provider supplied no id produces a DataError deep inside a transaction instead of a named publication failure, and an empty-string identity — a perfectly valid IndexedDB key — silently folds two entities into one row.
    requirement_refs: [FR-RIK-012, FR-RIK-007]
    authority_refs:
      - src/sync/state-committer.ts:42
      - src/sync/identity-component-decision.ts:405-410
      - src/fs/dropbox/types.ts:23
  - id: scope-signal-post-resolution-record-floor-adr
    kind: post_consultation_decision
    target_ref: adr-record-identity-floor-tolerated
    witness: A fourth ADR that appears in neither draft-1 nor draft-2. It exists because the conductor resolution settled with the owner after the critique split one question into two layers — what a cycle-local rename report must name is governed by ADR 0008 and stays optional, while what a durable SyncRecord must carry is a separate matter the record layer owes. The minimality audit classified it optional under keyPath "path", where it recorded a choice that fr-rik-012 and contract-record-identity-floor-disposition already discharged. Under the owner's authority delta it inverts and becomes load-bearing — the floor is no longer a choice but the storage mechanism, and the ADR is the only place that records what an id-less entity gets, why synthesizing a key stays forbidden precisely because it would dissolve the floor, and why the record layer's floor does not propagate up to rename reports. Folding it back into the seam ADR is how draft-1 arrived at a requirement contradicting ADR 0008.
    requirement_refs: [FR-RIK-012, FR-RIK-007]
    authority_refs:
      - /home/take/.dev-skills/design/remote-identity-keyed-correspondence/authority-deltas/000001-c7074fbeca79fc0c.message
      - /home/take/.dev-skills/design/remote-identity-keyed-correspondence/artifacts/conductor-resolution.md
      - /home/take/.dev-skills/design/remote-identity-keyed-correspondence/artifacts/owner-decision.md
      - src/sync/state-committer.ts:42
      - src/sync/identity-component-decision.ts:405-410
  - id: scope-signal-required-field-binds-the-whole-test-surface
    kind: shared_boundary
    target_ref: contract-record-identity-floor-disposition
    witness: Adopted from the independent plan attack and re-measured. Promoting SyncRecord.remoteIdentityKey to a required non-empty string binds every SyncRecord construction in the repository, not only production, because tsconfig.json includes tests/**/*.ts alongside src/**/*.ts. Measured on main at 60e85b0 - 27 files contain a SyncRecord literal (grep "syncedAt:"), of which three are production (src/sync/types.ts, src/sync/state.ts, src/sync/state-committer.ts), leaving 24 test and mock files; tests/fs/contracts/remote-change-detection.contract.ts calls buildSyncRecord at :64, :74 and :90; and the shared store double at src/__mocks__/sync-test-helpers.ts carries both the removed methods and the record shape. The previous revision listed thirteen files across unit-4 and unit-5 and none of the broken ones, so the store half priced no test surface at all while scope-signal-conformance-cell-rewrites-existing-assertions priced exactly this for the seam half. unit-5 now enumerates the record-literal surface and unit-4 the compareAndMove surface.
    requirement_refs: [FR-RIK-007, FR-RIK-012, FR-RIK-009]
    authority_refs:
      - tsconfig.json
      - src/sync/state.test.ts:7-17
      - src/sync/fact-first-execution.test.ts:402-417
      - src/sync/plan-executor.test.ts:1101
      - tests/fs/contracts/remote-change-detection.contract.ts:64
  - id: scope-signal-critic-induced-admission-measurement
    kind: critic_induced_contract
    target_ref: contract-positional-mechanism-evidence
    witness: A normative contract added in response to issue-d2-enrichment-removal-overstated and the critique's fourth graft item. Its concrete failure without it is removing the rename enrichment on a reading that does not close — indexFacts' insert at identity-component-decision.ts:328 is a different selection, not a stricter check, so an identity-less prior can outlive an identity-bearing one at one path and yield undefined !== "X" at the guard.
    requirement_refs: [FR-RIK-014, FR-RIK-004]
    authority_refs:
      - src/sync/identity-component-decision.ts:328
      - src/sync/identity-evidence.ts:41-44
      - /home/take/.dev-skills/design/remote-identity-keyed-correspondence/artifacts/recovery.json
  - id: scope-signal-replacement-is-an-operation-not-a-rule
    kind: post_consultation_decision
    target_ref: contract-record-identity-uniqueness
    witness: Owner decision 8 settles the record model and collapses the structure two previous revisions grew around the displaced incumbent. A SyncRecord is the record of a local file that is synced; path is mandatory; when either side deletes the file the deletion synchronises and the record is deleted with it; and a reappearing object is a new file, with no baseline retained to recognise it. The error this corrects is that the plan treated SyncRecord as a record of the remote object when it is a record of the correspondence - and a correspondence whose address now belongs to another object has ended, an end the cycle directly observes because the new object is at the address now. No evidence of the object's death is required, ADR 0008 is not engaged, and the impasse the previous revision worked around does not exist. What this deletes rather than adds - the four-way classification, the checkpoint_deleted conjunct, currentByIdentity as a retirement input, the fail-closed disposition and its convergence narrative, relocating-first emission, the claimer-expects-vacant expectation change, the address-permutation refusal, and the baseline-continuity motivation - leaves two operations in their place, both of them store operations already implied by the key. A rename is a single put whose primary key does not move, simpler than today's compareAndMove; a replacement is a delete plus insert in one transaction. The unique path index earns its keep exactly here - under keyPath path, store.put overwrites the incumbent silently at state.ts:101-103, while under keyPath remoteIdentityKey plus a unique path index the write must delete the old row explicitly or the constraint aborts - so the discard becomes an admitted action instead of a side effect. FR-RIK-015, DP-7, contract-displaced-record-retirement and AC-RIK-016 are removed rather than re-contented.
    requirement_refs: [FR-RIK-006, FR-RIK-013]
    authority_refs:
      - /home/take/.dev-skills/design/remote-identity-keyed-correspondence/artifacts/owner-decision.md
      - src/sync/state.ts:101-103
      - src/sync/identity-component-decision.ts:509-511
      - src/sync/identity-component-decision.ts:719
      - src/sync/record-rekey-across-commit.test.ts

requirements:
  - id: FR-RIK-001
    type: functional
    priority: must
    statement: Every RenamePair a remote filesystem produces shall carry, in an identityKey field, the provider identity of the object at newPath as that filesystem's own FileEntity projection yields it; the field shall be absent only when that projection yields none.
  - id: FR-RIK-002
    type: invariant
    priority: must
    statement: The carried identity shall never be the metadata cache's internal total id (extractId); in particular Dropbox's entry.path_lower fallback shall never appear as a RenamePair.identityKey, and a carried identity shall always equal the identityKey a later stat or list observation of the same object in the same cycle would report.
  - id: FR-RIK-003
    type: invariant
    priority: must
    statement: A carried identity shall survive unchanged from producer to Admission; no downstream stage shall overwrite it, two rename claims that agree on side, oldPath, newPath and isFolder but disagree on identityKey shall not be collapsed into one claim, and a carried key, an absent key and an empty key shall be three distinct values to the rename-evidence dedupe key with none aliasing another.
  - id: FR-RIK-004
    type: functional
    priority: must
    statement: Admission's validation of a reported remote rename shall compare the report's carried identity against current remote facts derived independently of that report; the path-keyed re-attachment of a remote rename's identity from the destination address shall be removed, a report carrying no identity shall be handled exactly as it is on main, and no rule shall fail a component because a report carries no key.
  - id: FR-RIK-005
    type: invariant
    priority: must
    statement: Carried identity shall only narrow report-family selection and component admission; no report family, folder relation or binding that the current positional rules reject shall become admissible because an identity is now present.
  - id: FR-RIK-006
    type: invariant
    priority: must
    statement: The durable record store shall hold at most one SyncRecord per remoteIdentityKey by construction, because that property is the store's key, and at most one SyncRecord per path, enforced by a unique index over that field, with both fields mandatory. Every publication shall be exactly one of two operations. A rename - the same identity at a new address - shall change only the path field of one row and shall be a single put, moving no primary key, deleting no row and leaving the identically keyed sync-content row in place. A replacement - a terminal whose identity differs from that of the record holding the claimed address - shall delete that incumbent and insert the terminal within one transaction, after comparing the incumbent against the expectation Admission captured, so that the discard is an admitted, compared and asserted operation rather than a silent side effect of the key as it is under keyPath path at state.ts:101-103; nothing shall be inferred about whether the incumbent's object still exists, because the record asserts a correspondence and that correspondence's end is directly observed. A write that would place a second record at an address a different record already holds without deleting that record shall abort its transaction having written nothing and shall reach its caller as a thrown transaction failure, never as the ordinary stale-baseline false return, and shall never be resolved by catching the abort, by re-parsing or recovering its name, or by replacing the incumbent after the fact; no requirement, witness or verification shall depend on that failure naming itself, because idb-helper.ts:142 rejects on tx.onerror where tx.error is still null so every aborted transaction on main arrives unnamed, and that helper defect shall be neither repaired nor worked around by this change; each CAS method shall take two explicit expectations - the row keyed by the record's identity, and the current occupant of the record's address read through the path index - with no defaulted parameter, so a baseline-free create keeps today's vacancy check and a replacement's continued row is undefined; the comparison shall precede the delete, so a stale expectation returns false having removed nothing; and a relocation set in which every terminal record carries its own source record's identity shall never be refused by either rule, whatever its size.
  - id: FR-RIK-007
    type: invariant
    priority: must
    statement: SyncRecord.remoteIdentityKey shall be a required, non-empty string, and no SyncRecord with an absent or empty identity shall exist; absent and empty shall be one inadmissible case, refused inside buildSyncRecord itself - not in any one of its three production callers in two files, src/sync/state-committer.ts:119, src/sync/opened-file-priority.ts:61 and :88 - with a named error before any store write, rather than surfacing as a storage-level DataError or as a silently replaced row; no caller shall fold an absent identity to the empty string to satisfy the required type; each caller shall dispose of the refusal by its own established route, a failed action and an incomplete cycle from commitAction and an invalidated target deferred to the batch from the opened-file priority attempt; and this shall constrain only what a durable record carries, never what a rename report carries, where an absent key remains admissible.
  - id: FR-RIK-008
    type: functional
    priority: must
    statement: DB_VERSION shall be bumped so the existing onUpgrade drop-and-recreate rebuilds every record from current facts under the new key; no migration, transform, or record-preserving upgrade code shall be added, and the version comment shall record both the reason and what the bump does not do — it is not what closes the identity-less record class, the key is, and it is the same cold start the product already performs on reconnect, on a bound-root change and on resetAll.
  - id: FR-RIK-009
    type: functional
    priority: must
    statement: SyncStateStore.rewritePaths shall be removed from the public surface, from the ownership guard's mutating-method set and from the shared store test double, compareAndMove shall leave the same three places as it collapses into compareAndPut, the state-commit section of docs/sync-pipeline.md shall name compareAndPut, compareAndRewritePaths and compareAndDelete where it currently names put, rewritePaths and delete, and the ownership guard's import, reference, constructor and mutation-caller inventories shall be byte-identical afterwards, which is what proves the removal is detector hygiene; the guard's fixture itself shall be edited in the same change at both of the two sites that consume the mutating-method set - the set at sync-state-ownership-guard.test.mjs:9-12 and the hardcoded method list at :320 that generates two negative-fixture tests per name - and the previous claim that the set is consumed at exactly one site shall not be restated.
  - id: FR-RIK-010
    type: functional
    priority: must
    statement: SyncRecord.backendMeta shall be removed, since it has one writer and no production reader and the identifying half of its contents duplicates the now-uniquely-observed remoteIdentityKey; FileEntity.backendMeta and every backend that populates it shall be unaffected.
  - id: FR-RIK-011
    type: functional
    priority: must
    statement: The shared caching contract shall assert, for googledrive, dropbox and onedrive alike and in both provider orderings, that a reported remote file rename and a reported remote folder rename each carry an identityKey equal to the identityKey observed at newPath, and that the pair never carries the identity previously observed at oldPath's occupant when that occupant is a different object.
  - id: FR-RIK-012
    type: functional
    priority: must
    statement: The positional baseline fallback at identity-component-decision.ts:408-410 shall be retired because the population it serves cannot exist once remoteIdentityKey is the record store's key and buildSyncRecord refuses an absent or empty one; the retirement shall be verified by a test that fails when an identity-less record is constructed and shall not be asserted through npm run build, because a required string is not always-truthy to TypeScript - the empty string is falsy, the ternary compiles clean under this repository's own tsc --strict, and eslint.config.mts configures no no-unnecessary-condition; every other production branch that tested a stored record's own identity absence shall be disposed of with it, removed where the whole branch was the absent-identity branch, reduced to its comparison where the absence test was a vacuous term, and tightened where a runtime shape validator would otherwise keep admitting the forbidden shape, with none repaired by restoring a positional route or by folding an absent identity to the empty string, and with tests of an absent record rather than an absent field left untouched; and no rename report shall be failed in order to compensate for anything at the record layer.
  - id: FR-RIK-013
    type: invariant
    priority: must
    statement: A publication that relocates a record to a different vault address shall preserve the stored three-way merge base exactly when an in-place publication of the same record would — that is, under compareAndPut's existing invalidation predicate — and no rename shall destroy a merge base that an in-place publication of the same record would have kept; the predicate shall survive compareAndMove's collapse into compareAndPut rather than disappearing with the method, and shall replace compareAndRewritePaths' unconditional content deletes.
  - id: FR-RIK-014
    type: functional
    priority: must
    statement: Before any positional rename mechanism is removed or its removal is accepted as lossless, five named fixture shapes shall be driven through the production Admission entry on unchanged production code and the branch taken by selectReportFamily, aliasFolder, completeIdentityEvidence's newPath lookup and the identity guard shall be asserted by name for each; this measurement shall retire no mechanism. The measurement has been taken and its recorded result is binding on this plan - src/sync/plan-admission.test.ts carries the five shapes plus a sixth case pinning the two map-keying divergences under which the guard does fail, and records that identity-component-decision.ts:106-107 cannot fail on any fact shape today's Observation layer emits, so removing the positional enrichment is lossless and the change is not justified on that guard. A second measurement, src/sync/record-rekey-across-commit.test.ts, shall carry the same discipline across the publication boundary on the real SyncStateStore over fake-indexeddb and record that the same-cycle baseline is preserved by identity-keyed binding at identity-component-decision.ts:408-409 while the split-cycle baseline is not retained, the old row being discarded and the object re-downloaded as new. That second result shall be asserted deliberately as the model's expected end state under owner decision 8a, which settles that a correspondence whose address now belongs to another object has ended and that a reappearing object is a new file, and shall not be recorded as a defect or a loss awaiting repair. Both files shall be landed, cited and kept green; no clause of this plan shall describe an equivalent test that does not exist, and no later claim shall cite the plan's earlier analysis over these recorded results.
  - id: NFR-RIK-001
    type: non_functional
    priority: must
    statement: The change shall add no third durable authority, no persisted evidence, rename intent, Admission disposition, retry instruction or recovery marker, and no retained in-memory correctness owner; carried identity shall live only in the cycle's evidence and be discarded with it; the record layer's refusal for an identity-less entity and the store's abort for a second record at one address shall be raised and never recorded, with no persisted marker explaining either; no row shall be removed by anything other than the publication that claims its address or the publication that deletes the file it records; and because a replacement simply deletes the displaced row under owner decision 8a, no classification, ordering pass, disposition, evidence test or deferral shall exist for anything to persist.
  - id: NFR-RIK-002
    type: non_functional
    priority: must
    statement: No local identity shall be invented or inferred, LocalFs shall keep emitting identityKey undefined and no production branch shall read a local entity's identityKey as evidence; and the change shall state where a reader will find it that a missed local rename event, a cross-scope local rename, Dropbox's path-derived topology and acquisition reach are not improved by it.
  - id: NFR-RIK-003
    type: non_functional
    priority: must
    statement: Remote rename detection shall remain order-independent per ADR 0006, Dropbox's path-keyed upsertedPaths reclaim guard shall be unchanged, and no backend-specific import or branch shall be added to src/sync/.
  - id: NFR-RIK-004
    type: non_functional
    priority: must
    statement: The change shall introduce no new SyncStateStore importer, referencer, constructor or mutation caller and no new persistent-store owner; the ownership guard's four per-file inventories shall stay byte-identical, which is the machine proof that removing two names from its mutating-method set is detector hygiene over methods that no longer exist rather than the intentional new writer, owner or field that AGENTS.md:71-73 binds the ADR-0001-plus-enforcement-document triple to; the guard's own fixture shall nonetheless be edited at both sites that consume that set, which is a consequence of the removal and not evidence of a new writer; and sync-admission-authority-guard.test.mjs shall stay green with no fixture edit, since needing one would mean identity policy had moved into the store.

