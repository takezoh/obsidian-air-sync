contracts:
  - id: contract-entered-folder-recording
    dimension: control_flow
    owner: component-id-delta-seam
    requirement_refs: [FR-1, FR-3, NFR-2]
    unit_refs:
      - "Record entered folders and re-list them in Google Drive delta application"
    adr_refs: [adr-20260916-gdrive-delta-relists-entered-folders]
    verification:
      - id: v-gd-unit
        tier: T1
        command: npx vitest run src/fs/googledrive/incremental-sync.test.ts
      - id: v-build
        tier: T0
        command: npm run build

  - id: contract-gdrive-entered-folder-relisting
    dimension: integration_contract
    owner: component-gdrive-incremental-sync
    requirement_refs: [FR-1, FR-2, FR-3, FR-4, NFR-1, NFR-2]
    unit_refs:
      - "Record entered folders and re-list them in Google Drive delta application"
    adr_refs: [adr-20260916-gdrive-delta-relists-entered-folders]
    partition:
      outcomes: [determinate, unknown]
      default_policy: >-
        A rejected listAllFiles (unknown) is never treated as empty, partial or complete: it
        propagates through the existing catch so the attempt aborts without commit; an HTTP
        410 takes the existing full-scan fallback.
    verification:
      - id: v-gd-unit
        tier: T1
        command: npx vitest run src/fs/googledrive/incremental-sync.test.ts
      - id: v-guards
        tier: T1
        command: npm run lint:bot-repro
      - id: v-build
        tier: T0
        command: npm run build
      - id: v-lint
        tier: T0
        command: npm run lint
    discretion:
      - id: discretion-relist-helper-shape
        unit_ref: "Record entered folders and re-list them in Google Drive delta application"
        question: >-
          Inline the target/listing loop in applyIncrementalChanges or extract a private
          helper, and the private GoogleDriveFile-to-IdDeltaEntry mapper's name.
        scope:
          files:
            - src/fs/googledrive/incremental-sync.ts
          component: component-gdrive-incremental-sync
          visibility: private
        escalate_when:
          - "the shape needs an export or a new module"
          - "it needs an id-delta.ts change beyond contract-entered-folder-recording"
          - "any named witness would observe a difference"
        preserves:
          contract_refs: [contract-gdrive-entered-folder-relisting]
          observable_refs:
            - observable-entered-subtree-facts
            - observable-listing-calls
            - observable-attempt-abort
        verification_refs: [v-gd-unit]

  - id: contract-scope-entry-shared-case
    dimension: integration_contract
    owner: component-caching-contract-harnesses
    requirement_refs: [FR-1, FR-5, NFR-2]
    unit_refs:
      - "Add the scope-entry case to the shared caching contract for all families"
    adr_refs: [adr-20260916-gdrive-delta-relists-entered-folders]
    verification:
      - id: v-shared-contract
        tier: T1
        command: npx vitest run tests/fs/remote-backend-contracts.test.ts
      - id: v-build
        tier: T0
        command: npm run build
    discretion:
      - id: discretion-scope-entry-seam-shape
        unit_ref: "Add the scope-entry case to the shared caching contract for all families"
        question: >-
          Names and signatures of the two required harness members, fixture ids, and the
          outside-container representation inside each harness.
        scope:
          files:
            - tests/fs/contracts/caching-remote-fs.contract.ts
            - tests/fs/googledrive/caching-remote-fs.contract-harness.ts
            - tests/fs/onedrive/caching-remote-fs.contract-harness.ts
            - tests/fs/dropbox/caching-remote-fs.contract-harness.ts
          component: component-caching-contract-harnesses
          visibility: private
        escalate_when:
          - "a family's recorded delta shape cannot be expressed through the two members"
          - "any case assertion would have to become family-conditional"
        preserves:
          contract_refs: [contract-scope-entry-shared-case]
          observable_refs: [observable-shared-scope-entry]
        verification_refs: [v-shared-contract]

  - id: contract-gdrive-live-scope-entry-e2e
    dimension: integration_contract
    owner: component-gdrive-live-e2e
    requirement_refs: [FR-1]
    unit_refs:
      - "Add the Google Drive live scope-entry e2e case"
    adr_refs: [adr-20260916-gdrive-delta-relists-entered-folders]
    verification:
      - id: v-e2e-typecheck
        tier: T0
        command: npm run typecheck:e2e
      - id: v-gd-live
        tier: T2
        command: npm run test:e2e:google
    discretion:
      - id: discretion-live-poll-bounds
        unit_ref: "Add the Google Drive live scope-entry e2e case"
        question: >-
          Poll count and interval, fixture names, and helper extraction inside the Google
          Drive e2e file.
        scope:
          files:
            - e2e/googledrive.e2e.ts
          component: component-gdrive-live-e2e
          visibility: private
        escalate_when:
          - "changes.list propagation routinely needs more than about 60 seconds"
          - "the assertion would have to span more than one getChangedPaths result"
        preserves:
          contract_refs: [contract-gdrive-live-scope-entry-e2e]
          observable_refs: [observable-live-subtree-facts]
        verification_refs: [v-gd-live]

