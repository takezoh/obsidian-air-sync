adr_impacts: []

units:
  - title: "Record entered folders and re-list them in Google Drive delta application"
    chunk: null
    contract_refs: [contract-entered-folder-recording, contract-gdrive-entered-folder-relisting]
    files:
      - src/fs/caching/id-delta.ts
      - src/fs/googledrive/incremental-sync.ts
      - src/fs/googledrive/incremental-sync.test.ts
      - src/fs/googledrive/list-all.ts
      - docs/google-drive-backend.md
    depends_on: []
    acceptance:
      - "IdDeltaResult has enteredFolderIds: Set<string>, initialized by createIdDeltaResult, and applyEntry adds entry.id only when the upsert's oldPath is undefined, newPath is defined and entry.isFolder is true; wasFolder is not consulted and the sort, tombstone, moved-outside and moved branches are unchanged."
      - "After the page loop and inside the existing try, applyIncrementalChanges snapshots enteredFolderIds, drops ids without a current path, drops targets nested by the '/'-delimited test, and lists the rest with ctx.client.listAllFiles(id) one at a time in first-entered order, merging each result through applyIdDeltaPage with a private mapper."
      - "src/fs/googledrive/incremental-sync.test.ts contains, against a real GoogleDriveMetadataCache, the witnesses never-tracked, reentry-after-move-out, evicted-within-page, child-before-parent, stale-path, nested, name-prefix-sibling, left-scope-later, no-entered-folder, tracked-rename, failure, sequential, grant-subset and descendant-cached-elsewhere, all passing."
      - "never-tracked, reentry-after-move-out, evicted-within-page, child-before-parent and stale-path were observed failing against the unmodified production code before the change."
      - "The list-all.ts doc comment and docs/google-drive-backend.md describe the single scoped incremental-path use of listAllFiles instead of claiming it never runs on the delta path."
      - "npm run build, npm run lint and npm run lint:bot-repro pass with no ownership-guard fixture edit."
    objective: >-
      Make Google Drive's incremental delta report the full current subtree of every folder
      whose id gained a cached path during the drain, in the same attempt, by recording the
      entry at apply time in the shared id-delta seam and re-listing topmost targets through
      the existing listAllFiles and applyIdDeltaPage.
    output_format: "TypeScript edits to id-delta.ts and googledrive/incremental-sync.ts, new test cases, and two documentation corrections."
    tool_guidance: >-
      Read id-delta.ts, metadata-cache.ts, googledrive/incremental-sync.ts and list-all.ts
      fully first. Write the named witnesses with a real GoogleDriveMetadataCache("root") and a
      client mock exposing listChanges and listAllFiles, and confirm the RED subset before
      editing production code. Keep the existing mocked-cache cases unchanged.
    task_boundaries: >-
      Do not change applyIdDeltaPage's comparator or any existing applyEntry branch,
      AbstractMetadataCache, CachingRemoteFs, list-all.ts behavior, src/fs/onedrive or
      src/fs/dropbox. Add no try/catch, persisted field, export, concurrency or retry layer.
    decision_closure_reason: null

  - title: "Add the scope-entry case to the shared caching contract for all families"
    chunk: null
    contract_refs: [contract-scope-entry-shared-case]
    files:
      - tests/fs/contracts/caching-remote-fs.contract.ts
      - tests/fs/googledrive/caching-remote-fs.contract-harness.ts
      - tests/fs/onedrive/caching-remote-fs.contract-harness.ts
      - tests/fs/dropbox/caching-remote-fs.contract-harness.ts
    depends_on:
      - "Record entered folders and re-list them in Google Drive delta application"
    acceptance:
      - "CachingRemoteFsHarness gains two required members (seed a folder with a.md and sub/b.md outside the bound root; stage its move into the root) implemented by every implementer: the three backend harnesses and the mock harness in src/fs/caching/remote-fs.contract.test.ts, which self-registers rather than going through the composition root; tests/fs/remote-backend-contracts.test.ts is unchanged."
      - "The Google Drive harness listAllFiles(folderId) returns only the descendants of folderId in parent-first order, the Google Drive stage emits one change for the folder only, and the OneDrive and Dropbox stages emit the folder and all descendants in the order their live probes recorded (live-probe-onedrive, live-probe-dropbox)."
      - "runCachingRemoteFsContract's scope-entry case asserts pre-move invisibility, exact modified [F, F/a.md, F/sub, F/sub/b.md] with empty deleted and renamed, stat of F/sub/b.md, and the same modified set after abortWorkingView and a second getChangedPaths."
      - "The Google Drive cell fails on production code without unit 1 and fails with the old whole-baseline listAllFiles stub; all existing cases in every harness stay green."
      - "The OneDrive and Dropbox cells pass over unchanged production code, with no added client method and no request beyond the ordinary delta pages."
    objective: >-
      Pin RB-CHK-003 scope-entry completeness for every registered caching family through the
      real filesystems over fakes whose delta shapes match recorded live observations.
    output_format: "One shared contract case, a widened harness interface and its harness implementations (three backend harnesses plus the mock harness)."
    tool_guidance: >-
      Follow the stageRemoteRename precedent (ADR 0006). Witness the Google Drive stub
      fidelity by running the case once against the old stub before replacing it. Take each
      family's staged delta shape from its recorded live probe in recovery-decisions.json.
    task_boundaries: >-
      Do not create a separate contract module, family-filtered registration, skip, optional
      member or family-conditional assertion. Change only the four listed test files: no
      production file changes, in particular none under src/fs/onedrive, src/fs/dropbox,
      src/fs/caching/remote-fs.ts or src/fs/caching/metadata-cache.ts.
    decision_closure_reason: null

  - title: "Add the Google Drive live scope-entry e2e case"
    chunk: null
    contract_refs: [contract-gdrive-live-scope-entry-e2e]
    files:
      - e2e/googledrive.e2e.ts
      - docs/e2e-testing.md
    depends_on:
      - "Record entered folders and re-list them in Google Drive delta application"
    acceptance:
      - "In the credentialed branch, one case creates F with a.md and sub/b.md in an outside sibling folder, commits a checkpoint on a fresh root with a real MetadataStore, then moves F in, out and back in, polling getChangedPaths until F appears and asserting that same result contains all four paths (modified on move-in, deleted on move-out) plus stat of F/sub/b.md after re-entry."
      - "An exhausted poll bound fails with a message naming changes.list propagation; missing credentials keep the existing file-level skip."
      - "docs/e2e-testing.md Notes describes the scenario, the polling reason, and why the assertion is bound to the first result containing F."
      - "npm run typecheck:e2e passes; the case is not part of npm test or CI."
    objective: "Backstop the Google Drive scope-entry fix against the real API, including the re-entry case the live probe reproduced."
    output_format: "One new live e2e case and a documentation note."
    tool_guidance: >-
      Reuse makeGoogleDriveChild for both the root and the outside folder and
      client.updateFileMetadata(id, {}, addParents, removeParents) for moves. Run
      npm run test:e2e:google outside the agent sandbox per docs/e2e-testing.md.
    task_boundaries: "e2e/googledrive.e2e.ts and docs/e2e-testing.md only; no new e2e file and no production change."
    decision_closure_reason: null

acceptance:
  - id: AC-1
    criteria: >-
      A Google Drive folder that enters the bound root (never tracked, re-entered after a
      move-out, evicted within the page by an ancestor tombstone, restored, listed after its
      own child, or re-keyed later in the drain) yields the folder and every grant-visible
      descendant as modified (or renamed when cached elsewhere) in the same getChangedPaths()
      result; the shared scope-entry case passes for Google Drive and the live re-entry case
      passes.
    requirement_refs: [FR-1]
  - id: AC-2
    criteria: >-
      Nested entered folders produce exactly one listing for the topmost folder, while Notes
      and Notes2 produce two listings.
    requirement_refs: [FR-2]
  - id: AC-3
    criteria: >-
      A drain with no entered folder, including a rename or move of a cached folder, issues
      zero listAllFiles calls.
    requirement_refs: [FR-3]
  - id: AC-4
    criteria: >-
      A rejected listing rejects applyIncrementalChanges with the same error, lists no later
      target, commits nothing, and the shared case's abort-and-replay step re-derives the same
      subtree facts.
    requirement_refs: [FR-4]
  - id: AC-5
    criteria: >-
      OneDrive and Dropbox production files are unchanged and the shared scope-entry case
      passes for both, each over a fake that emits the shape its live probe recorded.
    requirement_refs: [FR-5]
  - id: AC-6
    criteria: >-
      Listings run strictly one at a time and their count equals the number of topmost
      targets.
    requirement_refs: [NFR-1]
  - id: AC-7
    criteria: >-
      No new persisted or retained state exists, absence from a listing never removes a cached
      entry, and both ownership guards pass without fixture edits.
    requirement_refs: [NFR-2]

dispositions:
  - decision_input_ref: decision-input-scope-googledrive-only
    disposition: "adopted: production fix and new I/O are Google Drive only; live-probe-onedrive shows OneDrive already complete (ADR decision 5)."
    adr_refs: [adr-20260916-gdrive-delta-relists-entered-folders]
    contract_refs: [contract-gdrive-entered-folder-relisting, contract-scope-entry-shared-case]
  - decision_input_ref: decision-input-shared-seam-vs-gdrive-local
    disposition: "rejected: leaving id-delta.ts untouched forces page-start or drain-start sampling, which loses a folder evicted within the page by its ancestor's tombstone; its Google-Drive-only I/O half is carried by decision-input-shared-seam-placement."
    adr_refs: [adr-20260916-gdrive-delta-relists-entered-folders]
    contract_refs: [contract-entered-folder-recording]
  - decision_input_ref: decision-input-shared-seam-placement
    disposition: "adopted (modified): apply-time recording of stable ids in the shared seam, I/O only in Google Drive; the future-third-backend rationale is replaced by apply-time exactness."
    adr_refs: [adr-20260916-gdrive-delta-relists-entered-folders]
    contract_refs: [contract-entered-folder-recording, contract-gdrive-entered-folder-relisting]
  - decision_input_ref: decision-input-subtree-merge-algorithm
    disposition: "rejected: re-feeding the parent-first listAllFiles result through applyIdDeltaPage is order-safe (stable sort, depth-1 tie, cached parents resolve by id, unknown parents dropped), so a new AbstractMetadataCache resolver prevents no failure."
    adr_refs: [adr-20260916-gdrive-delta-relists-entered-folders]
    contract_refs: [contract-gdrive-entered-folder-relisting]
  - decision_input_ref: decision-input-reuse-list-all
    disposition: "adopted: GoogleDriveClient.listAllFiles is reused unchanged, called sequentially per topmost target with no added retry layer."
    adr_refs: [adr-20260916-gdrive-delta-relists-entered-folders]
    contract_refs: [contract-gdrive-entered-folder-relisting]
  - decision_input_ref: decision-input-folder-scope-entry-contract-shape
    disposition: "rejected: a Google-Drive-and-OneDrive-only module would opt Dropbox out of a normative shared case; the case lives in runCachingRemoteFsContract for all registered families."
    adr_refs: [adr-20260916-gdrive-delta-relists-entered-folders]
    contract_refs: [contract-scope-entry-shared-case]
  - decision_input_ref: decision-input-harness-fidelity-asymmetric-fakes
    disposition: "adopted (extended): each family's harness emits its live-recorded delta shape and the Google Drive listAllFiles stub is scoped to the requested folder; all three shapes are now grounded in recorded probes (live-probe-googledrive, live-probe-onedrive, live-probe-dropbox)."
    contract_refs: [contract-scope-entry-shared-case]
  - decision_input_ref: decision-input-adr-home-choice
    disposition: "adopted: a standalone ADR, because ADR 0006 reorders a complete delta while this decision recovers entries the provider never sends."
    adr_refs: [adr-20260916-gdrive-delta-relists-entered-folders]
  - decision_input_ref: decision-input-adr-home
    disposition: "subsumed into decision-input-adr-home-choice (same question and same standalone outcome)."
    adr_refs: [adr-20260916-gdrive-delta-relists-entered-folders]
  - decision_input_ref: decision-input-verification-tiers
    disposition: "adopted: unit witnesses and the shared contract case in the enforced gate (T1), the live Google Drive e2e opt-in (T2), static and type checks (T0); no probe tier remains in the change, because all three provider shapes are already recorded."
    contract_refs:
      - contract-entered-folder-recording
      - contract-gdrive-entered-folder-relisting
      - contract-scope-entry-shared-case
      - contract-gdrive-live-scope-entry-e2e
  - decision_input_ref: decision-input-empty-folder-nongoal
    disposition: "adopted: recorded as a non-goal in change.md and the requirements member per the user decision; change-detector.ts is untouched and no issue is filed."
  - decision_input_ref: decision-input-empty-folder-followup
    disposition: "subsumed into decision-input-empty-folder-nongoal (no follow-up issue)."
  - decision_input_ref: decision-input-repro-test-deleted
