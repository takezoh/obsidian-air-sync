version: 2
granularity_profile: boundary-complete

scope_expansion_signals:
  - id: scope-signal-id-delta-entered-folder-ids
    kind: shared_boundary
    target_ref: component-id-delta-seam
    witness: >-
      IdDeltaResult in src/fs/caching/id-delta.ts, shared by Google Drive and OneDrive,
      gains enteredFolderIds; OneDrive computes it per call and never reads it. Apply-time
      recording is required because page-start or drain-start sampling loses a folder
      evicted within the same page by its ancestor's tombstone.
    requirement_refs: [FR-1, NFR-2]
    authority_refs:
      - "critique.json#issue-reenum-path-keyed-idat-stale"
      - "critique.json#dimension_coverage/control_flow"
  - id: scope-signal-caching-harness-scope-entry-members
    kind: shared_boundary
    target_ref: component-caching-contract-harnesses
    witness: >-
      CachingRemoteFsHarness<TFile>, implemented by the Google Drive, OneDrive and Dropbox
      harnesses, gains two required members and runCachingRemoteFsContract gains one
      scope-entry case run for all three registered families.
    requirement_refs: [FR-1, FR-5]
    authority_refs:
      - "recovery-decisions.json#unknown-e2e-contract-harness-extension-need"
      - "docs/design/design-remote-backend-implementation-contract.md#failure-responsibility"
  - id: scope-signal-verification-tiers-user-decision
    kind: post_consultation_decision
    target_ref: component-gdrive-live-e2e
    witness: >-
      The user fixed verification to unit plus shared contract harness with provider-faithful
      fakes plus opt-in live e2e, which adds the shared scope-entry case and the Google Drive
      live move-in/move-out/move-back-in case.
    requirement_refs: [FR-1, FR-5]
    authority_refs:
      - "recovery-decisions.json#unknown-e2e-contract-harness-extension-need"
  - id: scope-signal-adr-renamed-narrowed-successor
    kind: smaller_structural_alternative
    target_ref: adr-20260916-gdrive-delta-relists-entered-folders
    witness: >-
      Both drafts proposed an ADR for this same decision under different ids (draft-1
      adr-gdrive-folder-scope-entry-reenumeration, draft-2
      adr-20260916-newly-resolved-folder-reenumeration-order-independence), so no draft
      baseline carries the final id. The final ADR is their renamed and narrowed successor:
      it fixes a Google-Drive-scoped delta mechanism rather than draft-2's cross-backend
      order-independence norm, and it adds no decision the drafts did not already raise.
    requirement_refs: [FR-1, FR-5]
    authority_refs:
      - "draft-1/spine-draft.yaml#adr-gdrive-folder-scope-entry-reenumeration"
      - "draft-2/spine-draft.yaml#adr-20260916-newly-resolved-folder-reenumeration-order-independence"
      - "critique.json#issue-rbchk003-amendment-enforcement-unfounded"
      - "recovery-decisions.json#live-probe-onedrive"

requirements:
  - id: FR-1
    type: event-driven
    priority: MUST
    statement: >-
      WHEN Google Drive incremental delta application applies a folder change whose stable
      id has no cached path immediately before that change is applied, and that folder still
      resolves inside the bound root when the changes drain ends, the Google Drive filesystem
      SHALL include in the same getChangedPaths() or list() working view that folder and every
      descendant the configured OAuth grant lists under it, each descendant reported as
      modified, or as a renamed pair when its id was cached at another path.
  - id: FR-2
    type: unwanted-behavior
    priority: MUST
    statement: >-
      IF more than one folder satisfies FR-1 in one changes drain and one folder's post-drain
      path is a '/'-delimited descendant of another's, THEN the Google Drive filesystem SHALL
      list only the topmost folder, and a folder whose name merely extends another folder's
      name SHALL still be listed.
  - id: FR-3
    type: event-driven
    priority: MUST
    statement: >-
      WHEN a Google Drive changes drain contains no folder that satisfies FR-1, including a
      rename or move of an already-cached folder, the Google Drive filesystem SHALL issue no
      subtree listing request.
  - id: FR-4
    type: unwanted-behavior
    priority: MUST
    statement: >-
      IF a subtree listing for FR-1 fails after the listing's own bounded retries, THEN
      getChangedPaths() and list() SHALL reject with that error, the durable checkpoint SHALL
      remain unchanged, and the next attempt SHALL list the same folders again from the
      committed window; an HTTP 410 takes the existing full-scan fallback.
  - id: FR-5
    type: event-driven
    priority: MUST
    statement: >-
      WHEN a folder with pre-existing descendants moves into the bound root on OneDrive or
      Dropbox, the existing delta application SHALL report the folder and every descendant in
      the same result, without a production code change and without any request beyond its
      ordinary delta pages.
  - id: NFR-1
    type: performance
    priority: MUST
    statement: >-
      Within one Google Drive changes drain, subtree listings SHALL run sequentially with at
      most one listAllFiles walk in flight, their count SHALL NOT exceed the number of topmost
      folders satisfying FR-1, and no retry layer SHALL be added around listAllFiles.
  - id: NFR-2
    type: ubiquitous
    priority: MUST
    statement: >-
      The system SHALL keep the entered-folder set and listing targets only within one delta
      application call, SHALL persist no new field, cursor, evidence or recovery marker, SHALL
      never remove, tombstone or re-key a cached entry because it is absent from a subtree
      listing, and SHALL keep sync-state-ownership-guard.test.mjs and
      sync-admission-authority-guard.test.mjs green without fixture edits.

