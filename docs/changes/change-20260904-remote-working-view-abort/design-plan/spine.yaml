      - src/fs/caching/remote-fs.ts
      - src/store/metadata-store.ts
  - id: component-cycle-boundary
    kind: existing
    contract_refs: [contract-cycle-closeout, contract-temperature-convergence]
    paths:
      - src/sync/orchestrator.ts
      - src/sync/sync-cycle-finalization.ts
      - src/sync/change-detector.ts
  - id: component-executor-settlement
    kind: existing
    contract_refs: [contract-fatal-settlement]
    paths:
      - src/sync/plan-executor.ts
      - src/sync/priority-batch-state.ts
      - src/queue/async-queue.ts
  - id: component-provider-contracts
    kind: existing
    contract_refs: [contract-provider-replay]
    paths:
      - tests/fs/contracts/caching-remote-fs.contract.ts
      - tests/fs/remote-backend-contracts.test.ts
      - tests/fs/googledrive/caching-remote-fs.contract-harness.ts
      - tests/fs/dropbox/caching-remote-fs.contract-harness.ts
      - tests/fs/onedrive/caching-remote-fs.contract-harness.ts
      - src/__mocks__/sync-test-helpers.ts

contracts:
  - id: contract-working-view-lifecycle
    dimension: state_lifecycle
    owner: component-checkpoint-owner
    requirement_refs: [FR-WV-001, FR-WV-002, FR-WV-006, NFR-WV-001, NFR-WV-002]
    unit_refs: [unit-1-checkpoint-lifecycle]
    adr_refs: [adr-remote-working-view-abort-boundary]
    verification:
      - id: verify-working-view-abort
        tier: T0
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
      - id: verify-durable-query-fallback
        tier: T1
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
      - id: verify-commit-failure-scope
        tier: T1
        command: npm test -- src/sync/sync-cycle-finalization.test.ts src/sync/orchestrator.test.ts
      - id: verify-reset-separation
        tier: T1
        command: npm test -- tests/fs/remote-backend-contracts.test.ts src/sync/orchestrator.test.ts
  - id: contract-cycle-closeout
    dimension: control_flow
    owner: component-cycle-boundary
    requirement_refs: [FR-WV-002, FR-WV-003, FR-WV-007, NFR-WV-001]
    unit_refs: [unit-3-cycle-closeout]
    adr_refs: [adr-remote-working-view-abort-boundary]
    verification:
      - id: verify-returned-partition
        tier: T0
        command: npm test -- src/sync/sync-cycle-finalization.test.ts
      - id: verify-exception-order
        tier: T1
        command: npm test -- src/sync/orchestrator.test.ts
      - id: verify-post-closeout-exclusion
        tier: T1
        command: npm test -- src/sync/orchestrator.test.ts
      - id: verify-no-capability
        tier: T1
        command: npm test -- src/sync/orchestrator.test.ts src/sync/sync-cycle-finalization.test.ts
    partition:
      outcomes: [determinate, unknown, inconclusive]
      default_policy: A proved clean result commits; every returned incomplete or checkpoint-blocked result aborts; pre-closeout exceptions abort before propagation; absent capability performs neither operation.
  - id: contract-fatal-settlement
    dimension: concurrency
    owner: component-executor-settlement
    requirement_refs: [FR-WV-003, FR-WV-004, FR-WV-007, NFR-WV-002]
    unit_refs: [unit-2-executor-settlement, unit-3-cycle-closeout]
    adr_refs: [adr-remote-working-view-abort-boundary]
    verification:
      - id: verify-auth-fatal-settlement
        tier: T0
        command: npm test -- src/sync/plan-executor.test.ts
      - id: verify-invariant-fatal-settlement
        tier: T0
        command: npm test -- src/sync/plan-executor.test.ts
      - id: verify-mixed-rejection-identity
        tier: T1
        command: npm test -- src/sync/plan-executor.test.ts
      - id: verify-no-later-work
        tier: T1
        command: npm test -- src/sync/plan-executor.test.ts src/sync/orchestrator.test.ts
  - id: contract-temperature-convergence
    dimension: failure_recovery
    owner: component-cycle-boundary
    requirement_refs: [FR-WV-003, FR-WV-005, FR-WV-006, FR-WV-007, NFR-WV-001, NFR-WV-002]
    unit_refs: [unit-3-cycle-closeout]
    adr_refs: [adr-remote-working-view-abort-boundary]
    verification:
      - id: verify-cold-convergence
        tier: T0
        command: npm test -- src/sync/orchestrator.test.ts
      - id: verify-warm-convergence
        tier: T0
        command: npm test -- src/sync/orchestrator.test.ts
      - id: verify-hot-convergence
        tier: T0
        command: npm test -- src/sync/orchestrator.test.ts
      - id: verify-read-failure-cold
        tier: T1
        command: npm test -- src/sync/orchestrator.test.ts
    partition:
      outcomes: [determinate, unknown, inconclusive]
      default_policy: Acquisition uses only durable and current facts; a durable query read failure yields false or null and conservatively enters ordinary COLD without creating recovery state.
  - id: contract-provider-replay
    dimension: integration_contract
    owner: component-provider-contracts
    requirement_refs: [FR-WV-001, FR-WV-005, FR-WV-006, FR-WV-008, NFR-WV-002]
    unit_refs: [unit-1-checkpoint-lifecycle, unit-4-architecture-and-gates]
    adr_refs: [adr-remote-working-view-abort-boundary]
    verification:
      - id: verify-three-provider-registration
        tier: T0
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
      - id: verify-provider-same-instance-replay
        tier: T1
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
      - id: verify-provider-folder-rename
        tier: T1
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
      - id: verify-provider-arbitrary-prefix
        tier: T1
        command: npm test -- tests/fs/remote-backend-contracts.test.ts
    partition:
      outcomes: [determinate, unknown, inconclusive]
      default_policy: A provider failure may leave any prefix including none in the live derived view; abort invalidates the whole view and replay begins at the durable cursor.

adrs:
