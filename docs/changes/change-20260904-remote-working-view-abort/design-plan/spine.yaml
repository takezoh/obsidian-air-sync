artifact: design-plan-spine
version: 2
granularity_profile: boundary-complete

scope_expansion_signals:
  - id: scope-signal-checkpoint-abort-api
    kind: shared_boundary
    target_ref: contract-working-view-lifecycle
    witness: A required abortWorkingView operation changes every checkpoint-capable implementation and test double.
    requirement_refs: [FR-WV-001, FR-WV-006, NFR-WV-001]
    authority_refs:
      - /home/take/.dev-skills/design/remote-working-view-abort/artifacts/planning-source.txt
      - docs/adr/0001-metadata-cache-is-subordinate-to-commit-last.md
  - id: scope-signal-executor-settlement
    kind: shared_boundary
    target_ref: contract-fatal-settlement
    witness: Delaying an existing aggregate rejection until its scheduled siblings settle changes shared executor terminal timing while preserving error selection.
    requirement_refs: [FR-WV-003, FR-WV-004]
    authority_refs:
      - /home/take/.dev-skills/design/remote-working-view-abort/artifacts/critique.json

requirements:
  - id: FR-WV-001
    type: functional
    priority: must
    statement: An incomplete checkpoint-capable attempt shall invoke a required idempotent live-only abort and leave provider state and the durable checkpoint unchanged.
  - id: FR-WV-002
    type: invariant
    priority: must
    statement: Finalization shall commit exactly a wholly safe cycle, abort every incomplete result, and abort after commit rejection before propagation.
  - id: FR-WV-003
    type: functional
    priority: must
    statement: Observation through execution exceptions shall abort before classification or retry, while post-closeout backend-state or settings errors shall not issue a second abort.
  - id: FR-WV-004
    type: invariant
    priority: must
    statement: AuthError and InternalFreshInvariantError shall invalidate queued work, settle scheduled siblings, and rethrow the exact rejection selected by the existing aggregate before discard.
  - id: FR-WV-005
    type: invariant
    priority: must
    statement: Equivalent durable and current facts shall converge through ordinary COLD, WARM, or HOT acquisition without prior-error state.
  - id: FR-WV-006
    type: functional
    priority: must
    statement: Checkpoint presence and scope queries shall read durable metadata only and conservatively return false or null on absence or read failure, while reset alone remains destructive.
  - id: FR-WV-007
    type: functional
    priority: must
    statement: Priority invalidation or checkpointBlocked shall abort, while an exact completed pull superseded by priority remains terminal for a clean commit.
  - id: FR-WV-008
    type: functional
    priority: must
    statement: Google Drive, Dropbox, and OneDrive shall run one shared observable abort and replay contract without provider-specific recovery policy.
  - id: NFR-WV-001
    type: non_functional
    priority: must
    statement: The change shall add no durable authority, schema, migration, recovery ledger, intermediate correctness state, or replacement orchestrator field.
  - id: NFR-WV-002
    type: non_functional
    priority: must
    statement: Tests shall distinguish live from durable facts and fail when abort is absent, a no-op, or races scheduled siblings.

components:
  - id: component-checkpoint-owner
    kind: existing
    contract_refs: [contract-working-view-lifecycle]
    paths:
