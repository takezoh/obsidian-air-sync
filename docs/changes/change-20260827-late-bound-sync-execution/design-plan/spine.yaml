artifact: design-plan-spine
version: 2
granularity_profile: boundary-complete

scope_expansion_signals:
  - id: scope-signal-component-authority-carrier
    kind: shared_boundary
    target_ref: contract-component-authority
    witness: Direction-free component and member-obligation IDs plus in-memory authorization epochs replace directional action objects across Admission, execution, and finalization.
    requirement_refs: [FR-LATE-01, FR-LATE-05, FR-LATE-09]
    authority_refs: [decision-input-execution-time-direction, decision-input-admission-authority]
  - id: scope-signal-shared-current-observation
    kind: shared_boundary
    target_ref: contract-current-observation
    witness: The detached file-open observation seam is generalized into paired admitted-identity and independent current path-occupant/absence observations for normal endpoints across all providers while remaining request-local and delta/cache/checkpoint neutral.
    requirement_refs: [FR-LATE-01, FR-LATE-05, FR-LATE-08]
    authority_refs: [decision-input-execution-time-direction, decision-input-detached-observation]

requirements:
  - id: FR-LATE-01
    type: ubiquitous
    priority: must
    statement: After component ownership, the system shall choose and execute each direction-free member obligation only from current Local, paired admitted-identity and independent current path-occupant Remote observations, and current SyncRecord.
  - id: FR-LATE-02
    type: event_driven
    priority: must
    statement: When file-open priority is pending, the system shall run it before every normal component not already started.
  - id: FR-LATE-03
    type: event_driven
    priority: must
    statement: When evidence changes before I/O, the system shall re-observe the same component without stale disposition, provider ordering, priority supersession receipt, or drift-driven COLD.
  - id: FR-LATE-04
    type: state_driven
    priority: must
    statement: While execution-time direction differs from provisional phase, the system shall preserve existing phase/barrier ordering and prevent the specified effect-by-scheduler-state forbidden overlaps without mandating one private locking mechanism.
  - id: FR-LATE-05
    type: ubiquitous
    priority: must
    statement: Structural I/O shall remain inside the complete endpoint and identity component proved by frozen authoritative batch or delta evidence.
  - id: FR-LATE-06
    type: event_driven
    priority: must
    statement: Single-record content baseline replacement shall use existing two-argument whole-record compareAndPut(expectedRecord, nextRecord), whose records carry the path; rename, delete, and multi-record effects shall use current component-owned ordered writes, emit no success or checkpoint commit on partial failure, and converge by incremental replay without new API or schema growth.
  - id: FR-LATE-07
    type: state_driven
    priority: must
    statement: Repeated invalidation shall consume bounded work per scheduling quantum and yield nonterminal same-cycle work; continuous churn shall block checkpoint without a new terminal churn failure.
  - id: FR-LATE-08
    type: event_driven
    priority: must
    statement: A no-action member completion shall require current local, whole-record, admitted-identity, independent path-occupant token or authoritative path-absence, frozen-delta, component/member-ID, and latest-epoch witnesses; identity missing alone is not path absence.
  - id: FR-LATE-09
    type: ubiquitous
    priority: must
    statement: Finalization shall require one latest-epoch component receipt whose exact admitted direction-free member-obligation ID set has one terminal applied or no-action completion per member, for every authorized component.
  - id: FR-LATE-10
    type: unwanted
    priority: must
    statement: If a cycle is ordinarily incomplete and its last committed cursor remains usable, next incremental work shall replay target plus sibling from that checkpoint without list or COLD; provider cursor rejection or expiry shall use the existing typed cursor-expiry COLD policy, and ordinary drift/failure alone shall not.

components:
  - id: component-work-admission
    kind: existing
    contract_refs: [contract-component-authority]
    paths: [src/sync/sync-cycle-planning.ts, src/sync/plan-admission.ts, src/sync/plan-admission-graph.ts, src/sync/types.ts]
  - id: component-current-observation
    kind: existing
    contract_refs: [contract-current-observation, contract-checkpoint-replay]
    paths: [src/fs/interface.ts, src/fs/priority-observation.ts, src/fs/caching/remote-fs.ts, src/fs/googledrive/client.ts, src/fs/googledrive/index.ts, src/fs/dropbox/index.ts, src/fs/onedrive/index.ts]
  - id: component-runtime-decision
    kind: existing
    contract_refs: [contract-late-bound-decision]
    paths: [src/sync/decision-engine.ts, src/sync/plan-executor.ts]
  - id: component-dynamic-executor
    kind: existing
    contract_refs: [contract-route-isolation, contract-churn-progress]
    paths: [src/sync/plan-executor.ts, src/sync/local-mutation-barrier.ts, src/sync/priority-coordinator.ts]
  - id: component-baseline-commit
    kind: existing
    contract_refs: [contract-baseline-commit, contract-no-action-freshness]
    paths: [src/sync/state.ts, src/sync/state-committer.ts, src/sync/local-tracker.ts, src/sync/execution-result.ts]
  - id: component-cycle-finalization
    kind: existing
    contract_refs: [contract-component-finalization, contract-checkpoint-replay]
    paths: [src/sync/sync-cycle-finalization.ts, src/sync/orchestrator.ts, src/sync/priority-coordinator.ts]

contracts:
  - id: contract-component-authority
    dimension: integration_contract
    owner: component-work-admission
    requirement_refs: [FR-LATE-01, FR-LATE-05, FR-LATE-09]
    unit_refs: [unit-work-admission, unit-late-bound-executor]
    adr_refs: [adr-late-bound-component-execution, adr-20260825-issue43-destructive-authorization]
    verification:
      - {id: verify-component-authority, tier: T0, command: "npm test -- src/sync/plan-admission.test.ts"}
    partition:
      outcomes: [determinate, unknown, conflicting]
      default_policy: Unknown, incomplete, or conflicting component/member-obligation authority permits no I/O and no successful component receipt.
  - id: contract-current-observation
    dimension: integration_contract
    owner: component-current-observation
    requirement_refs: [FR-LATE-01, FR-LATE-03, FR-LATE-05, FR-LATE-08]
    unit_refs: [unit-current-observation, unit-late-bound-executor]
    adr_refs: [adr-late-bound-component-execution, adr-20260827-file-open-fast-pass-preserves-remote-change-batches]
    verification:
      - {id: verify-detached-current-observation, tier: T1, command: "npm test -- src/fs/caching/remote-fs.contract.test.ts"}
      - {id: verify-provider-identity-path-pair, tier: T1, command: "npm test -- src/fs/googledrive/targeted-observation.test.ts src/fs/dropbox/targeted-observation.test.ts src/fs/onedrive/targeted-observation.test.ts"}
      - {id: verify-google-occupant-pagination, tier: T1, command: "npm test -- src/fs/googledrive/client.test.ts src/fs/googledrive/targeted-observation.test.ts"}
    partition:
      outcomes: [determinate, unknown, inconclusive, conflicting]
      default_policy: Identity missing alone is not path absence. Google Drive must paginate all same-parent/name candidates and classify 0/1/>1 as absence/current/conflicting; Dropbox/OneDrive must expose the same absence/current/conflicting/unverifiable partition through their path-metadata seams. Replacement/structural/conflicting/unverifiable pairs authorize neither I/O nor no-action completion and leave replay pending; point evidence never proves topology completeness.
  - id: contract-late-bound-decision
    dimension: control_flow
    owner: component-runtime-decision
    requirement_refs: [FR-LATE-01, FR-LATE-03, FR-LATE-05, FR-LATE-09]
    unit_refs: [unit-late-bound-executor]
    adr_refs: [adr-late-bound-component-execution]
    verification:
      - {id: verify-current-decision, tier: T0, command: "npm test -- src/sync/decision-engine.test.ts src/sync/plan-executor.test.ts"}
      - {id: verify-all-member-obligations, tier: T0, command: "npm test -- src/sync/plan-executor.test.ts src/sync/sync-cycle-finalization.test.ts"}
    partition:
      outcomes: [determinate, unknown, conflicting]
      default_policy: Each exact admitted member obligation must receive a determinate current effect inside the latest Admission envelope; otherwise the component remains failed/nonterminal and emits no successful component receipt.
  - id: contract-route-isolation
    dimension: concurrency
    owner: component-dynamic-executor
    requirement_refs: [FR-LATE-02, FR-LATE-04]
    unit_refs: [unit-late-bound-executor]
    adr_refs: [adr-late-bound-component-execution]
    verification:
      - {id: verify-effect-scheduler-isolation, tier: T0, command: "npm test -- src/sync/plan-executor.test.ts"}
      - {id: verify-priority-safe-point, tier: T1, command: "npm test -- src/sync/priority-coordinator.test.ts src/sync/local-mutation-barrier.test.ts"}
    partition:
      outcomes: [determinate, unknown, inconclusive]
      default_policy: An effect whose scheduler-state isolation cannot be shown to preserve all forbidden-overlap, ordering, and concurrency outcomes performs no I/O and remains unresolved.
    discretion:
      - id: discretion-private-route-isolation
        unit_ref: unit-late-bound-executor
        question: Choose the private scheduling or locking composition that enforces the observable effect-by-scheduler-state isolation contract.
        scope:
          files: [src/sync/plan-executor.ts, src/sync/local-mutation-barrier.ts, src/sync/priority-coordinator.ts]
          component: component-dynamic-executor
          visibility: private
        escalate_when:
          - The choice adds or changes a shared scheduler, lane, guard, or result API.
          - The choice adds persisted coordination state or a provider call.
          - The choice changes observable forbidden-overlap semantics, transfer/conflict/structural ordering, conflict sibling isolation, rename ordering, strict priority, starvation behavior, or disjoint-path concurrency.
        constraints:
          - Preserve every outcome and failure partition of contract-route-isolation.
          - Keep implementation state cycle-local and private to the listed component/files.
        preserves:
          contract_refs: [contract-route-isolation]
          invariant_refs: [FR-LATE-02, FR-LATE-04]
        verification_refs: [verify-effect-scheduler-isolation, verify-priority-safe-point]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: private
          context_scope: files
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: concurrency
          coupling: coupled_within_unit
          grounding: evidenced
  - id: contract-churn-progress
    dimension: performance
    owner: component-dynamic-executor
    requirement_refs: [FR-LATE-03, FR-LATE-07]
    unit_refs: [unit-late-bound-executor]
    adr_refs: [adr-late-bound-component-execution]
    verification:
      - {id: verify-churn-quantum, tier: T0, command: "npm test -- src/sync/plan-executor.test.ts"}
    partition:
      outcomes: [determinate, inconclusive]
      default_policy: Quantum exhaustion yields nonterminal work and blocks checkpoint; it is neither success nor a new terminal failure.
  - id: contract-baseline-commit
    dimension: state_lifecycle
    owner: component-baseline-commit
    requirement_refs: [FR-LATE-06]
    unit_refs: [unit-commit-receipts]
    adr_refs: [adr-late-bound-component-execution, adr-0001-metadata-cache-is-subordinate-to-commit-last]
    verification:
      - {id: verify-effect-shape-commit, tier: T0, command: "npm test -- src/sync/state.test.ts src/sync/plan-executor.test.ts"}
      - {id: verify-no-schema-growth, tier: T0, command: "npm run build"}
    partition:
      outcomes: [determinate, conflicting]
      default_policy: Expected-record mismatch preserves the current single-record baseline; any structural ordered-write/effect failure emits no success, withholds checkpoint commit, and relies on incremental replay to converge even if an earlier write remains.
  - id: contract-no-action-freshness
    dimension: state_lifecycle
    owner: component-baseline-commit
    requirement_refs: [FR-LATE-08, FR-LATE-09]
    unit_refs: [unit-commit-receipts, unit-finalization]
    adr_refs: [adr-late-bound-component-execution, adr-0001-metadata-cache-is-subordinate-to-commit-last]
    verification:
      - {id: verify-no-action-freshness, tier: T1, command: "npm test -- src/sync/orchestrator.test.ts src/sync/sync-cycle-finalization.test.ts"}
    partition:
      outcomes: [determinate, unknown, conflicting]
      default_policy: Missing or stale local, record, admitted-identity, independent path-occupant/absence, delta, component/member ID, or epoch witness invalidates that member's no-action completion.
  - id: contract-component-finalization
    dimension: state_lifecycle
    owner: component-cycle-finalization
    requirement_refs: [FR-LATE-02, FR-LATE-09, FR-LATE-10]
    unit_refs: [unit-finalization]
    adr_refs: [adr-late-bound-component-execution, adr-0001-metadata-cache-is-subordinate-to-commit-last]
    verification:
      - {id: verify-exact-component-finalization, tier: T0, command: "npm test -- src/sync/sync-cycle-finalization.test.ts"}
      - {id: verify-exact-member-finalization, tier: T1, command: "npm test -- src/sync/plan-executor.test.ts src/sync/sync-cycle-finalization.test.ts src/sync/orchestrator.test.ts"}
    partition:
      outcomes: [determinate, unknown, conflicting]
      default_policy: Missing, duplicate, unknown, failed, blocked, nonterminal, obsolete-epoch, member-set-inexact, member-incomplete, or freshness-invalid component/member evidence emits no successful component receipt and withholds commit; partial member effects converge by replay.
  - id: contract-checkpoint-replay
    dimension: failure_recovery
    owner: component-current-observation
    requirement_refs: [FR-LATE-05, FR-LATE-10]
    unit_refs: [unit-current-observation, unit-finalization]
    adr_refs: [adr-late-bound-component-execution, adr-0001-metadata-cache-is-subordinate-to-commit-last]
    verification:
      - {id: verify-last-committed-replay, tier: T1, command: "npm test -- src/fs/caching/remote-fs.contract.test.ts"}
      - {id: verify-incremental-replay, tier: T1, command: "npm test -- src/sync/orchestrator.test.ts src/fs/caching/remote-fs.contract.test.ts"}
      - {id: verify-cursor-expiry-partition, tier: T1, command: "npm test -- src/sync/orchestrator.test.ts src/fs/caching/remote-fs.contract.test.ts"}
    partition:
      outcomes: [determinate, unknown, inconclusive, conflicting]
      default_policy: Ordinary incomplete work with a usable committed cursor must replay target plus sibling without list/COLD; provider cursor rejection/expiry invokes the existing typed COLD policy, while ordinary drift/failure cannot be reclassified as cursor expiry.
    discretion:
      - id: discretion-private-checkpoint-replay
        unit_ref: unit-current-observation
        question: Choose the private reversible cache/cursor representation and procedure that establishes last-committed target-plus-sibling replay after an ordinary incomplete cycle while the cursor remains usable.
        scope:
          files: [src/fs/caching/remote-fs.ts]
          component: component-current-observation
          visibility: private
        escalate_when:
          - The choice adds or changes a shared filesystem, checkpoint, cache, cursor, or orchestration API.
          - The choice adds persisted coordination state, a field/schema/migration, or a recovery-only provider call.
          - The choice changes observable usable-cursor replay semantics, target-plus-sibling coverage, no-list/no-COLD behavior, cursor-rejection/expiry classification, quiescence ordering, or clean-finalization behavior.
        constraints:
          - Keep the mechanism reversible, provider-call-free for recovery, and private to CachingRemoteFs.
          - Preserve successful filesystem effects and SyncRecords; convergence occurs through current-state incremental replay.
        preserves:
          contract_refs: [contract-checkpoint-replay, contract-component-finalization]
          invariant_refs: [FR-LATE-10]
        verification_refs: [verify-last-committed-replay, verify-incremental-replay, verify-cursor-expiry-partition]
        difficulty_inputs:
          decision_reasoning: local_tradeoff
          boundary_reach: private
          context_scope: files
          reversibility: bounded
          verification_strength: discriminating
          runtime_risk: lifecycle
          coupling: shared_across_units
          grounding: evidenced

