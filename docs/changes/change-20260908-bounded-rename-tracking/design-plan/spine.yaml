  - id: unit-brt-4-fixed-point-cleanup
    depends_on: [unit-brt-3-cover-execution-preflight]
    contract_refs: [contract-content-addressed-sibling, contract-child-publication, contract-terminal-tracker-consumption, contract-cover-fixed-point, contract-stale-record-cleanup]
  - id: unit-brt-5-projections-docs
    depends_on: [unit-brt-4-fixed-point-cleanup]
    contract_refs: [contract-audit-only-projection]

