  - {id: AC-BRT-009, requirement_refs: [FR-BRT-010, FR-BRT-011, INV-BRT-001, NFR-BRT-003], test_refs: [verify-retain-terminal-record, verify-foreign-candidate-independent, verify-retain-pending-ordinary-baseline, verify-reportless-retry-predicate, verify-cleanup-no-delete-authority]}
  - {id: AC-BRT-010, ux_ref: UAC-BRT-009, requirement_refs: [FR-BRT-008, FR-BRT-009, FR-BRT-015, FR-BRT-017, INV-BRT-001, NFR-BRT-003], test_refs: [verify-latent-collision-preflight, verify-no-same-cycle-reroute, verify-next-cycle-cover]}

